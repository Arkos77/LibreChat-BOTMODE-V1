name: BOTMODE Approved Result Source Publication From Exact Qualified Image
'on':
  push:
    branches:
    - ops/publish-ec0da8d0277f-approved
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-ec0da8d0277f-once
  cancel-in-progress: false
env:
  APP_SOURCE: ec0da8d0277ffa9895086ae65e1bf20378ad2f39
  LOCAL_IMAGE: botmode-source-built:ec0da8d0277ffa9895086ae65e1bf20378ad2f39
  REPOSITORY: ghcr.io/arkos77/librechat-botmode-v1
jobs:
  publish-arch:
    if: github.repository == 'Arkos77/LibreChat-BOTMODE-V1' && github.run_attempt
      == 1 && github.event.before == 'ec0da8d0277ffa9895086ae65e1bf20378ad2f39'
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
          configId: sha256:6d2f24ed736acb547c0a408ad3ac9ee96af9a6956271e7083869f93894a2d8de
    env:
      PUBLISH_ARCH: ${{ matrix.arch }}
      EXPECTED_CONFIG_ID: ${{ matrix.configId }}
    steps:
    - name: Require successful exact qualification before publication
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 - <<''PY_PROOF''

        import json,os,urllib.request

        url=''https://api.github.com/repos/Arkos77/LibreChat-BOTMODE-V1/actions/runs/40042483574''

        req=urllib.request.Request(url,headers={''Authorization'':''Bearer ''+os.environ[''GH_TOKEN''],''Accept'':''application/vnd.github+json''})

        run=json.load(urllib.request.urlopen(req,timeout=30))

        assert run[''head_sha'']==''efbb4c59c9e9779fd1c8b773105c6a44efb15184''

        assert run[''status'']==''completed'' and run[''conclusion'']==''success''
        and run[''run_attempt'']==1

        print(''EXACT_QUALIFICATION_SUCCESS_REQUIRED=PASS'')

        PY_PROOF

        '
    - uses: actions/download-artifact@v4
      with:
        name: botmode-final-ec0da8d0277f-${{ matrix.arch }}-40042483574
        run-id: 40042483574
        github-token: ${{ github.token }}
        path: /tmp/retained
    - name: Restore exact already-qualified source image; no compilation
      run: "set -euo pipefail\ntest \"$(cat /tmp/retained/final-source.txt)\" = \"\
        $APP_SOURCE\"\n(cd /tmp/retained && sha256sum -c final-image.sha256)\ngzip\
        \ -dc /tmp/retained/final-image.tar.gz | docker load\npython3 - <<'PY_CANONICAL'\n\
        import hashlib,json,os,subprocess,tarfile\nwith tarfile.open('/tmp/retained/final-image.tar.gz','r:gz')\
        \ as archive:\n manifest=json.load(archive.extractfile('manifest.json'))\n\
        \ entries=[x for x in manifest if os.environ['LOCAL_IMAGE'] in (x.get('RepoTags')\
        \ or [])]\n assert len(entries)==1\n raw=archive.extractfile(entries[0]['Config']).read()\n\
        \ assert 'sha256:'+hashlib.sha256(raw).hexdigest()==os.environ['EXPECTED_CONFIG_ID']\n\
        \ config=json.loads(raw)\nlocal=json.loads(subprocess.check_output(['docker','image','inspect',os.environ['LOCAL_IMAGE']],text=True))[0]\n\
        assert config['architecture']==local['Architecture']==os.environ['PUBLISH_ARCH']\n\
        assert local['RootFS']['Layers']==config['rootfs']['diff_ids']\nfor key in\
        \ ['Env','Entrypoint','Cmd','WorkingDir','User']:assert local['Config'].get(key)==config['config'].get(key)\n\
        assert 'BUILD_COMMIT='+os.environ['APP_SOURCE'] in local['Config']['Env']\n\
        print('CANDIDATE_RESTORED_CANONICAL_CONFIG_ROOTFS_SOURCE=PASS')\nPY_CANONICAL\n\
        echo CANDIDATE_RESTORED_VERIFIED_IMAGE_NO_BUILD=PASS\n"
    - name: Publish only source-specific architecture candidate
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'set -euo pipefail

        printf ''%s'' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR"
        --password-stdin

        docker tag "$LOCAL_IMAGE" "$REPOSITORY:sha-ec0da8d0277f-$PUBLISH_ARCH"

        docker push --platform "linux/$PUBLISH_ARCH" "$REPOSITORY:sha-ec0da8d0277f-$PUBLISH_ARCH"
        | tee /tmp/candidate-push.txt

        python3 - <<''PY_PUSH''

        import json,os,re

        from pathlib import Path

        found=re.findall(r''digest: (sha256:[0-9a-f]{64})'',Path(''/tmp/candidate-push.txt'').read_text())

        assert len(set(found))==1,''PUSH_DIGEST_UNAMBIGUOUS_REQUIRED''

        Path(''/tmp/''+os.environ[''PUBLISH_ARCH'']+''.json'').write_text(json.dumps({''arch'':os.environ[''PUBLISH_ARCH''],''digest'':found[0],''configId'':os.environ[''EXPECTED_CONFIG_ID''],''source'':os.environ[''APP_SOURCE'']}))

        print(''CANDIDATE_ARCH_PUSH_DIGEST=''+found[0])

        PY_PUSH

        '
    - uses: actions/upload-artifact@v4
      with:
        name: published-metadata-${{ matrix.arch }}
        path: /tmp/${{ matrix.arch }}.json
        retention-days: 1
    - name: Remove runner authentication
      if: always()
      run: docker logout ghcr.io || true
  publish-index:
    needs: publish-arch
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_IDS: '{"amd64": "sha256:6d2f24ed736acb547c0a408ad3ac9ee96af9a6956271e7083869f93894a2d8de"}'
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: published-metadata-*
        merge-multiple: true
        path: /tmp/metadata
    - name: Login for candidate index publication only
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'printf ''%s'' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR"
        --password-stdin

        '
    - name: Publish digest-pinned candidate index and verify anonymous visibility
      run: "set -euo pipefail\npython3 - <<'PY_INDEX'\nimport json,os,subprocess\n\
        from pathlib import Path\nproof=[json.loads(Path('/tmp/metadata/'+a+'.json').read_text())\
        \ for a in ['amd64']]\nexpected=json.loads(os.environ['EXPECTED_IDS'])\nfor\
        \ p in proof:\n assert p['source']==os.environ['APP_SOURCE'] and p['configId']==expected[p['arch']]\n\
        \ reference=os.environ['REPOSITORY']+'@'+p['digest']\n raw=subprocess.check_output(['docker','buildx','imagetools','inspect','--raw',reference],text=True)\n\
        \ assert json.loads(raw)['config']['digest']==p['configId'],'REMOTE_CONFIG_ID_MISMATCH'\n\
        refs=[os.environ['REPOSITORY']+'@'+p['digest'] for p in proof]\nsubprocess.run(['docker','buildx','imagetools','create','--tag',os.environ['REPOSITORY']+':sha-ec0da8d0277f',*refs],check=True)\n\
        PY_INDEX\ndocker logout ghcr.io\n# Public, anonymous verification of only\
        \ the newly approved candidate tag.\ndocker buildx imagetools inspect --raw\
        \ \"$REPOSITORY:sha-ec0da8d0277f\" > /tmp/candidate-index.json\npython3 -\
        \ <<'PY_VERIFY'\nimport json\nfrom pathlib import Path\nindex=json.loads(Path('/tmp/candidate-index.json').read_text())\n\
        platforms={m.get('platform',{}).get('architecture') for m in index.get('manifests',[])\
        \ if m.get('platform',{}).get('os')=='linux'}\nassert platforms=={'amd64'},'NATIVE_ARCHITECTURES_REQUIRED'\n\
        print('CANDIDATE_PUBLIC_AMD64_INDEX=PASS')\nPY_VERIFY\ndocker buildx imagetools\
        \ inspect \"$REPOSITORY:sha-ec0da8d0277f\" --format '{{.Manifest.Digest}}'\
        \ > /tmp/candidate-digest.txt\ncat /tmp/candidate-digest.txt\necho 'STABLE_LATEST_RELEASE_MERGE_INSTALL_CHANGED=FALSE'\n"
    - uses: actions/upload-artifact@v4
      with:
        name: candidate-ec0da8d0277f-publication-proof
        path: '/tmp/candidate-digest.txt

          /tmp/candidate-index.json'
        retention-days: 7
    - name: Remove runner authentication
      if: always()
      run: docker logout ghcr.io || true
