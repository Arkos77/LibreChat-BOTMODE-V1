name: BOTMODE V1 Live Provider Preflight

# Manual only: never run paid-provider calls on a push or PR.
on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: "Gemini API model identifier (not the LibreChat display label)"
        required: true
        default: gemini-2.5-flash
        type: string
      check_openrouter:
        description: "Also verify configured OpenRouter access"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  provider-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify pinned PR14 candidate
        uses: actions/checkout@v4
        with:
          ref: ea24f476164153735b5f5c95fe9c7861d4f97a1f
          persist-credentials: false
      - name: Check immutable revision
        run: test "$(git rev-parse HEAD)" = "ea24f476164153735b5f5c95fe9c7861d4f97a1f"
      - name: Validate provider credentials and real inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          CHECK_OPENROUTER: ${{ inputs.check_openrouter }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Missing repository Actions secret GEMINI_API_KEY"
            exit 1
          fi
          # Guard model string prior to placing it in an API URL.
          [[ "$GEMINI_MODEL" =~ ^[a-zA-Z0-9._-]+$ ]] || { echo "::error::Invalid model identifier"; exit 1; }
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          from urllib.parse import quote
          def verify(label,url,payload,headers):
              data=json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      result=json.load(r)
              except urllib.error.HTTPError as e:
                  # Never echo response bodies or credentials.
                  raise SystemExit(f"{label}: HTTP {e.code}; check key, quota, permissions and model")
              except Exception as e:
                  raise SystemExit(f"{label}: connection failed ({type(e).__name__})")
              if label=="Gemini":
                  ok=bool(result.get("candidates"))
              else:
                  ok=bool(result.get("choices"))
              if not ok: raise SystemExit(f"{label}: HTTP succeeded but no generation candidate")
              print(f"{label}: inference response validated (contents redacted)")
          failures=[]
          model=os.environ["GEMINI_MODEL"]
          try:
              req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",
                  headers={"x-goog-api-key":os.environ["GEMINI_API_KEY"]})
              with urllib.request.urlopen(req,timeout=35) as resp:
                  available=json.load(resp).get("models",[])
              supported=[m["name"].split("/",1)[-1] for m in available
                  if "generateContent" in m.get("supportedGenerationMethods",[])]
              if not supported:
                  raise RuntimeError("No generateContent-compatible models in Gemini API listing")
              candidates=([model] if model in supported else []) + [
                  m for m in supported if m != model and "flash" in m.lower()
              ][:4]
              if not candidates:
                  candidates=supported[:3]
              # A model can be listed yet still return 404 at generation time.
              # Retry only 404; auth, quota or billing failures stop immediately.
              last_404=False
              for candidate in candidates[:4]:
                  try:
                      verify("Gemini","https://generativelanguage.googleapis.com/v1beta/models/"+quote(candidate)+":generateContent",
                          {"contents":[{"parts":[{"text":"Reply with OK."}]}],"generationConfig":{"maxOutputTokens":32}},
                          {"Content-Type":"application/json","x-goog-api-key":os.environ["GEMINI_API_KEY"]})
                      print("Gemini model validated:",candidate)
                      last_404=False
                      break
                  except SystemExit as exc:
                      if "HTTP 404" not in str(exc):
                          raise
                      print("Gemini model returned HTTP 404:",candidate)
                      last_404=True
              if last_404:
                  raise RuntimeError("All tried Gemini models returned HTTP 404")
          except (Exception,SystemExit) as exc:
              print("Gemini validation failed:",str(exc) if isinstance(exc,SystemExit) else type(exc).__name__)
              failures.append("Gemini")
          if os.environ["CHECK_OPENROUTER"].lower()=="true":
              token=os.environ.get("OPENROUTER_API_KEY","")
              if not token:
                  print("OpenRouter: missing Actions secret OPENROUTER_API_KEY")
                  failures.append("OpenRouter")
              else:
                  try:
                      verify("OpenRouter","https://openrouter.ai/api/v1/chat/completions",
                          {"model":"openrouter/free","messages":[{"role":"user","content":"Reply with OK."}],"max_tokens":16},
                          {"Content-Type":"application/json","Authorization":"Bearer "+token})
                  except (Exception,SystemExit) as exc:
                      print("OpenRouter validation failed:",str(exc) if isinstance(exc,SystemExit) else type(exc).__name__)
                      failures.append("OpenRouter")
          if failures:
              raise SystemExit("Provider readiness failed: "+", ".join(failures))
          PY
      - name: Scope of this result
        if: success()
        run: |
          echo "### Provider access proved only" >> "$GITHUB_STEP_SUMMARY"
          echo "This does NOT prove Worker -> specialist -> Oracle -> publication." >> "$GITHUB_STEP_SUMMARY"
