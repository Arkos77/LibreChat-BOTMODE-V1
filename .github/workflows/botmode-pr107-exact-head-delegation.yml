                if(!t.attemptKey||!row.messageId){invalid++;continue;}
                const start=t.status==='running';
                const suffix=start?':user':':assistant';
                if(!row.messageId.endsWith(suffix)){invalid++;continue;}
                const id=JSON.stringify([thread.conversationId,row.messageId.slice(0,-suffix.length),t.attemptKey]);
                if(start)running.add(id);
                else if(t.status==='completed')terminal.add(id);
                else if(t.status==='error'||t.status==='cancelled')failed++;
              }
              pending += [...running].filter(id=>!terminal.has(id)).length;
              settled += [...terminal].filter(id=>running.has(id)).length;
            }
            console.log('CI_PR107_TASK_DIAG_THREADS='+threads.length);
            console.log('CI_PR107_TASK_DIAG_ROWS='+rowsCount);
            console.log('CI_PR107_TASK_DIAG_PENDING='+pending);
            console.log('CI_PR107_TASK_DIAG_MATCHED_TERMINALS='+settled);
            console.log('CI_PR107_TASK_DIAG_PARENT_MISMATCH='+unlinked);
            console.log('CI_PR107_TASK_DIAG_INVALID='+invalid);
            console.log('CI_PR107_TASK_DIAG_FAILED='+failed);
            await mongoose.disconnect();
          })().catch(e=>{console.log('CI_PR107_TASK_DIAG_UNAVAILABLE='+e.name);process.exitCode=1});
          NODE_TASK_DIAG
      - name: Always destroy disposable stack
        if: always()
        env:
          BOTMODE_MONGO_PASSWORD: ci-isolated-only
          POSTGRES_PASSWORD: ci-isolated-only
          BOTMODE_IMAGE: ${{ env.BOTMODE_HEAD_IMAGE }}
        run: sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes --remove-orphans || true
