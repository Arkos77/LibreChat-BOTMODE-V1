name: Combined Firebase and Tailwind Security Integration
on:
  push:
    branches: [botmode-v1-security-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify committed lockfile installs without regeneration
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synchronize dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update moment --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify security dependency graph
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const l=require('./package-lock.json').packages;
          assert.equal(l['node_modules/tailwindcss']?.version,'3.4.19');
          assert.equal(l['node_modules/handlebars']?.version,'4.7.10');
          assert.equal(l['node_modules/dompurify']?.version,'3.4.16');
          assert.equal(l['node_modules/moment']?.version,'2.31.0','Moment must be patched');
          assert.ok(l['node_modules/@firebase/storage']);
          assert.ok(l['node_modules/@firebase/app']);
          assert.ok(!l['node_modules/firebase']);
          assert.ok(!l['node_modules/@firebase/firestore']);
          console.log('COMBINED_SECURITY_DEPS=PASS');
          JS
      - name: Clean npm installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build LibreChat workspaces and frontend
        run: |
          npm run build --workspace librechat-data-provider
          npm run build --workspace @librechat/data-schemas
          npm run build --workspace @librechat/client
          npm run build --workspace @librechat/api
          npm run build --workspace @librechat/frontend
      - name: CDN regression suites
        run: npm exec --workspace @librechat/api -- jest --runInBand --coverage=false --runTestsByPath src/cdn/__tests__/s3.test.ts src/cdn/__tests__/cloudfront.test.ts
      - name: Assert committed lockfile is reproducible
        run: git diff --exit-code -- package-lock.json
      - name: Identify exact high-severity dependency owners
        shell: bash
        run: |
          set -euo pipefail
          npm ls braces chokidar micromatch fast-glob postcss-selector-parser postcss-nested katex mermaid rehype-katex --all --depth=3 || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/security-audit.json" || true
          node - "$RUNNER_TEMP/security-audit.json" <<'JS'
          const fs=require('node:fs');
          const audit=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for (const [name,v] of Object.entries(audit.vulnerabilities||{})) {
            if (v.severity !== 'high' && v.severity !== 'critical') continue;
            console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,effects:v.effects,fixAvailable:v.fixAvailable}));
          }
          console.log('HIGH_SEVERITY_COUNT='+audit.metadata?.vulnerabilities?.high);
          JS
      - name: Inspect production-only Tailwind reachability
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PACKAGE DECLARATIONS ==='
          node <<'JS'
          for (const name of ['./client/package.json','./packages/client/package.json','./api/package.json']) {
            const p=require(name);
            console.log(JSON.stringify({workspace:p.name,tailwindDependency:p.dependencies?.tailwindcss||null,tailwindDevDependency:p.devDependencies?.tailwindcss||null,nodemonDependency:p.dependencies?.nodemon||null,nodemonDevDependency:p.devDependencies?.nodemon||null}));
          }
          JS
          echo '=== PRODUCTION TREE ==='
          npm ls --omit=dev tailwindcss braces chokidar micromatch fast-glob --all --depth=4 || true
      - name: Report all dependency vulnerabilities including dev
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/full-security-audit.json" || true
          node - "$RUNNER_TEMP/full-security-audit.json" <<'JS'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('FULL_AUDIT_COUNTS='+JSON.stringify(a.metadata?.vulnerabilities||{}));
          const findings=Object.entries(a.vulnerabilities||{})
            .filter(([,v])=>v.severity==='high'||v.severity==='moderate')
            .sort(([a],[b])=>a.localeCompare(b));
          for (const [name,v] of findings) {
            const advisories=(v.via||[])
              .filter(item=>typeof item==='object')
              .map(item=>({title:item.title,url:item.url,range:item.range}));
            console.log('FULL_AUDIT_FINDING='+JSON.stringify({
              name,severity:v.severity,range:v.range,isDirect:v.isDirect,
              effects:v.effects,advisories,fixAvailable:v.fixAvailable
            }));
          }
          console.log('FULL_AUDIT_REPORTED_FINDINGS='+findings.length);
          console.log('PRODUCTION_ALERTS_ARE_TRACKED_SEPARATELY');
          JS
      - name: Production vulnerability baseline
        run: npm audit --omit=dev --audit-level=critical
