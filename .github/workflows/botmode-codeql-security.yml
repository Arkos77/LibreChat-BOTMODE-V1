name: BOTMODE CodeQL JavaScript TypeScript Security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/botmode-codeql-security.yml'
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/botmode-codeql-security.yml'
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package*.json'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: botmode-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-javascript-typescript:
    name: CodeQL JS/TS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL for JS and TS
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze JS and TS
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
