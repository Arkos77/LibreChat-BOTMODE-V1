name: BOTMODE D03 Published Exact OCI License Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-oci-license:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout source only for license evidence script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify D03 source ancestry and exact published OCI license documents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor '7605e9186b84d4a7eb6d14be1bc9528c6033bbd8' HEAD
          bash scripts/botmode/verify-published-oci-license.sh
