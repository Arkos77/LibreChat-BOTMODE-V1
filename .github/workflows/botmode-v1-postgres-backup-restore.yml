name: BOTMODE V1 Disposable PostgreSQL Backup Restore

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-postgres-backup-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Start isolated source and restore PostgreSQL instances
        shell: bash
        run: |
          set -euo pipefail
          docker pull pgvector/pgvector:0.8.0-pg15-trixie
          for n in source restored; do
            docker run -d --name "botmode-pg-$n" -e POSTGRES_PASSWORD=ci-disposable-only -e POSTGRES_USER=myuser -e POSTGRES_DB=mydatabase pgvector/pgvector:0.8.0-pg15-trixie
            ready=0
            for i in $(seq 1 90); do
              if docker exec "botmode-pg-$n" pg_isready -U myuser -d mydatabase >/dev/null; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1
          done
          echo 'BOTMODE_POSTGRES_INSTANCES_READY=PASS'
      - name: Restore native SQL dump into second instance and verify after restart
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i botmode-pg-source psql -v ON_ERROR_STOP=1 -U myuser -d mydatabase <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE TABLE rollback_ci (id text PRIMARY KEY, embedding vector(3));
          INSERT INTO rollback_ci VALUES ('backup-restore-probe', '[1,2,3]');
          SQL
          docker exec botmode-pg-source pg_dump -U myuser -d mydatabase -Fc > "$RUNNER_TEMP/botmode-pg.dump"
          test -s "$RUNNER_TEMP/botmode-pg.dump"
          docker exec -i botmode-pg-restored pg_restore --exit-on-error -U myuser -d mydatabase < "$RUNNER_TEMP/botmode-pg.dump"
          test "$(docker exec botmode-pg-restored psql -tA -U myuser -d mydatabase -c "SELECT count(*) FROM rollback_ci WHERE id='backup-restore-probe' AND embedding='[1,2,3]'::vector" | tr -d '\r')" = 1
          docker restart botmode-pg-restored >/dev/null
          for i in $(seq 1 90); do
            if docker exec botmode-pg-restored pg_isready -U myuser -d mydatabase >/dev/null; then break; fi
            sleep 2
          done
          test "$(docker exec botmode-pg-restored psql -tA -U myuser -d mydatabase -c "SELECT count(*) FROM rollback_ci WHERE id='backup-restore-probe' AND embedding='[1,2,3]'::vector" | tr -d '\r')" = 1
          echo 'BOTMODE_POSTGRES_BACKUP_RESTORE_CROSS_INSTANCE=PASS'
          echo 'BOTMODE_POSTGRES_VECTOR_RESTART_PERSISTENCE=PASS'
          echo 'SCOPE=PostgreSQL/pgvector dump restore only; NOT full-stack migration, Meilisearch, files, agents or missions'
      - name: Remove disposable instances and dump
        if: always()
        run: |
          docker rm -f -v botmode-pg-source botmode-pg-restored >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/botmode-pg.dump"
