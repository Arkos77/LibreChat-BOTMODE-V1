name: BOTMODE V1.0.6 isolated XML dependency regeneration
on:
  push:
    branches:
      - qualification/v106-xml-remediation-20261111
    paths:
      - .github/workflows/botmode-v106-xml-lock-refresh.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.repository == 'Arkos77/LibreChat-BOTMODE-V1'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
      - name: Apply exact two-package correction only
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const api = JSON.parse(fs.readFileSync('api/package.json', 'utf8'));
          if (root.overrides?.['fast-xml-parser'] !== '5.7.2') throw new Error('Unexpected prior XML override');
          if (api.dependencies?.['@aws-sdk/s3-request-presigner'] !== '^3.758.0') throw new Error('Unexpected prior S3 presigner');
          if (api.dependencies?.['@aws-sdk/client-s3'] !== '^3.980.0') throw new Error('Unexpected prior S3 client');
          root.overrides['fast-xml-parser'] = '5.12.0';
          api.dependencies['@aws-sdk/s3-request-presigner'] = '3.980.0';
          fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');
          fs.writeFileSync('api/package.json', JSON.stringify(api, null, 2) + '\n');
          console.log('BOTMODE_XML_EXACT_PIN_EDIT=PASS');
          JS
      - name: Regenerate npm lockfile without scripts or paid services
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'BOTMODE_XML_NPM_LOCK_REGENERATED=PASS'
      - name: Verify no vulnerable XML parser or unexpected scope
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entries = Object.entries(lock.packages ?? {})
            .filter(([p]) => p === 'node_modules/fast-xml-parser' || p.endsWith('/node_modules/fast-xml-parser'));
          if (!entries.length) throw new Error('No fast-xml-parser lock entry');
          for (const [path, pkg] of entries) {
            if (pkg.version !== '5.12.0') throw new Error('Unpatched XML parser: ' + path + ' ' + pkg.version);
          }
          const p = lock.packages['node_modules/@aws-sdk/s3-request-presigner'];
          if (p?.version !== '3.980.0') throw new Error('S3 presigner not aligned: ' + p?.version);
          console.log('BOTMODE_XML_ALL_LOCKED_PARSERS=' + entries.length);
          console.log('BOTMODE_XML_ALL_PARSERS_PATCHED=PASS');
          console.log('BOTMODE_AWS_PRESIGNER_ALIGNED=PASS');
          JS
          git diff --check
          git diff --stat
          node <<'JS'
          const cp = require('child_process');
          const changed = cp.execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const expected = ['api/package.json', 'package-lock.json', 'package.json'].sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error('Unexpected changed files: ' + changed.join(','));
          const n = cp.execFileSync('git', ['diff', '--numstat'], {encoding:'utf8'}).trim().split('\n').reduce((sum, line) => {
            const [a,d] = line.split('\t'); return sum + (+a || 0) + (+d || 0);
          },0);
          if (n > 3500) throw new Error('Dependency diff too large, manual review required: ' + n);
          console.log('BOTMODE_XML_DIFF_SCOPE=PASS lines=' + n);
          JS
      - name: Commit isolated regenerated lockfile (NOT the release branch)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'qualification/v106-xml-remediation-20261111'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json api/package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix(deps): align S3 presigner and patch XML parser (isolated)'
          git push origin HEAD:refs/heads/qualification/v106-xml-remediation-20261111
          echo 'BOTMODE_XML_ISOLATED_COMMIT=PASS'
