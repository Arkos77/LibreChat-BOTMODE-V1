name: BOTMODE V1 Published OCI License Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-published-oci-license-audit.yml'
      - 'scripts/botmode/verify-published-oci-license.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-oci-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source only for license evidence script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact published OCI license documents
        shell: bash
        run: bash scripts/botmode/verify-published-oci-license.sh
