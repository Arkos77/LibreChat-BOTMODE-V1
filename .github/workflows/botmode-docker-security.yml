name: BOTMODE Docker Security Distribution
on:
  pull_request:
    paths:
      - 'docker-compose.botmode.yml'
      - 'docker-compose.botmode-lite.yml'
      - 'scripts/botmode/bootstrap.sh'
      - 'scripts/botmode/verify-runtime-distribution.sh'
      - 'docs/BOT_MODE_INSTALL.md'
      - '.github/workflows/botmode-docker-security.yml'
  workflow_dispatch:
    inputs:
      go_security_only:
        description: Verify patched grpc-go module only; skip Docker profiles already qualified
        type: boolean
        default: false
      vite_security_only:
        description: Qualify exact patched Vite 8.2.4 root lock and browser build
        type: boolean
        default: false
      happy_dom_security_only:
        description: Verify Happy DOM 21.0.4 and six Jest suites on isolated runner
        type: boolean
        default: false
      happy_dom_bun_diag_only:
        description: Inspect Bun-only lock delta without rerunning the 66 PASS Jest tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  happy-dom-bun-diagnostic:
    if: ${{ inputs.happy_dom_bun_diag_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = simplify/botmode-v1-lot-a-20261102
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Inspect Bun lock reconciliation only (no installs or app tests)
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          echo 'BOTMODE_HAPPY_BUN_DIFF_BEGIN'
          git diff --numstat -- bun.lock
          git diff -- bun.lock | head -130
          echo 'BOTMODE_HAPPY_BUN_DIFF_END'
  happy-dom-patch-security:
    if: ${{ inputs.happy_dom_security_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate and patched Jest environment dependency
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = simplify/botmode-v1-lot-a-20261102
          node - <<'JS'
          const lock=require('./package-lock.json').packages;
          const manifest=require('./client/package.json');
          if (manifest.devDependencies['@happy-dom/jest-environment'] !== '^21.0.4' ||
              lock['node_modules/@happy-dom/jest-environment']?.version !== '21.0.4' ||
              lock['node_modules/happy-dom']?.version !== '21.0.4') process.exit(1);
          console.log('BOTMODE_HAPPY_DOM_EXACT_LOCK=PASS');
          JS
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - name: Clean npm install, builds and actual Happy DOM Jest suites
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:client-package
          (cd packages/data-provider && npx jest --ci --runInBand --coverage=false --runTestsByPath \
            specs/request-interceptor.spec.ts \
            specs/request-interceptor-subdir.spec.ts)
          (cd client && npx jest --ci --runInBand --coverage=false --runTestsByPath \
            src/components/Web/__tests__/SourcesErrorBoundary.test.tsx \
            src/hooks/__tests__/AuthContext.spec.tsx \
            src/hooks/__tests__/useFavorites.spec.tsx \
            src/hooks/__tests__/useIsActiveItem.spec.tsx)
          test -z "$(git status --porcelain -- client/package.json package-lock.json)"
          echo 'BOTMODE_HAPPY_DOM_21_0_4_JEST_REGRESSION=PASS'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Validate Bun frozen lockfile without regenerating dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          test -z "$(git status --porcelain -- bun.lock)"
          echo 'BOTMODE_HAPPY_DOM_BUN_FROZEN_LOCK=PASS'
  vite-patch-security:
    if: ${{ inputs.vite_security_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate Vite patch metadata
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = simplify/botmode-v1-lot-a-20261102
          node -e 'const p=require("./package-lock.json").packages; if(p["node_modules/vite"]?.version!=="8.2.4")process.exit(1)'
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install clean locked dependencies and compile client with patched Vite
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:client-package
          npm run build:client
          test -z "$(git status --porcelain -- package-lock.json client/package.json)"
          echo 'BOTMODE_VITE_8_2_4_CLEAN_LOCK_FRONTEND_BUILD=PASS'
  go-grpc-security:
    if: ${{ inputs.go_security_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate and official patched grpc-go pin
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = simplify/botmode-v1-lot-a-20261102
          grep -q 'google.golang.org/grpc v1.83.2' otel/langfuse-fanout/go.mod
      - uses: actions/setup-go@v6
        with:
          go-version-file: otel/langfuse-fanout/go.mod
          cache-dependency-path: otel/langfuse-fanout/go.sum
      - name: Verify Go module and compile/tests (no Docker or production services)
        working-directory: otel/langfuse-fanout
        run: |
          set -euo pipefail
          go mod download
          go mod tidy
          go mod verify
          go test ./...
          if ! git diff --quiet -- go.mod go.sum; then
            echo 'BOTMODE_GO_LOCK_TIDY_DIFF_BEGIN'
            git diff -- go.mod go.sum
            echo 'BOTMODE_GO_LOCK_TIDY_DIFF_END'
            exit 1
          fi
          echo 'BOTMODE_GO_GRPC_1_83_2_PATCHED_AND_TESTED=PASS'
  compose-auth:
    if: ${{ !inputs.go_security_only && !inputs.vite_security_only && !inputs.happy_dom_security_only && !inputs.happy_dom_bun_diag_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, lite]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic local-only credentials
        run: |
          cp .env.example .env
          chmod 600 .env
          echo 'BOTMODE_MONGO_PASSWORD=ci-only-mongo-credential' >> .env
          echo 'POSTGRES_PASSWORD=ci-only-postgres-credential' >> .env
          echo 'MEILI_MASTER_KEY=ci-only-meili-key' >> .env
      - name: Validate both Compose profiles
        run: ./scripts/botmode/verify-runtime-distribution.sh
      - name: Retry temporary Docker Hub pull failures
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          images=(mongo:8.0.20)
          if [ "$PROFILE" = lite ]; then
            images=(mongo:4.4.29)
          else
            images+=(pgvector/pgvector:0.8.0-pg15-trixie)
          fi
          for image in "${images[@]}"; do
            pulled=0
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then pulled=1; break; fi
              if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
            done
            if [ "$pulled" -ne 1 ]; then
              echo "::error::Unable to download required CI image $image"
              exit 1
            fi
          done
      - name: Start only databases
        env:
          BOTMODE_MONGO_PASSWORD: ci-only-mongo-credential
          POSTGRES_PASSWORD: ci-only-postgres-credential
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          args=(-f docker-compose.botmode.yml)
          if [ "$PROFILE" = lite ]; then args+=(-f docker-compose.botmode-lite.yml); fi
          docker compose "${args[@]}" up -d mongodb
          if [ "$PROFILE" = full ]; then docker compose "${args[@]}" up -d vectordb; fi
      - name: Verify login with correct and incorrect credentials
        env:
          BOTMODE_MONGO_PASSWORD: ci-only-mongo-credential
          POSTGRES_PASSWORD: ci-only-postgres-credential
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          args=(-f docker-compose.botmode.yml)
          if [ "$PROFILE" = lite ]; then args+=(-f docker-compose.botmode-lite.yml); fi
          ok=0
          for attempt in $(seq 1 60); do
            if docker compose "${args[@]}" exec -T mongodb sh -ec '
              if command -v mongosh >/dev/null; then cli=mongosh; else cli=mongo; fi
              "$cli" --quiet --authenticationDatabase admin -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --eval "db.adminCommand({ping:1}).ok" | grep -q 1
            ' >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          if docker compose "${args[@]}" exec -T mongodb sh -ec '
            if command -v mongosh >/dev/null; then cli=mongosh; else cli=mongo; fi
            "$cli" --quiet --authenticationDatabase admin -u "$MONGO_INITDB_ROOT_USERNAME" -p wrong-password --eval "db.adminCommand({ping:1})"
          ' >/dev/null 2>&1; then echo "Mongo incorrect password was accepted" >&2; exit 1; fi
          if [ "$PROFILE" = full ]; then
            ok=0
            for attempt in $(seq 1 40); do
              if docker compose "${args[@]}" exec -T vectordb sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$(hostname -i)" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1" | grep -q 1' >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
            if docker compose "${args[@]}" exec -T -e PGPASSWORD=wrong-password vectordb sh -ec 'psql -h "$(hostname -i)" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1"' >/dev/null 2>&1; then
              echo "Postgres incorrect password was accepted" >&2; exit 1
            fi
          fi
      - name: Verify authenticated restart with preserved volumes
        env:
          BOTMODE_MONGO_PASSWORD: ci-only-mongo-credential
          POSTGRES_PASSWORD: ci-only-postgres-credential
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          args=(-f docker-compose.botmode.yml)
          if [ "$PROFILE" = lite ]; then args+=(-f docker-compose.botmode-lite.yml); fi
          docker compose "${args[@]}" restart mongodb
          if [ "$PROFILE" = full ]; then docker compose "${args[@]}" restart vectordb; fi
          ready=0
          for attempt in $(seq 1 60); do
            if docker compose "${args[@]}" exec -T mongodb sh -ec '
              if command -v mongosh >/dev/null; then cli=mongosh; else cli=mongo; fi
              "$cli" --quiet --authenticationDatabase admin -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --eval "db.adminCommand({ping:1}).ok" | grep -q 1
            ' >/dev/null 2>&1; then
              if [ "$PROFILE" = lite ] || docker compose "${args[@]}" exec -T vectordb sh -ec '
                PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$(hostname -i)" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1" | grep -q 1
              ' >/dev/null 2>&1; then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1
      - name: Diagnose failures
        if: failure()
        env:
          BOTMODE_MONGO_PASSWORD: ci-only-mongo-credential
          POSTGRES_PASSWORD: ci-only-postgres-credential
        run: docker compose -f docker-compose.botmode.yml ps
      - name: Remove test containers and volumes
        if: always()
        env:
          BOTMODE_MONGO_PASSWORD: ci-only-mongo-credential
          POSTGRES_PASSWORD: ci-only-postgres-credential
        run: docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down -v --remove-orphans
