name: librechat-botmode

services:
  api:
    image: ${BOTMODE_IMAGE:-ghcr.io/arkos77/librechat-botmode-v1:edge}
    restart: always
    shm_size: "256m"
    ports:
      - "${BOTMODE_HOST_PORT:-3080}:3080"
    depends_on:
      mongodb:
        condition: service_started
        required: true
      rag_api:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://botmode_admin:${BOTMODE_MONGO_PASSWORD:?Set BOTMODE_MONGO_PASSWORD in .env}@mongodb:27017/LibreChat?authSource=admin
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - SCHEDULES_SINGLE_PROCESS=${SCHEDULES_SINGLE_PROCESS:-true}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
    volumes:
      - ./.env:/app/.env:ro
      - ./librechat.yaml:/app/librechat.yaml:ro
      - botmode-images:/app/client/public/images
      - botmode-uploads:/app/uploads
      - botmode-logs:/app/logs
      - botmode-skills:/app/skill
      - botmode-librechat-data:/app/data

  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    restart: always
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      - api
    environment:
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET:-}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

  mongodb:
    image: mongo:8.0.20
    restart: always
    volumes:
      - botmode-mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: botmode_admin
      MONGO_INITDB_ROOT_PASSWORD: ${BOTMODE_MONGO_PASSWORD:?Set BOTMODE_MONGO_PASSWORD in .env}
    command: ["mongod", "--auth"]

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    volumes:
      - botmode-meili-data:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: always
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - botmode-pgdata:/var/lib/postgresql/data

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
    environment:
      - DB_HOST=vectordb
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - RAG_PORT=${RAG_PORT:-8000}

volumes:
  botmode-librechat-data:
  botmode-images:
  botmode-uploads:
  botmode-logs:
  botmode-skills:
  botmode-mongo-data:
  botmode-meili-data:
  botmode-pgdata:
