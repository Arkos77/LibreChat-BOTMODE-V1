name: BOTMODE V1 Full RAG No Implicit Paid Provider Gate

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-rag-credential-cost-gate.yml'
      - 'scripts/botmode/tests/check_rag_compose_cost_fence.py'
      - 'docker-compose.botmode.yml'
      - 'scripts/botmode/bootstrap.sh'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-rag-no-implicit-spend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact source and test scripts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile scripts/botmode/tests/check_rag_compose_cost_fence.py
          bash -n scripts/botmode/bootstrap.sh
          echo 'CI_RAG_COST_GATE_SOURCE=PASS'
      - name: Prove sanitized RAG Compose credentials with and without explicit approval
        run: python3 scripts/botmode/tests/check_rag_compose_cost_fence.py
      - name: Fresh Full installation creates shared JWT but never downloads images
        run: |
          set -euo pipefail
          test ! -e .env
          sudo ./install.sh --full --no-start --no-pull > /tmp/botmode-ci-bootstrap-report
          grep -q '^BOTMODE_NEW_INSTALL_SHARED_JWT=PASS$' /tmp/botmode-ci-bootstrap-report
          grep -q '^BOTMODE_COMPOSE=PASS$' /tmp/botmode-ci-bootstrap-report
          sudo python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          rows = Path('.env').read_text().splitlines()
          def last(k):
              return [r.split('=',1)[1] for r in rows if r.startswith(k+'=')][-1]
          assert len(last('JWT_SECRET')) >= 32
          assert len(last('JWT_REFRESH_SECRET')) >= 32
          conf = json.loads(subprocess.run(
              ['docker','compose','-f','docker-compose.botmode.yml','config','--format','json'],
              check=True,capture_output=True,text=True).stdout)
          sidecar = conf['services']['rag_api']['environment']
          assert sidecar['JWT_SECRET'] == last('JWT_SECRET')
          assert not sidecar['RAG_OPENAI_API_KEY']
          assert not sidecar['OPENAI_API_KEY']
          print('CI_FULL_NEW_INSTALL_SHARED_JWT_RAG_NO_SPEND=PASS')
          PY
      - name: Test unchanged existing JWT without rotation
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          p=Path('.env')
          rows=p.read_text().splitlines()
          before=[v for v in rows if v.startswith(('JWT_SECRET=','JWT_REFRESH_SECRET='))]
          Path('/tmp/ci-jwt-before').write_text('\n'.join(before))
          PY
          sudo ./install.sh --full --no-start --no-pull >/dev/null
          sudo python3 - <<'PY'
          from pathlib import Path
          rows=Path('.env').read_text().splitlines()
          after=[v for v in rows if v.startswith(('JWT_SECRET=','JWT_REFRESH_SECRET='))]
          assert '\n'.join(after)==Path('/tmp/ci-jwt-before').read_text()
          print('CI_EXISTING_INSTALL_NO_JWT_ROTATION=PASS')
          PY
      - name: Cleanup test secrets from disposable runner
        if: always()
        run: |
          sudo rm -f .env /tmp/ci-jwt-before /tmp/botmode-ci-bootstrap-report
          echo 'Full RAG sidecar receives only allowlisted configuration; a general Chat API key cannot implicitly fund embeddings.' >> "$GITHUB_STEP_SUMMARY"
