name: BOTMODE V1 Exact Source Full RAG Native Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-full-rag-native-acceptance.yml'
      - 'scripts/botmode/ci-full-rag-native-acceptance.py'
      - 'scripts/botmode/ci-mock-embeddings.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-rag:
    name: Real RAG and pgvector, native graph and owner isolation
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CI: 'true'
      COMPOSE_PROJECT_NAME: 'ci-botmode-full-rag-${{ github.run_id }}'
      BOTMODE_HOST_PORT: '3090'
      BOTMODE_IMAGE: 'botmode-ci-full-rag:${{ github.event.pull_request.head.sha || github.sha }}'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source and pinned Full external images
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e .env
          python3 -m py_compile scripts/botmode/ci-full-rag-native-acceptance.py
          node --check scripts/botmode/ci-mock-embeddings.js
          grep -Fq 'librechat-rag-api-dev-lite@sha256:a62ce2221b43a9bb57fa6cb733e7047c80132960272c33d5704028f3071a1251' docker-compose.botmode.yml
          grep -Fq 'librechat-admin-panel@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94' docker-compose.botmode.yml
          echo 'CI_FULL_RAG_SOURCE_AND_DIGEST_PINS=PASS'

      - uses: docker/setup-buildx-action@v4

      - name: Build exact API locally without registry publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: false
          load: true
          tags: botmode-ci-full-rag:${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=botmode-amd64
          build-args: |
            BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare disposable Full credentials without user data
        shell: bash
        run: |
          set -euo pipefail
          sudo ./install.sh --full --no-pull --no-start --image "$BOTMODE_IMAGE" >/dev/null
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 24)" | sudo tee -a .env >/dev/null
          # Fresh Full bootstrap already generates durable shared JWTs.
          # Do not append a second different JWT_SECRET over the installed one.
          sudo awk -F= '/^JWT_SECRET=/{last=$2} END {if(length(last)<32) exit 1}' .env
          echo 'CI_FULL_RAG_SHARED_JWT_BOOTSTRAP=PASS'
          # Lite RAG requires an embeddings backend. Only a CI-local network
          # provider is permitted; never send requests to paid OpenAI.
          printf '%s\n' \
            'BOTMODE_RAG_EMBEDDINGS_PROVIDER=openai' \
            'BOTMODE_RAG_EMBEDDINGS_MODEL=text-embedding-3-small' \
            'BOTMODE_RAG_APPROVED_EMBEDDINGS_API_KEY=ci-nonpaid-local-only' \
            'BOTMODE_RAG_EMBEDDINGS_BASEURL=http://ci-embeddings:8118/v1' \
            'BOTMODE_RAG_CHECK_EMBEDDING_CTX_LENGTH=false' | sudo tee -a .env >/dev/null
          sudo chmod 600 .env
          echo 'CI_FULL_RAG_LOCAL_EMBEDDING_PROVIDER_CONFIGURED=PASS'
          docker image inspect "$BOTMODE_IMAGE" >/dev/null
          echo 'CI_FULL_RAG_LOCAL_BUILD=PASS'

      - name: Boot isolated Full services and authenticated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo -E docker compose -f docker-compose.botmode.yml up -d mongodb vectordb
          # Compose top-level `name:` can determine the effective project name.
          # Resolve the real network instead of assuming COMPOSE_PROJECT_NAME.
          compose_network="$(sudo -E docker compose -f docker-compose.botmode.yml config --format json | jq -er '.networks.default.name')"
          docker network inspect "$compose_network" >/dev/null
          docker run -d --name "ci-embeddings-${{ github.run_id }}" \
            --network "$compose_network" \
            --network-alias ci-embeddings \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 1000:1000 --memory 128m \
            --env CI=true --env CI_EMBEDDINGS_MOCK_ONLY=true \
            --mount "type=bind,src=$PWD/scripts/botmode/ci-mock-embeddings.js,dst=/app/ci-mock-embeddings.js,readonly" \
            --entrypoint node "$BOTMODE_IMAGE" /app/ci-mock-embeddings.js >/dev/null
          docker exec "ci-embeddings-${{ github.run_id }}" node -e "require('http').get('http://127.0.0.1:8118/health',r=>{if(r.statusCode!==200)process.exit(1)}).on('error',()=>process.exit(1))"
          echo 'CI_FULL_RAG_MOCK_EMBEDDING_SERVER=PASS'
          sudo -E docker compose -f docker-compose.botmode.yml up -d meilisearch rag_api api
          ready=0
          for n in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3090/api/config >/dev/null 2>&1; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo 'CI_FULL_API_HOST_HTTP_TIMEOUT=FAIL'
            exit 1
          fi
          sudo -E docker compose -f docker-compose.botmode.yml exec -T vectordb sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1"' | grep -q 1
          echo 'CI_FULL_RAG_REAL_API_PG_UP=PASS'

      - name: Real embed, durable pgvector, native graph, owner isolation and delete
        run: sudo -E python3 scripts/botmode/ci-full-rag-native-acceptance.py

      - name: Classify Full boot failure before disposal (CI dummy secrets only)
        if: failure()
        shell: bash
        run: |
          set +e
          echo 'CI_FULL_DIAGNOSTIC_BEGIN'
          sudo -E docker compose -f docker-compose.botmode.yml ps -a --format json |
            jq -cr 'if type == "array" then .[] else . end | {Service,State,Health,ExitCode}' 2>/dev/null || true
          for svc in api rag_api mongodb vectordb meilisearch; do
            cid="$(sudo -E docker compose -f docker-compose.botmode.yml ps -aq "$svc" | head -n 1)"
            if [ -n "$cid" ]; then
              docker inspect -f 'CI_CONTAINER={{.Name}} STATE={{.State.Status}} EXIT={{.State.ExitCode}} OOM={{.State.OOMKilled}} RESTARTING={{.State.Restarting}}' "$cid" || true
            fi
          done
          echo 'CI_FULL_API_BIND_DIAGNOSTIC_BEGIN'
          sudo -E docker compose -f docker-compose.botmode.yml port api 3080 || true
          sudo -E docker compose -f docker-compose.botmode.yml config --format json |
            jq -cr '.services.api.ports // [] | .[] | {published,target,host_ip}' || true
          curl --noproxy '*' -sS --max-time 5 -o /dev/null -w 'CI_FULL_HOST_HTTP_STATUS=%{http_code}\\n' http://127.0.0.1:3090/api/config || true
          sudo -E docker compose -f docker-compose.botmode.yml exec -T api node -e '
            const http=require("http");
            http.get("http://127.0.0.1:3080/api/config",r=>{
              console.log("CI_FULL_INTERNAL_HTTP_STATUS="+r.statusCode); r.resume();
            }).on("error",e=>console.log("CI_FULL_INTERNAL_HTTP_ERROR="+e.code));
            setTimeout(()=>process.exit(0),6000);' || true
          echo 'CI_FULL_API_BIND_DIAGNOSTIC_END'
          # Only on this synthetic ephemeral CI runner: no personal data or live API keys.
          # Restrict to bounded error-class logs; redact commonplace credential patterns.
          sudo -E docker compose -f docker-compose.botmode.yml logs --no-color --tail 120 api rag_api mongodb 2>&1 |
            grep -Ei 'error|fatal|fail|exception|connect|refus|timeout|start|config|auth|listen|mongodb|rag' |
            tail -n 80 |
            sed -E 's/(Bearer[[:space:]]+)[^[:space:]]+/\\1[REDACTED]/Ig; s/((api.?key|password|secret|token)[=:][[:space:]]*)[^[:space:],]+/\\1[REDACTED]/Ig' || true
          echo 'CI_FULL_DIAGNOSTIC_END'

      - name: Cleanup strictly runner-local Compose stack
        if: always()
        shell: bash
        run: |
          docker rm -f "ci-embeddings-${{ github.run_id }}" >/dev/null 2>&1 || true
          sudo -E docker compose -f docker-compose.botmode.yml down --volumes --remove-orphans >/dev/null 2>&1 || true

      - name: Record exact scope and limitations
        if: always()
        run: |
          {
            echo '### BOT MODE Full RAG source-qualification'
            echo "Tested SHA: $(git rev-parse HEAD)"
            echo 'Locally built API, pinned Full RAG, real PostgreSQL/pgvector. No GHCR push, secrets, real provider, user data or existing volumes.'
            echo 'Real RAG ingest/query using a deterministic local embeddings fixture, persisted chunk source and model-simulated agent tool consumption, owner isolation, irrelevant-query refusal and cleanup.'
            echo 'Not proof of public browser file upload, provider inference, 3-hour tool workflow, remote OCI distribution, or stable release.'
          } >> "$GITHUB_STEP_SUMMARY"
