name: Langfuse Fanout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/langfuse-fanout.yml'
      - 'otel/langfuse-fanout/**'
      - '!**.md'

permissions:
  contents: read

concurrency:
  group: langfuse-fanout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: otel/langfuse-fanout/go.mod
          cache-dependency-path: otel/langfuse-fanout/go.sum

      - name: Check Go formatting
        working-directory: otel/langfuse-fanout
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        working-directory: otel/langfuse-fanout
        run: go test ./...

      - name: Build optional fanout image without registry push
        run: |
          set -euo pipefail
          docker build --file otel/langfuse-fanout/Dockerfile --tag botmode-langfuse-fanout:ci .
          test "$(docker image inspect botmode-langfuse-fanout:ci --format '{{.Architecture}}')" = amd64
          echo 'BOTMODE_LANGFUSE_FANOUT_IMAGE_BUILD=PASS'
