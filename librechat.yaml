{
  "version": "1.3.15",
  "endpoints": {
    "agents": {
      "capabilities": [
        "deferred_tools",
        "execute_code",
        "file_search",
        "web_search",
        "artifacts",
        "subagents",
        "actions",
        "context",
        "skills",
        "ask_user_question",
        "tools",
        "chain",
        "ocr",
        "run_in_background"
      ]
    },
    "custom": [
      {
        "name": "OpenAI",
        "apiKey": "user_provided",
        "baseURL": "https://api.openai.com/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "OpenAI"
      },
      {
        "name": "HuggingFace",
        "apiKey": "user_provided",
        "baseURL": "https://router.huggingface.co/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Hugging Face"
      },
      {
        "name": "DeepSeek",
        "apiKey": "user_provided",
        "baseURL": "https://api.deepseek.com",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "DeepSeek"
      },
      {
        "name": "Gemini",
        "apiKey": "${GEMINI_API_KEY}",
        "baseURL": "https://generativelanguage.googleapis.com/v1beta/openai/",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Gemini"
      },
      {
        "name": "Mistral",
        "apiKey": "user_provided",
        "baseURL": "https://api.mistral.ai/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Mistral"
      },
      {
        "name": "Qwen",
        "apiKey": "user_provided",
        "baseURL": "https://dashscope-intl.aliyuncs.com/compatible-mode/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Qwen"
      },
      {
        "name": "GLM",
        "apiKey": "user_provided",
        "baseURL": "https://api.z.ai/api/paas/v4",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "GLM"
      },
      {
        "name": "MiniMax",
        "apiKey": "user_provided",
        "baseURL": "https://api.minimax.io/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "MiniMax"
      },
      {
        "name": "Ollama",
        "apiKey": "user_provided",
        "baseURL": "http://localhost:11434/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Ollama"
      },
      {
        "name": "OpenRouter",
        "apiKey": "${OPENROUTER_KEY}",
        "baseURL": "https://openrouter.ai/api/v1",
        "models": {
          "default": [
            "openrouter/free",
            "nvidia/nemotron-3-ultra-550b-a55b:free",
            "nvidia/nemotron-3-super-120b-a12b:free",
            "cognitivecomputations/dolphin-mistral-24b-venice-edition",
            "thedrummer/cydonia-24b-v4.1"
          ],
          "fetch": true
        },
        "titleConvo": false,
        "dropParams": [
          "stop"
        ],
        "modelDisplayLabel": "OpenRouter"
      }
    ]
  },
  "webSearch": {
    "searchProvider": "serper",
    "scraperProvider": "firecrawl",
    "serperApiKey": "${SERPER_API_KEY}",
    "firecrawlApiKey": "${FIRECRAWL_API_KEY}",
    "tavilyApiKey": "${TAVILY_API_KEY}"
  },
  "speech": {
    "tts": {
      "allowedAddresses": [],
      "elevenlabs": {
        "apiKey": "${ELEVENLABS_API_KEY}",
        "model": "eleven_multilingual_v2",
        "voices": [
          "CwhRBWXzGAHq8TQ4Fs17",
          "EXAVITQu4vr4xnSDxMaL",
          "FGY2WhTYpPnrIDTdsKH5",
          "JBFqnCBsd6RMkjVDRZzb"
        ]
      }
    },
    "speechTab": {
      "conversationMode": false,
      "advancedMode": false,
      "speechToText": true,
      "textToSpeech": {
        "engineTTS": "browser",
        "voice": "CwhRBWXzGAHq8TQ4Fs17",
        "automaticPlayback": false,
        "playbackRate": 1.0,
        "cacheTTS": true
      }
    }
  },
  "mcpServers": {
    "mcp-docs": {
      "type": "streamable-http",
      "url": "https://modelcontextprotocol.io/mcp",
      "title": "MCP Documentation",
      "description": "Official Model Context Protocol documentation server.",
      "timeout": 30000
    },
    "fetch": {
      "type": "stdio",
      "command": "npx",
      "args": [
        "mcp-fetch-server@1.1.2"
      ],
      "title": "Web Fetch",
      "description": "Fetch and convert public web pages to Markdown for research.",
      "timeout": 30000
    }
  }
}
