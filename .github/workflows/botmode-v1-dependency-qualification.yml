name: BOTMODE V1 Dependency Risk Qualification Batch

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-dependency-qualification.yml'
      - 'package-lock.json'
      - 'client/package.json'
      - 'api/package.json'
      - 'packages/api/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-map-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve actual versions and dependency owners
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const lock=require('./package-lock.json').packages;
          for (const name of ['katex','rehype-katex','remark-math','mermaid','mammoth','argparse','sprintf-js','micromark-extension-llm-math']) {
            const found=Object.entries(lock).filter(([p])=>p.endsWith('/'+name))
              .map(([path,v])=>({path,version:v.version}));
            console.log('BOTMODE_DEP_RESOLVED='+JSON.stringify({name,found}));
          }
          const katex=Object.entries(lock).filter(([p])=>p.endsWith('/katex'));
          if (!katex.length) { console.error('BOTMODE_KATEX_RESOLUTION=UNKNOWN'); process.exit(1); }
          const below=katex.filter(([,v])=>{ const m=/^(\\d+)\\.(\\d+)\\.(\\d+)/.exec(v.version||''); return !m || Number(m[1])===0 && (Number(m[2])<18 || (Number(m[2])===18 && Number(m[3])<2)); });
          console.log('BOTMODE_KATEX_BELOW_FIXED_0_18_2='+below.length);
          for(const [path,v] of below) console.log('BOTMODE_KATEX_VULNERABLE='+JSON.stringify({path,version:v.version}));
          JS
          echo 'BOTMODE_MAMMOTH_CODE_REFERENCES_BEGIN'
          git grep -n -E "from ['\\\"]mammoth|require\\(['\\\"]mammoth|mammoth\\." -- api packages client || true
          echo 'BOTMODE_MAMMOTH_CODE_REFERENCES_END'
      - name: Reproducible dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test patched KaTeX in disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false katex@0.18.2
          node <<'JS'
          const katex=require('katex');
          const version=require('katex/package.json').version;
          if(version!=='0.18.2') throw new Error('Expected 0.18.2 but got '+version);
          for(const expr of ['x^2+y^2=z^2','\\\\frac{1}{2}','\\\\sqrt{x}']) {
            const html=katex.renderToString(expr,{throwOnError:true,trust:false});
            if(!html.includes('katex')) throw new Error('KaTeX render missing');
          }
          console.log('BOTMODE_KATEX_DISPOSABLE_RENDER=PASS');
          JS
          git diff --exit-code -- package-lock.json package.json client/package.json
      - name: Existing math regressions
        shell: bash
        run: |
          set -euo pipefail
          npm exec --workspace @librechat/api -- jest --runInBand --coverage=false --runTestsByPath src/utils/math.spec.ts src/utils/math.integration.spec.ts
