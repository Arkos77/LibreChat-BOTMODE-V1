name: BOTMODE V1 Mammoth Runtime Reachability

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-mammoth-reachability.yml'

permissions:
  contents: read

jobs:
  docx-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 54b30a342bf8f3480d7385b30cfa669b73c92878
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Trace module loads during native Mammoth library conversion
        shell: bash
        run: |
          node <<'JS'
          const Module = require('node:module');
          const JSZip = require('jszip');
          const orig = Module._load;
          const visited = [];
          Module._load = function(request,parent,isMain) {
            if (request === 'argparse' || request === 'sprintf-js' || /(?:^|\\/)(?:argparse|sprintf-js)(?:\\/|$)/.test(request)) visited.push(request);
            return orig.apply(this,arguments);
          };
          (async () => {
            const mammoth = require('mammoth');
            const zip = new JSZip();
            zip.file('[Content_Types].xml', '<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
            zip.file('_rels/.rels', '<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
            zip.file('word/document.xml', '<?xml version="1.0"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>BOTMODE DOCX safe fixture</w:t></w:r></w:p></w:body></w:document>');
            const buffer=await zip.generateAsync({type:'nodebuffer'});
            const raw=await mammoth.extractRawText({buffer});
            const html=await mammoth.convertToHtml({buffer});
            if (!raw.value.includes('BOTMODE DOCX safe fixture') || !html.value.includes('BOTMODE DOCX safe fixture')) throw Error('DOCX_CONTENT_MISMATCH');
            console.log('BOTMODE_DOCX_LIBRARY_MODULE_LOADS=' + JSON.stringify(visited));
            if (visited.length) throw Error('VULNERABLE_CLI_DEPENDENCY_LOADED_BY_LIBRARY');
            console.log('BOTMODE_DOCX_LIBRARY_RUNTIME_REACHABILITY=PASS');
            console.log('SCOPE=two valid synthetic DOCX conversions with dynamic require tracing only; not a complete static proof that all inputs cannot reach the dependency');
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(()=>{Module._load=orig});
          JS
      - name: Run existing DOCX isolation regression tests
        shell: bash
        run: |
          npm run build:data-provider
          npm exec --workspace=packages/api -- jest --runInBand --coverage=false --runTestsByPath src/files/documents/docxWorker.spec.ts src/files/documents/zipSafety.spec.ts
          echo 'BOTMODE_DOCX_ISOLATION_TESTS=PASS'
