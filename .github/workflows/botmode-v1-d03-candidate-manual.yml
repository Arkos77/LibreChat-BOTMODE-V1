name: BOTMODE V1 D03 Candidate Manual
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit D03 candidate approval
        required: true
        type: choice
        options: [NO, AUTHORIZE_D03_CANDIDATE_ONLY]
permissions:
  contents: read
  packages: write
concurrency:
  group: botmode-d03-59598c2f4e33
  cancel-in-progress: false
env:
  SOURCE_SHA: 59598c2f4e333c256296bbb8c6f45a024832745b
  IMAGE: ghcr.io/arkos77/librechat-botmode-v1
  CANDIDATE_TAG: candidate-botmode-v1-59598c2f4e33
  SHA_TAG: sha-59598c2f4e33
jobs:
  preflight:
    if: ${{ inputs.approval == 'AUTHORIZE_D03_CANDIDATE_ONLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable candidate tag availability
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          GITHUB_REF_TYPE: branch
          GITHUB_REPOSITORY_OWNER: Arkos77
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash scripts/botmode/guard-candidate-ghcr.sh
  build:
    needs: preflight
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_COMMIT=${{ env.SOURCE_SHA }}
            BUILD_BRANCH=botmode-v1-final-source-qualified-20261019
      - name: Store digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: candidate-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Recheck tags immediately before manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          GITHUB_REF_TYPE: branch
          GITHUB_REPOSITORY_OWNER: Arkos77
        run: bash scripts/botmode/guard-candidate-ghcr.sh
      - name: Publish immutable candidate without stable or latest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:$CANDIDATE_TAG" -t "$IMAGE:$SHA_TAG" "${digests[@]/#/$IMAGE@sha256:}"
          docker buildx imagetools inspect --raw "$IMAGE:$CANDIDATE_TAG" > /tmp/candidate-manifest.json
          jq -e '([.manifests[]?.platform?.architecture] | index("amd64") != null and index("arm64") != null)' /tmp/candidate-manifest.json
