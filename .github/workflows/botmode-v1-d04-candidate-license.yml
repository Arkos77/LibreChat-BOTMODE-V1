name: BOTMODE V1 D04 Candidate License and Provenance

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-d04-candidate-license.yml'
      - 'scripts/botmode/verify-d04-candidate-license.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-oci-license:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout source only for license evidence script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact published OCI license documents
        shell: bash
        run: bash scripts/botmode/verify-d04-candidate-license.sh
