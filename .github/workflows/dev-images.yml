name: Docker Dev Images Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'skill/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'Dockerfile.multi'
      - '.dockerignore'
      - '!**.md'
      # Deployment skills are Markdown the image ships and reads at runtime
      # (skill/<name>/SKILL.md plus md resources); re-include them after the
      # !**.md exclusion (later patterns win), keeping the top-level README
      # documentation-only.
      - 'skill/**/*.md'
      - '!skill/README.md'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # In this BOT MODE fork, a merge to main must NOT publish unrelated
    # LibreChat dev images or move their "latest" tag on GHCR/Docker Hub.
    # Explicitly dispatched generic-image builds remain a separate opt-in.
    if: >-
      github.repository != 'Arkos77/LibreChat-BOTMODE-V1' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-publish.yml
    with:
      images: >-
        [{"target":"api-build","file":"Dockerfile.multi","image_name":"librechat-dev-api"},
         {"target":"node","file":"Dockerfile","image_name":"librechat-dev"}]
      tag_suffixes: |
        ${{ github.sha }}
        latest
      build_branch: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
