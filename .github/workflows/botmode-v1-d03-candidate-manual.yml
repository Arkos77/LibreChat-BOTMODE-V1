name: BOTMODE V1 D03 Candidate Manual
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Explicit D03 candidate approval
        required: true
        type: choice
        options: ['NO', 'AUTHORIZE_D03_CANDIDATE_ONLY']
      source_sha_confirmation:
        description: Full source SHA must be entered for actual GHCR candidate publication
        required: false
        type: string
        default: 'NO'
permissions:
  contents: read
  packages: write
concurrency:
  group: botmode-d03-7605e9186b84
  cancel-in-progress: false
env:
  SOURCE_SHA: 7605e9186b84d4a7eb6d14be1bc9528c6033bbd8
  IMAGE: ghcr.io/arkos77/librechat-botmode-v1
  CANDIDATE_TAG: candidate-botmode-v1-7605e9186b84
  SHA_TAG: sha-7605e9186b84
jobs:
  prepare-only:
    if: ${{ inputs.approval == 'NO' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout D03 preparation control plane (not publishing runtime)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only exact-source and GHCR tag availability checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = '7605e9186b84d4a7eb6d14be1bc9528c6033bbd8'
          test "$CANDIDATE_TAG" = 'candidate-botmode-v1-7605e9186b84'
          test "$SHA_TAG" = 'sha-7605e9186b84'
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          env GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE=branch bash scripts/botmode/guard-candidate-ghcr.sh
          echo "D03_PREPARE_ONLY_READ_ONLY=PASS"
  preflight:
    if: ${{ inputs.approval == 'AUTHORIZE_D03_CANDIDATE_ONLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Require separate exact-SHA publication approval and absent immutable tags
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA_CONFIRMATION: ${{ inputs.source_sha_confirmation }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA_CONFIRMATION" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          env GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE=branch bash scripts/botmode/guard-candidate-ghcr.sh
  build:
    needs: preflight
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_COMMIT=${{ env.SOURCE_SHA }}
            BUILD_BRANCH=experiment/botmode-zod4-security-20261027
      - name: Store digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: candidate-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Recheck tags immediately before manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          env GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_TYPE=branch bash scripts/botmode/guard-candidate-ghcr.sh
      - name: Publish immutable candidate without stable or latest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:$CANDIDATE_TAG" -t "$IMAGE:$SHA_TAG" "${digests[@]/#/$IMAGE@sha256:}"
          docker buildx imagetools inspect --raw "$IMAGE:$CANDIDATE_TAG" > /tmp/candidate-manifest.json
          jq -e '([.manifests[]?.platform?.architecture] | index("amd64") != null and index("arm64") != null)' /tmp/candidate-manifest.json
  anonymous-pull:
    name: Anonymous candidate pull (${{ matrix.arch }})
    needs: manifest
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Verify unauthenticated pull on native architecture
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE:$CANDIDATE_TAG"
          actual="$(docker image inspect "$IMAGE:$CANDIDATE_TAG" --format '{{.Architecture}}')"
          test "$actual" = "${{ matrix.arch }}"
          echo "D03_ANONYMOUS_PULL_${{ matrix.arch }}=PASS"
