      - name: Five-stage sequential synthetic native graph and Oracle acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/botmode/ci-five-sequential-mission-gate.py
          python3 scripts/botmode/ci-five-sequential-mission-gate.py
      - name: Browser acceptance — actual candidate UI and agent selector
        shell: bash
        run: |
          set -euo pipefail
          # Browser runs on this disposable GitHub runner against OCI :3090.
          python3 -m pip install --quiet --break-system-packages playwright==1.56.0
          BOTMODE_MONGO_PASSWORD=ci-isolated-only POSTGRES_PASSWORD=ci-isolated-only BOTMODE_IMAGE="$BOTMODE_PUBLISHED_IMAGE" BOTMODE_HOST_PORT=3090 docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml exec -T api node - <<'NODE_BROWSER_ACL' > /tmp/botmode-ci-authorized-ids.json
          const mongoose=require('mongoose');
          (async()=>{
            await mongoose.connect(process.env.MONGO_URI);
            const worker=await mongoose.connection.db.collection('agents').findOne({name:'BOT MODE Worker'},{projection:{subagents:1}});
            if(!worker?.subagents?.enabled || !Array.isArray(worker.subagents.agent_ids) || !worker.subagents.agent_ids.length) throw new Error('WORKER_ACL_UNAVAILABLE');
            process.stdout.write(JSON.stringify(worker.subagents.agent_ids));
            await mongoose.disconnect();
          })().catch(e=>{console.error('CI_BROWSER_ACL_CHECK='+e.name);process.exit(1)});
          NODE_BROWSER_ACL
          python3 - <<'PY_BROWSER'
          import base64, json, os, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          token=Path('/tmp/botmode-e2e-test-token').read_text().strip()
          payload=token.split('.')[1]
          identity=json.loads(base64.urlsafe_b64decode(payload+'='*(-len(payload)%4)))
          user={'id':identity['id'],'_id':identity['id'],'name':'BOT MODE CI Agent','username':'botmode-ci-agent','email':'botmode-ci-agent@example.invalid','role':'ADMIN','provider':'local'}
          browser_exe=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not browser_exe:
              raise SystemExit('CI_BROWSER_CHROME_UNAVAILABLE')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=browser_exe,args=['--no-sandbox'])
              context=browser.new_context(base_url='http://127.0.0.1:3090')
              page=context.new_page()
              def refresh(route):
                  route.fulfill(status=200,content_type='application/json',body=json.dumps({'token':token,'user':user}))
              context.route('**/api/auth/refresh*',refresh)
              page.goto('/projects',wait_until='domcontentloaded',timeout=30000)
              page.get_by_role('button',name='New project').first.click(timeout=30000)
              dialog=page.get_by_role('dialog')
              dialog.get_by_role('textbox',name='Project name').fill('CI BOT MODE Browser Acceptance')
              dialog.get_by_role('button',name='Create project').click()
              from urllib.parse import urlparse,parse_qs
              project_url=page.url
              child_id=Path('/tmp/botmode-ci-child-id').read_text().strip()
              worker_id=Path('/tmp/botmode-ci-worker-id').read_text().strip()
              selector=page.locator('[aria-label="Sélection des agents BOT MODE"]')
              selector.wait_for(timeout=30000)
              panel=page.locator('section').filter(has=selector).last
              launch=panel.locator('button').first
              allowlist=set(json.loads(Path('/tmp/botmode-ci-authorized-ids.json').read_text()))
              assert child_id in allowlist, 'CI_BROWSER_WORKER_AUTHORIZATION_MISSING'
              manual_name=None
              def launched(mode):
                  page.wait_for_url('**/c/new?*',timeout=15000)
                  params=parse_qs(urlparse(page.url).query)
                  assert params.get('botmode_agent_mode')==[mode], 'CI_BROWSER_MODE_NOT_ROUTED'
                  assert params.get('agent_id')==[worker_id], 'CI_BROWSER_WORKER_NOT_ROUTED'
                  bindings=json.loads(params.get('botmode_agent_bindings',['[]'])[0])
                  ids=[a.get('id') for a in bindings]
                  assert ids and set(ids).issubset(allowlist), 'CI_BROWSER_UNAUTHORIZED_SPECIALIST_ID_ROUTED'
                  if mode=='auto':
                      assert child_id in ids, 'CI_BROWSER_AUTO_SPECIALIST_MISSING'
                  else:
                      assert len(bindings)==1 and bindings[0].get('name')==manual_name, 'CI_BROWSER_MANUAL_CHOICE_NOT_ROUTED'
                  assert len(ids)==len(set(ids)), 'CI_BROWSER_DUPLICATE_SPECIALIST_IDS'
                  print('CI_BROWSER_'+mode.upper()+'_AUTHORIZED_IDS_ROUTED=PASS',flush=True)
              assert selector.locator('button[aria-pressed="true"]').count()==1
              admissions=[]
              def capture_admission(request):
                  if request.method=='POST' and '/api/agents/chat/agents' in request.url:
                      try:
                          body=request.post_data_json
                          admissions.append(body if isinstance(body,dict) else {})
                      except Exception:
                          admissions.append({})
              # Snapshot fixture counters immediately before browser mission.
              from urllib.request import urlopen
              with urlopen('http://127.0.0.1:8088/metrics',timeout=5) as metric_response:
                  fixture_before=json.load(metric_response)
              page.on('request',capture_admission)
              admission_replies=[]
              def capture_reply(response):
                  if response.request.method=='POST' and '/api/agents/chat/agents' in response.url:
                      try:
                          data=response.json()
                          admission_replies.append({'status':response.status,'streamId':data.get('streamId') if isinstance(data,dict) else None})
                      except Exception:
                          admission_replies.append({'status':response.status})
              page.on('response',capture_reply)
              launch.click()
              launched('auto')
              # Require an actual browser-originated backend admission, not
              # merely navigation with query parameters. No synthetic POST.
              import time
              deadline=time.monotonic()+35
              while not admissions and time.monotonic()<deadline:
                  page.wait_for_timeout(500)
              if not admissions:
                  raise AssertionError('CI_BROWSER_WORKER_MISSION_POST_NOT_OBSERVED')
              request=admissions[0]
              assert request.get('agent_id')==worker_id, 'CI_BROWSER_POST_WORKER_MISMATCH'
              orchestration=request.get('orchestratorMission') or {}
              planner=orchestration.get('plannerContext') or {}
              selected={s.get('agentId') for s in planner.get('specialists',[]) if isinstance(s,dict)}
              assert selected and selected.issubset(allowlist), 'CI_BROWSER_POST_SPECIALIST_ACL_MISMATCH'
              print('CI_BROWSER_REAL_MISSION_POST_AUTHORIZED=PASS',flush=True)
              # Wait for the actual admission reply from this browser turn.
              # Never substitute the separate synthetic Oracle mission.
              deadline=time.monotonic()+40
              admitted=None
              while time.monotonic()<deadline and admitted is None:
                  page.wait_for_timeout(500)
                  if admission_replies:
                      admitted=admission_replies[0]
              assert admitted and admitted.get('status')==200 and admitted.get('streamId'), 'CI_BROWSER_REAL_MISSION_NOT_ADMITTED'
              Path('/tmp/botmode-ci-browser-stream-id').write_text(admitted['streamId'])
              print('CI_BROWSER_REAL_MISSION_ADMITTED=PASS',flush=True)
              # Keep the originating browser/SSE subscription alive until
              # the native mission is settled; closing it here can abandon
              # work before Oracle. The separate Redis attestation below
              # remains the strict fail-closed final assertion.
              import subprocess
              stream_key='::stream:{'+admitted['streamId']+'}:job'
              command=['docker','compose','-f','docker-compose.botmode.yml','-f','docker-compose.botmode-lite.yml','exec','-T','redis','redis-cli','--raw','HMGET',stream_key,'status','missionOracleState']
              completed=False
              deadline=time.monotonic()+120
              while time.monotonic()<deadline:
                  proc=subprocess.run(command,capture_output=True,text=True,timeout=15)
                  if proc.returncode==0:
                      fields=proc.stdout.splitlines()
                      if len(fields)>=2 and fields[0].strip() in ('complete','completed','error','failed','aborted','cancelled'):
                          completed=True
                          print('CI_BROWSER_ORIGIN_STREAM_TERMINAL='+fields[0].strip()[:24],flush=True)
                          break
                  page.wait_for_timeout(1000)
              assert completed, 'CI_BROWSER_MISSION_STREAM_NOT_TERMINAL_WITH_PAGE_OPEN'
              with urlopen('http://127.0.0.1:8088/metrics',timeout=5) as metric_response:
                  fixture_after=json.load(metric_response)
              for metric in ('completion_calls','parent_tool_requests','child_responses','parent_final','missing_tool'):
                  before=fixture_before.get(metric,0)
                  after=fixture_after.get(metric,0)
                  print('CI_BROWSER_FIXTURE_'+metric.upper()+'_DELTA='+str(after-before),flush=True)
              page.close()
              context.close()
              context=browser.new_context(base_url='http://127.0.0.1:3090')
              context.route('**/api/auth/refresh*',refresh)
              page=context.new_page()
              page.goto(project_url,wait_until='domcontentloaded')
              # /projects hosts a transient project drawer: a fresh page must
              # explicitly open its own project rather than expecting that
              # drawer state to survive navigation from the automatic launch.
              page.get_by_role('button',name='New project').first.click(timeout=30000)
              manual_dialog=page.get_by_role('dialog')
              manual_dialog.get_by_role('textbox',name='Project name').fill('CI BOT MODE Manual Acceptance')
              manual_dialog.get_by_role('button',name='Create project').click()
              selector=page.locator('[aria-label="Sélection des agents BOT MODE"]')
              selector.wait_for(timeout=30000)
              selector.locator('button[aria-pressed="false"]').first.click()
              checkbox=selector.locator('input[type="checkbox"]').first
              checkbox.wait_for(timeout=15000)
              manual_name=checkbox.locator('xpath=..').inner_text().strip()
              checkbox.check()
              launch=page.locator('section').filter(has=selector).last.locator('button').first
              assert launch.is_enabled(), 'CI_BROWSER_MANUAL_LAUNCH_DISABLED'
              launch.click()
              launched('manual')
              print('CI_BROWSER_REAL_OCI_PROJECT_AGENT_MODES=PASS',flush=True)
              browser.close()
          PY_BROWSER
          # The browser's actual stream must itself reach durable Oracle VERIFIED.
          # This does not reuse the earlier standalone oracle gate's stream ID.
          python3 - <<'PY_BROWSER_ORACLE'
          import json,subprocess,time
          from pathlib import Path
          sid=Path('/tmp/botmode-ci-browser-stream-id').read_text().strip()
          assert sid, 'CI_BROWSER_STREAM_ID_MISSING'
          compose=['docker','compose','-f','docker-compose.botmode.yml','-f','docker-compose.botmode-lite.yml']
          key='::stream:{'+sid+'}:job'
          deadline=time.monotonic()+95
          verified=False
          while time.monotonic()<deadline:
              proc=subprocess.run(compose+['exec','-T','redis','redis-cli','--raw','HMGET',key,'orchestratorPlan','missionOracleState','missionCandidateContent','terminalPersistencePending'],capture_output=True,text=True,timeout=15)
              if proc.returncode==0:
                  lines=proc.stdout.splitlines()
                  if len(lines)>=2 and lines[0].strip() and lines[1].strip():
                      try:
                          plan,state=json.loads(lines[0]),json.loads(lines[1])
                          results=state.get('results',{})
                          verdicts=[v.get('status') for outcome in results.values() for v in outcome.get('verdicts',[]) if isinstance(v,dict)]
                          tasks=plan.get('tasks',[])
                          expected={task.get('taskId') for task in tasks if isinstance(task,dict)}
                          valid=(len(tasks)==5 and len(expected)==5 and None not in expected
                            and set(results)==expected
                            and all(
                              isinstance(task.get('validation'),list) and len(task['validation'])>0
                              and isinstance(results[task['taskId']].get('verdicts'),list)
                              and len(results[task['taskId']]['verdicts'])==len(task['validation'])
                              and all(v.get('status')=='VERIFIED' for v in results[task['taskId']]['verdicts'])
                              for task in tasks))
                          candidate=json.loads(lines[2]) if len(lines)>2 and lines[2].strip() else None
                          candidate_ok=(isinstance(candidate,list) and len(candidate)>0
                            and all(isinstance(p,dict) and p.get('type')=='text'
                              and isinstance(p.get('text'),str) for p in candidate))
                          print('CI_BROWSER_FIVE_VERDICTS_VALID='+str(valid),flush=True)
                          print('CI_BROWSER_PRIVATE_CANDIDATE_VALID='+str(candidate_ok),flush=True)
                          print('CI_BROWSER_TERMINAL_PENDING='+str(lines[3].strip() if len(lines)>3 else 'absent'),flush=True)
                          print('CI_BROWSER_TASK_VERDICT_COUNTS='+','.join(str(len(results.get(t.get('taskId'),{}).get('verdicts',[]))) for t in tasks if isinstance(t,dict))[:70],flush=True)
                          print('CI_BROWSER_TASK_VERDICT_STATUS_CLASSES='+','.join(sorted({str(v.get('status')) for outcome in results.values() if isinstance(outcome,dict) for v in outcome.get('verdicts',[]) if isinstance(v,dict)}))[:100],flush=True)
                          if valid:
                              print('CI_BROWSER_FIVE_TASK_VERDICTS_VERIFIED=PASS',flush=True)
                              # Candidate content is intentionally not a persistent
                              # publication receipt. The terminal MongoDB readback
                              # must be checked separately before claiming P6.
                              verified=True
                              break
                      except (ValueError,TypeError,AttributeError):
                          pass
              time.sleep(2)
          if not verified:
              # Structured, non-sensitive terminal diagnosis, fail closed.
              diag=subprocess.run(compose+['exec','-T','redis','redis-cli','--raw','HMGET',key,'status','error','orchestratorPlan','missionOracleState'],capture_output=True,text=True,timeout=15)
              fields=diag.stdout.splitlines() if diag.returncode==0 else []
              print('CI_BROWSER_JOB_REDIS_ACCESS='+('PASS' if diag.returncode==0 else 'FAIL'),flush=True)
              print('CI_BROWSER_JOB_STATUS='+(fields[0][:32] if fields else 'ABSENT'),flush=True)
              print('CI_BROWSER_JOB_HAS_ERROR='+str(bool(len(fields)>1 and fields[1].strip())),flush=True)
              print('CI_BROWSER_JOB_HAS_PLAN='+str(bool(len(fields)>2 and fields[2].strip())),flush=True)
              if len(fields)>2 and fields[2].strip():
                  try:
                      plan=json.loads(fields[2]); print('CI_BROWSER_PLAN_TASK_COUNT='+str(len(plan.get('tasks',[]))),flush=True)
                  except (ValueError,TypeError,AttributeError):
                      print('CI_BROWSER_PLAN_PARSE=FAILED',flush=True)
              print('CI_BROWSER_JOB_HAS_ORACLE='+str(bool(len(fields)>3 and fields[3].strip())),flush=True)
              if len(fields)>3 and fields[3].strip():
                  try:
                      state=json.loads(fields[3]); print('CI_BROWSER_ORACLE_RESULTS='+str(len(state.get('results',{}))),flush=True)
                  except (ValueError,AttributeError,TypeError):
                      print('CI_BROWSER_ORACLE_PARSE=FAILED',flush=True)
          assert verified,'CI_BROWSER_MISSION_OWN_ORACLE_VERDICT_NOT_PROVEN'
          print('CI_BROWSER_MISSION_SAME_STREAM_ORACLE_VERIFIED=PASS',flush=True)
          # Independently read durable parent history after Oracle: no synthetic
          # success based on Redis's temporary private candidate.
          response=subprocess.run(compose+['exec','-T','redis','redis-cli','--raw','HMGET',key,'status','responseMessageId','terminalPersistencePending'],capture_output=True,text=True,timeout=15)
          assert response.returncode==0, 'CI_BROWSER_P6_REDIS_READBACK_FAILED'
          fields=response.stdout.splitlines()
          assert len(fields)>=3 and fields[0].strip()=='complete' and fields[1].strip() and fields[2].strip() in ('0','false','False'), 'CI_BROWSER_P6_TERMINAL_NOT_COMMITTED'
          response_id=fields[1].strip()
          js=r"""
          const mongoose=require('mongoose');
          (async()=>{
            await mongoose.connect(process.env.MONGO_URI);
            const db=mongoose.connection.db;
            const sid=process.env.CI_BROWSER_STREAM_ID;
            const mid=process.env.CI_BROWSER_RESPONSE_ID;
            const conversation=await db.collection('conversations').findOne({conversationId:sid},{projection:{conversationId:1}});
            const message=await db.collection('messages').findOne({conversationId:sid,messageId:mid,isCreatedByUser:false},{projection:{messageId:1,conversationId:1,parentMessageId:1,content:1,unfinished:1}});
            const valid=Boolean(conversation && message && message.unfinished===false && typeof message.parentMessageId==='string' && message.parentMessageId && Array.isArray(message.content) && message.content.some(p=>p.type==='text' && typeof p.text==='string' && p.text.trim()));
            console.log('CI_BROWSER_P6_PARENT_HISTORY='+String(Boolean(conversation)).toUpperCase());
            console.log('CI_BROWSER_P6_FINAL_MESSAGE='+String(Boolean(message)).toUpperCase());
            console.log('CI_BROWSER_P6_MONGO_COMMITTED='+String(valid).toUpperCase());
            await mongoose.disconnect();
            if(!valid)process.exitCode=3;
          })().catch(e=>{console.log('CI_BROWSER_P6_READBACK_ERROR_CLASS='+e.name);process.exitCode=2});
          """
          checked=subprocess.run(compose+['exec','-T','-e','CI_BROWSER_STREAM_ID='+sid,'-e','CI_BROWSER_RESPONSE_ID='+response_id,'api','node','-e',js],capture_output=True,text=True,timeout=60)
          for line in checked.stdout.splitlines():
              if line.startswith('CI_BROWSER_P6_'):
                  print(line,flush=True)
          assert checked.returncode==0,'CI_BROWSER_SAME_STREAM_MONGO_PUBLICATION_NOT_PROVEN'
          print('CI_BROWSER_P6_SAME_STREAM_PUBLISHED_MONGO=PASS',flush=True)
          PY_BROWSER_ORACLE

          echo '### Release-fix branch Oracle/QA E2E (local synthetic provider)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Published immutable OCI digest tested with local synthetic subagent model; no real-provider inference.' >> "$GITHUB_STEP_SUMMARY"
      - name: Optional real OpenRouter free-only delegated child and Oracle
        if: github.event_name == 'workflow_dispatch' && inputs.live_free_provider == true
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI_EXTERNAL_FREE_PROVIDER: 'true'
          CI_LIVE_FREE_FIVE_TASKS: ${{ inputs.live_five_tasks }}
        run: |
          python3 -m py_compile scripts/botmode/ci-live-free-child-oracle-gate.py
          # Update the CI-only preflight digest guard on the disposable runner
          # to the exact multiarch image resolved from this candidate tag.
          python3 - <<'PY_LIVE_PIN'
          from pathlib import Path
          p=Path('scripts/botmode/ci-live-free-child-preflight.sh')
          data=p.read_text()
          old="test \"${BOTMODE_PUBLISHED_IMAGE:-}\" = 'ghcr.io/arkos77/librechat-botmode-v1@sha256:ee4af50a8baa8795509fb3c0abba362a104fbae7b0de5eac8a9f1afb8e4a60d0'"
          assert data.count(old)==1, 'CI_LIVE_PIN_GUARD_MISMATCH'
          data=data.replace(old,'test "${BOTMODE_PUBLISHED_IMAGE:-}" = "ghcr.io/arkos77/librechat-botmode-v1:sha-f0e102ffdfe4"')
          p.write_text(data)
          PY_LIVE_PIN
          bash scripts/botmode/ci-live-free-child-preflight.sh
      - name: Classify child execution exception from API logs
        if: failure()
        env:
          BOTMODE_MONGO_PASSWORD: ci-isolated-only
          POSTGRES_PASSWORD: ci-isolated-only
          BOTMODE_IMAGE: ${{ env.BOTMODE_PUBLISHED_IMAGE }}
        shell: bash
        run: |
          docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml logs --no-color api > /tmp/botmode-api-failure.log 2>/dev/null || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('/tmp/botmode-api-failure.log').read_text(errors='replace').splitlines()
          hits=[i for i,line in enumerate(lines) if '[subagentThreads] Child-thread execution failed' in line]
          print('CI_CHILD_EXCEPTION_LOG_ENTRIES='+str(len(hits)))
          # The process logger can serialize structured fields across lines.
          # Inspect only narrowly scoped exception class and stack frame tokens;
          # never print full log records, raw arguments, or credentials.
          for i in hits[-2:]:
              window=' '.join(lines[max(0,i-2):i+24])
              for marker in ('errorName','stack','detail'):
                  print('CI_CHILD_LOG_FIELD_'+marker.upper()+'='+str(marker in window))
              for kind in ('TypeError','ReferenceError','Error','SyntaxError','RangeError'):
                  if re.search(r'(?<![A-Za-z])'+kind+r'(?![A-Za-z])',window):
                      print('CI_CHILD_LOG_ERROR_KIND='+kind)
                      break
              for match in re.finditer(r'at\s+([A-Za-z0-9_$.<>]+)\s*\(',window):
                  print('CI_CHILD_LOG_FRAME_FUNCTION='+match.group(1)[:100])
                  break
          for i in hits[-3:]:
              block='\n'.join(lines[i:i+14])
              names=re.findall(r'errorName[^A-Za-z]+([A-Za-z][A-Za-z0-9]*)',block)
              print('CI_CHILD_EXCEPTION_NAME='+(','.join(names[:2]) or 'unknown'))
              # Winston may serialize the exception as a one-line JSON string;
              # report only field names and bounded, non-sensitive stack locations.
              try:
                  payload=lines[i].split(' | ',1)[-1]
                  obj=__import__('json').loads(payload)
                  if isinstance(obj,dict):
                      print('CI_CHILD_EXCEPTION_FIELDS='+','.join(sorted(obj.keys()))[:150])
                      value=obj.get('errorName') or obj.get('name')
                      if isinstance(value,str) and re.fullmatch(r'[A-Za-z][A-Za-z0-9]{0,63}',value):
                          print('CI_CHILD_EXCEPTION_JSON_NAME='+value)
              except (ValueError,TypeError):
                  pass
              for candidate in ('TypeError','ReferenceError','ValidationError','AbortError','MongoServerError','SubagentThreadPublicError'):
                  if candidate in block:
                      print('CI_CHILD_EXCEPTION_CLASS='+candidate)
              print('CI_CHILD_EXCEPTION_HAS_STACK='+str('stack:' in block))
          PY
      - name: Always destroy disposable stack
        if: always()
        env:
          BOTMODE_MONGO_PASSWORD: ci-isolated-only
          POSTGRES_PASSWORD: ci-isolated-only
          BOTMODE_IMAGE: ${{ env.BOTMODE_PUBLISHED_IMAGE }}
        run: sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes --remove-orphans || true

  candidate-fresh-lite-install:
    name: Clean Lite install and API restart, exact candidate OCI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BOTMODE_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify pristine checkout and public candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"
          test ! -e .env
          test ! -e .botmode-database-auth-initialized
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$BOTMODE_PUBLISHED_IMAGE"
          echo 'CI_FRESH_LITE_PUBLIC_IMAGE=PASS'
      - name: Execute real installer and verify readiness
        run: |
          set -euo pipefail
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo ./install.sh --lite --image "$BOTMODE_PUBLISHED_IMAGE" > "$RUNNER_TEMP/ci-lite.log" 2>&1
          grep -Fxq 'BOTMODE_BOOTSTRAP=PASS' "$RUNNER_TEMP/ci-lite.log"
          grep -Fxq 'BOTMODE_PROFILE=lite' "$RUNNER_TEMP/ci-lite.log"
          grep -Fxq 'BOTMODE_IMAGE_PULL=PASS' "$RUNNER_TEMP/ci-lite.log"
          grep -Fxq 'BOTMODE_STACK=STARTED' "$RUNNER_TEMP/ci-lite.log"
          test "$(stat -c %a .env)" = 600
          test -s .botmode-database-auth-initialized
          sudo grep -Fxq "BOTMODE_IMAGE=$BOTMODE_PUBLISHED_IMAGE" .env
          echo 'CI_FRESH_LITE_INSTALL=PASS'
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 4 http://127.0.0.1:3080/api/config >/dev/null 2>&1; then
              echo 'CI_FRESH_LITE_API=PASS'
              break
            fi
            if [ "$attempt" -eq 90 ]; then exit 1; fi
            sleep 2
          done
      - name: Restart without losing installer configuration
        run: |
          set -euo pipefail
          expected=$(sudo sha256sum .env | cut -d' ' -f1)
          sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml restart api
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 4 http://127.0.0.1:3080/api/config >/dev/null 2>&1; then
              echo 'CI_FRESH_LITE_RESTART=PASS'
              break
            fi
            if [ "$attempt" -eq 90 ]; then exit 1; fi
            sleep 2
          done
          test "$(sudo sha256sum .env | cut -d' ' -f1)" = "$expected"
          echo 'CI_FRESH_LITE_CONFIG_PRESERVED=PASS'
