name: BOTMODE Native Research Compiled Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CANDIDATE_IMAGE: botmode-native-research:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - name: Cheap source gates before Docker
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api
          NODE_OPTIONS=--max-old-space-size=6144 npm exec --workspace=packages/api tsc -- --noEmit
          npm exec --workspace=packages/api jest -- --runInBand --coverage=false --runTestsByPath src/agents/orchestrator/research.spec.ts src/agents/orchestrator/nativeToolChoiceTransport.spec.ts src/agents/orchestrator/admission.spec.ts
          npm exec --workspace=api jest -- --runInBand --coverage=false --runTestsByPath server/services/Endpoints/agents/hostModelUsage.spec.js server/services/Endpoints/agents/hostModelRouting.compat.spec.js server/controllers/agents/callbacks.improvementEvidence.spec.js
          node scripts/botmode/native-research-image-regression.cjs
      - uses: docker/setup-buildx-action@v4
      - name: Build one exact AMD64 image without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=botmode-amd64
          cache-to: type=gha,mode=max,scope=botmode-amd64
          build-args: |
            BUILD_COMMIT=${{ env.CANDIDATE_SHA }}
            BUILD_BRANCH=${{ github.ref_name }}
      - name: Check and exercise the exact compiled image without external network
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          docker image inspect "$CANDIDATE_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "BUILD_COMMIT=$CANDIDATE_SHA"
          docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}' > candidate-evidence/image-id.txt
          printf '%s\n' "$CANDIDATE_SHA" > candidate-evidence/source-sha.txt
          docker run --rm --network none --entrypoint node "$CANDIDATE_IMAGE" scripts/botmode/native-research-image-regression.cjs | tee candidate-evidence/research.log
      - name: Retain this tested image for reuse without rebuilding
        run: |
          set -euo pipefail
          docker save "$CANDIDATE_IMAGE" | gzip -1 > candidate-evidence/image.tar.gz
          (cd candidate-evidence && sha256sum image.tar.gz > image.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: botmode-native-research-${{ github.sha }}
          path: candidate-evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Record qualification boundary
        if: always()
        run: |
          echo 'Synthetic compiled SDK research proof only. No host/browser, Mongo/Redis restart, real provider, installation or stable promotion proof.' >> "$GITHUB_STEP_SUMMARY"
