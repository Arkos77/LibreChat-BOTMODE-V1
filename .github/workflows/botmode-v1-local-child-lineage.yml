name: BOTMODE Local Saved Child Durable Lineage
'on':
  push:
    branches:
    - ops/child-local-b2213e9717b8-002
permissions:
  contents: read
  actions: read
env:
  BOTMODE_CANDIDATE_SHA: b2213e9717b879a91181c6ac9d7607124c30258b
  BOTMODE_IMAGE: botmode-source-built:b2213e9717b879a91181c6ac9d7607124c30258b
  BOTMODE_PUBLISHED_IMAGE: botmode-source-built:b2213e9717b879a91181c6ac9d7607124c30258b
  BOTMODE_MONGO_PASSWORD: ci-isolated-only
  POSTGRES_PASSWORD: ci-isolated-only
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
concurrency:
  group: ops/child-local-b2213e9717b8-002
  cancel-in-progress: false
jobs:
  amd64-integrated:
    if: github.repository == 'Arkos77/LibreChat-BOTMODE-V1' && github.run_attempt == 1 && github.event.before ==
      'b2213e9717b879a91181c6ac9d7607124c30258b'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: botmode-oci-child-${{ github.run_id }}-${{ github.run_attempt }}
      BOTMODE_HOST_PORT: '3090'
    steps:
    - uses: actions/checkout@v5
      with:
        ref: b2213e9717b879a91181c6ac9d7607124c30258b
        persist-credentials: false
    - name: Prepare fixture-only response identity allowlist; no provider catalog
      run: 'printf ''%s'' ''["openrouter/free"]'' > /tmp/ci-wire-response-models.json

        echo ''CI_ALL_MODEL_TRAFFIC_LOCAL_FIXTURE=TRUE''

        '
    - name: Verify pinned pristine source before build
      run: 'test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"

        test -z "$(git status --porcelain)"

        echo ''6e59734742daa69251821e2fed6a765febb4e58f9139743a98c91813dff234cf  package-lock.json'' | sha256sum
        -c -

        '
    - name: Fetch pinned observation helpers and syntax-check before build
      run: "set -euo pipefail\nmkdir -p /tmp/ci-wire-scripts\nfor file in ci-http-json-observer.cjs ci-compare-http-oracle.cjs;\
        \ do\n  curl --fail --silent --show-error --location \"https://raw.githubusercontent.com/Arkos77/LibreChat-BOTMODE-V1/4dbf279a9d4fcdd6a7241c244abdd75bfac42c3e/scripts/botmode/$file\"\
        \ -o \"/tmp/ci-wire-scripts/$file\"\n  node --check \"/tmp/ci-wire-scripts/$file\"\ndone\necho '09872c3ce6f126eda8712957fb977d495c0d69e33d918a30d00189637d74269f\
        \  /tmp/ci-wire-scripts/ci-http-json-observer.cjs' | sha256sum -c -\necho '4c87687528d333429e6d494080f13fb13125608dd5f974f81469f9ed281ad417\
        \  /tmp/ci-wire-scripts/ci-compare-http-oracle.cjs' | sha256sum -c -\nnode - <<'NODE'\nconst assert=require('node:assert/strict');\n\
        const {responseSummary}=require('/tmp/ci-wire-scripts/ci-http-json-observer.cjs');\nconst sample=responseSummary(JSON.stringify({choices:[{index:0,message:{content:'{\"\
        ok\":true}'},finish_reason:'stop'}]}),false);\nassert.equal(sample.content.okExactlyTrue,true);\nconsole.log('CI_WIRE_HELPER_PREREQUISITE=PASS');\n\
        NODE\n"
    - name: Audit current source lock before spending time on Docker build
      run: 'set -euo pipefail

        set +e

        npm audit --omit=dev --package-lock-only --json > /tmp/ci-prebuild-audit.json

        code=$?

        set -e

        test "$code" = 0 || test "$code" = 1

        node - <<''NODE''

        const assert=require(''node:assert/strict'');const fs=require(''node:fs'');

        const audit=JSON.parse(fs.readFileSync(''/tmp/ci-prebuild-audit.json'',''utf8''));assert.ok(!audit.error);

        const counts=audit.metadata.vulnerabilities;const findings=Object.entries(audit.vulnerabilities);

        assert.equal(counts.critical,0);assert.equal(counts.high,0);assert.equal(counts.low,0);assert.equal(counts.info,0);

        assert.ok(findings.every(([name,f])=>[''argparse'',''mammoth'',''sprintf-js''].includes(name)&&f.severity===''moderate''));

        assert.equal(counts.moderate,findings.length);

        console.log(''CI_PREBUILD_SOURCE_AUDIT=PASS'');

        NODE

        '
    - name: Restore exact already-built b221 image; no compilation
      uses: actions/download-artifact@v4
      with:
        name: botmode-receipts-b2213e9717b8-image-39880864060
        run-id: 39880864060
        github-token: ${{ github.token }}
        path: /tmp
    - name: Verify retained archive and immutable image before local qualification
      run: 'set -euo pipefail

        test "$(cat /tmp/botmode-receipts-b2213e9717b8-source.txt)" = "$BOTMODE_CANDIDATE_SHA"

        test "$(cat /tmp/botmode-receipts-b2213e9717b8-image-id.txt)" = ''sha256:6414f7af6cbb235444315ea3c8928fb2476aa2d83fc4c19c313626990c6469db''

        sha256sum -c /tmp/botmode-receipts-b2213e9717b8-image.sha256

        gzip -dc /tmp/botmode-receipts-b2213e9717b8-image.tar.gz | docker load

        test "$(docker image inspect "$BOTMODE_IMAGE" --format ''{{.Id}}'')" = ''sha256:6414f7af6cbb235444315ea3c8928fb2476aa2d83fc4c19c313626990c6469db''

        echo ''CI_SAME_IMAGE_NO_BUILD=PASS''

        '
    - name: Verify exact source and local image identity
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"

        test -z "$(git status --porcelain)"

        echo ''6e59734742daa69251821e2fed6a765febb4e58f9139743a98c91813dff234cf  package-lock.json'' | sha256sum
        -c -

        docker image inspect "$BOTMODE_IMAGE" --format ''{{range .Config.Env}}{{println .}}{{end}}'' | grep -Fx
        "BUILD_COMMIT=$BOTMODE_CANDIDATE_SHA"

        docker image inspect "$BOTMODE_IMAGE" --format ''CI_LOCAL_CLOSEOUT_IMAGE_ID={{.Id}}''

        sha256sum api/server/controllers/agents/client.js api/server/services/Endpoints/agents/hostModelUsage.js
        api/server/services/Endpoints/agents/hostModelRouting.js package.json api/server/services/Endpoints/agents/initialize.js
        packages/api/src/endpoints/openai/llm.ts scripts/botmode/ci-live-free-child-preflight.sh > /tmp/closeout-source.sha256

        docker run --rm -i --network none --entrypoint sh "$BOTMODE_IMAGE" -c ''sha256sum -c -'' < /tmp/closeout-source.sha256

        echo ''CI_CLOSEOUT_EXACT_SOURCE=PASS''

        echo ''CI_REGISTRY_PUBLICATION=NONE''

        '
    - name: Run actual SDK JSON transmission tests inside image without external networking
      run: "docker run --rm -i --network none --entrypoint node \"$BOTMODE_IMAGE\" - <<'NODE'\nconst assert = require('node:assert/strict');\n\
        const tests = [];\nglobal.describe = (_name, body) => body();\nglobal.it = (name, body) => tests.push({\
        \ name, body });\nglobal.it.each = (values) => (name, body) => {\n  for (const value of values) tests.push({\
        \ name: name.replace('%s', value), body: () => body(value) });\n};\nglobal.expect = (actual) => ({\n  toEqual:\
        \ (expected) => assert.deepStrictEqual(actual, expected),\n  toBe: (expected) => assert.strictEqual(actual,\
        \ expected),\n  toHaveLength: (expected) => assert.equal(actual.length, expected),\n});\nrequire('/app/api/server/services/Endpoints/agents/hostJsonMode.compat.spec.js');\n\
        (async () => {\n  assert.equal(tests.length, 4);\n  for (const test of tests) {\n    await test.body();\n\
        \    console.log('CI_IMAGE_JSON_TEST_PASS=' + test.name);\n  }\n  console.log('CI_IMAGE_JSON_MODE_TESTS=4');\n\
        \  console.log('CI_IMAGE_JSON_MODE_PRIMARY_AND_FALLBACK=PASS');\n})().catch((error) => { console.error(error);\
        \ process.exitCode = 1; });\nNODE\n"
    - name: Audit actual production dependencies and inspect license payload
      run: "docker run --rm -i --entrypoint node \"$BOTMODE_IMAGE\" - <<'NODE_AUDIT'\nconst assert=require('node:assert/strict');\n\
        const fs=require('node:fs');const crypto=require('node:crypto');const cp=require('node:child_process');\n\
        for(const [name,version] of Object.entries({'dompurify':'3.4.17','follow-redirects':'1.16.1','ip-address':'10.7.4','sanitize-html':'2.18.1'})){\n\
        \ assert.equal(JSON.parse(fs.readFileSync('/app/node_modules/'+name+'/package.json')).version,version);\n\
        }\nassert.equal(fs.existsSync('/app/node_modules/monaco-editor/node_modules/dompurify/package.json'),false);\n\
        console.log('CI_IMAGE_PATCHED_DEPENDENCY_VERSIONS=PASS');\nconst run=cp.spawnSync('npm',['audit','--omit=dev','--json'],{encoding:'utf8',timeout:90000,maxBuffer:4*1024*1024});\n\
        assert.ok(run.status===0||run.status===1);const audit=JSON.parse(run.stdout);assert.ok(!audit.error);\n\
        const counts=audit.metadata.vulnerabilities;\nassert.equal(counts.critical,0);assert.equal(counts.high,0);\n\
        const allowedModerates=new Set(['argparse','mammoth','sprintf-js']);\nconst findings=Object.entries(audit.vulnerabilities);\n\
        assert.ok(findings.every(([name,finding])=>allowedModerates.has(name)&&finding.severity==='moderate'));\n\
        assert.equal(counts.moderate,findings.length);\nassert.equal(counts.low,0);assert.equal(counts.info,0);\n\
        console.log('CI_IMAGE_NPM_AUDIT_CRITICAL=0');console.log('CI_IMAGE_NPM_AUDIT_HIGH=0');console.log('CI_IMAGE_NPM_AUDIT_MODERATE='+counts.moderate);\n\
        console.log('CI_D02_NEW_LOCK_OWNER_APPROVAL=REQUIRED');\nconst notice=fs.readFileSync('/app/THIRD_PARTY_NOTICES.md','utf8');\n\
        assert.ok(notice.includes('@codesandbox/nodebox@0.1.8')&&notice.includes('Sustainable Use License'));\n\
        const paths=['/app/node_modules/@codesandbox/nodebox/LICENSE','/app/client/node_modules/@codesandbox/nodebox/LICENSE','/app/THIRD_PARTY_LICENSES/Nodebox-SUL-1.0.txt'];\n\
        const path=paths.find(p=>fs.existsSync(p));assert.ok(path);\nassert.equal(crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex'),'5aca9a36f98d883157f1d1a567347c3d776b7ae60bf93fbb7bfa190f1e3ccf46');\n\
        console.log('CI_IMAGE_NODEBOX_NOTICE_AND_COMPLETE_SUL=PASS');\nNODE_AUDIT\n"
    - name: Prepare disposable native identities and DB only; prior integrated proof retained
      run: 'python3 -m pip install --quiet --break-system-packages PyYAML==6.0.3

        python3 - <<''PY_SETUP''

        import os,subprocess,yaml

        from pathlib import Path

        workflow=yaml.safe_load(Path(''.github/workflows/botmode-v1-exact-candidate-oci-probe.yml'').read_text())

        matches=[s for s in workflow[''jobs''][''current-candidate-runtime''][''steps''] if s.get(''name'')==''Boot
        current candidate with disposable MongoDB'']

        assert len(matches)==1

        step=matches[0]

        assert chr(36)+''{{'' not in step[''run'']

        env={**os.environ,**step.get(''env'',{})}

        assert env.get(''OPENROUTER_API_KEY'')==''ci-local-fixture-no-real-key''

        script=step[''run'']

        # Enforce local-only routes before the first API boot.

        old="if endpoint.get(''name'') == ''OpenRouter'':"

        assert script.count(old)==1

        script=script.replace(old,"if True:")

        model="endpoint[''models''] = {''fetch'': False, ''default'': [''openrouter/free'']}"

        assert script.count(model)==1

        script=script.replace(model,model+"\n        endpoint.setdefault(''customParams'',{})[''defaultParamsEndpoint'']=''openAI''")


        anchor=''test -s /tmp/botmode-ci-child-id''

        assert script.count(anchor)==1

        script=script[:script.index(anchor)+len(anchor)]+chr(10)

        subprocess.run([''bash'',''-e'',''-o'',''pipefail'',''-c'',script],env=env,check=True)

        print(''CI_REAL_DISPOSABLE_NATIVE_SETUP=PASS'',flush=True)

        PY_SETUP

        '
    - name: Fence mission admission on actual readyz before the single POST
      run: "python3 - <<'PY_READY'\nimport time\nfrom urllib.request import urlopen\nfrom urllib.error import HTTPError,URLError\n\
        \ndef wait_ready(base, attempts=60, pause=2):\n    for attempt in range(attempts):\n        try:\n     \
        \       with urlopen(base+'/readyz',timeout=4) as response:\n                if response.status==200 and\
        \ response.read(16).strip()==b'OK':\n                    return True\n        except (HTTPError,URLError,TimeoutError):\n\
        \            pass\n        if attempt+1<attempts: time.sleep(pause)\n    return False\n\nif not wait_ready('http://127.0.0.1:3090'):\n\
        \    raise SystemExit('CI_CHILD_MISSION_READINESS=TIMEOUT_NO_MISSION_STARTED')\nprint('CI_CHILD_MISSION_READINESS=PASS',flush=True)\n\
        PY_READY\n"
    - name: Require completed authorized child lineage before and after API restart
      run: "set -euo pipefail\npython3 - <<'PY_CHILD'\nimport json,runpy,subprocess,time\nfrom pathlib import Path\n\
        from urllib.request import Request,urlopen\nchild=Path('/tmp/botmode-ci-child-id').read_text().strip()\n\
        req=Request('http://127.0.0.1:8088/configure',data=json.dumps({'childId':child}).encode(),headers={'Content-Type':'application/json'})\n\
        with urlopen(req,timeout=5) as r: assert json.load(r)['ok'] is True\np=Path('scripts/botmode/ci-oracle-delegated-mission-gate.py')\n\
        s=p.read_text()\na=\"        fail(label + \\\"_MISSION_START\\\")\"\nassert s.count(a)==1\ns=s.replace(a,\"\
        \        try:\\n            refusal=json.loads(raw_start)\\n            code=refusal.get('code')\\n    \
        \        allowed={'SERVER_NOT_READY','PARENT_STATE_UNAVAILABLE','MISSION_PLAN_INVALID','INVALID_ORCHESTRATOR_MISSION'}\\\
        n            print('CI_CHILD_ADMISSION_CODE='+ (code if code in allowed else 'OTHER_OR_ABSENT'),flush=True)\\\
        n        except (ValueError,TypeError,AttributeError):\\n            print('CI_CHILD_ADMISSION_CODE=NON_JSON',flush=True)\\\
        n\"+a)\n\ns=s.replace(\"{projection: {conversationId: 1, subagentThread: 1}}\",\"{projection: {conversationId:\
        \ 1, subagentThread: 1, user: 1, agent_id: 1}}\")\na=\"  const findings = [];\"\nassert s.count(a)==1\n\
        s=s.replace(a,\"  const owner = await db.collection('conversations').findOne({conversationId:parent});\\\
        n\"+a)\na=\"linked: link.parentConversationId === parent &&\"\nassert s.count(a)==1\ns=s.replace(a,\"linked:\
        \ Boolean(owner) && String(child.user) === String(owner.user) && child.agent_id === process.env.CI_EXPECTED_CHILD_ID\
        \ && link.subagentType === process.env.CI_EXPECTED_CHILD_ID && \"+a[len('linked: '):])\na=\"terminal: statuses.some(s\
        \ => ['completed','error','cancelled'].includes(s))\"\nassert s.count(a)==1\ns=s.replace(a,\"terminal: messages.filter(m\
        \ => m.isCreatedByUser === false && m.subagentTask).length === 1 && messages.some(m => m.isCreatedByUser\
        \ === false && m.unfinished === false && m.subagentTask?.status === 'completed') && !statuses.some(s =>\
        \ ['error','cancelled','paused','pause_requested'].includes(s))\")\ns=s.replace(\"{projection: {subagentTask:\
        \ 1, messageId: 1}}\", \"{projection: {subagentTask: 1, messageId: 1, isCreatedByUser: 1, unfinished: 1}}\"\
        )\na='\"exec\", \"-T\", \"-e\", \"CI_PARENT_CONVERSATION_ID=\" + parent_conversation_id,'\nassert s.count(a)==1\n\
        s=s.replace(a,a+' \"-e\", \"CI_EXPECTED_CHILD_ID=\" + CHILD,')\np.write_text(s)\ng=runpy.run_path(str(p),run_name='local_child_probe')\n\
        parent=g['verify']('ACCEPT',False,'VERIFIED')\n# Detached completion is bounded; cancelled/error never qualify.\n\
        for attempt in range(20):\n try:\n  g['verify_mongo_child_lineage'](parent,'BEFORE_RESTART');break\n except\
        \ SystemExit:\n  if attempt==19:raise\n  time.sleep(1)\nr=subprocess.run(g['COMPOSE']+['restart','api'],capture_output=True,timeout=120)\n\
        assert r.returncode==0,'API_RESTART'\ng['verify_mongo_child_lineage'](parent,'AFTER_RESTART')\nprint('CI_LOCAL_SAVED_CHILD_COMPLETED_OWNER_AUTHORIZED_LINEAGE_RESTART=PASS',flush=True)\n\
        print('CI_DYNAMIC_CREATION_PROVEN=FALSE',flush=True)\nprint('CI_EXTERNAL_CHILD_PROVEN=FALSE',flush=True)\n\
        PY_CHILD\n"
    - name: Destroy runner-only stack
      if: always()
      run: 'sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes
        --remove-orphans || true

        if test -f /tmp/ci-primary-429.pid; then kill "$(cat /tmp/ci-primary-429.pid)" 2>/dev/null || true; fi

        docker image rm -f "$BOTMODE_IMAGE" >/dev/null 2>&1 || true


        sudo rm -rf "$RUNNER_TEMP/botmode-wire"

        rm -f /tmp/botmode-receipts-b2213e9717b8-image.tar.gz /tmp/botmode-wire-sanitized.jsonl

        '
