services:
  api:
    environment:
      - MEILI_HOST=
      - RAG_API_URL=
      - SCHEDULES_SINGLE_PROCESS=true

  mongodb:
    image: mongo:4.4.29

  # Optional on-demand admin UI; excluded from the default Lite startup.
  # Enable explicitly with --profile admin and a session secret.
  admin-panel:
    profiles: ["full", "admin"]

  meilisearch:
    profiles: ["full"]

  vectordb:
    profiles: ["full"]

  rag_api:
    profiles: ["full"]

