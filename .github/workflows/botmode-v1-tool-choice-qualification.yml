        \ --entrypoint node \"$BOTMODE_IMAGE\" - <<'NODE_TOOL_CHOICE'\nconst assert\
        \ = require('node:assert/strict');\nglobal.expect = actual => ({toEqual: expected\
        \ => assert.deepEqual(actual,expected),toBe: expected => assert.equal(actual,expected),not:{toThrow:()=>assert.doesNotThrow(actual)}});\n\
        global.it = (_name,run) => Promise.resolve().then(run).then(()=>{console.log('CI_COMPILED_NATIVE_TOOL_CHOICE_HTTP_SOURCE_ORACLE=PASS;\
        \ externalInference=0; toolExecutions=1; requests=2');process.exit(0)},e=>{console.error(e.stack);process.exit(1)});\n\
        setTimeout(()=>process.exit(2),45000).unref();\n\"use strict\";\nObject.defineProperty(exports,\
