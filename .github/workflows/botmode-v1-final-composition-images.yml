name: BOTMODE Final Composition Native Images and Changed Runtime Qualification
'on':
  push:
    branches:
    - ops/final-image-d59dedf071d2-002
permissions:
  contents: read
concurrency:
  group: ops/final-image-d59dedf071d2-002
  cancel-in-progress: false
env:
  BOTMODE_CANDIDATE_SHA: d59dedf071d26503ec9bec5a31ee474f0ccc9724
  BOTMODE_IMAGE: botmode-source-built:d59dedf071d26503ec9bec5a31ee474f0ccc9724
  BOTMODE_PUBLISHED_IMAGE: botmode-source-built:d59dedf071d26503ec9bec5a31ee474f0ccc9724
  BOTMODE_MONGO_PASSWORD: ci-isolated-only
  POSTGRES_PASSWORD: ci-isolated-only
  BOTMODE_HOST_PORT: '3090'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
jobs:
  qualification:
    if: github.repository == 'Arkos77/LibreChat-BOTMODE-V1' && github.run_attempt == 1 && github.event.before ==
      'd59dedf071d26503ec9bec5a31ee474f0ccc9724'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          nodeArch: x64
          runner: ubuntu-latest
          platform: linux/amd64
        - arch: arm64
          nodeArch: arm64
          runner: ubuntu-24.04-arm
          platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    env:
      COMPOSE_PROJECT_NAME: botmode-oci-child-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ARCH: ${{ matrix.nodeArch }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: d59dedf071d26503ec9bec5a31ee474f0ccc9724
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact frozen composition and record source hashes
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"

        test -z "$(git status --porcelain)"

        git diff-tree --no-commit-id --name-only -r "$BOTMODE_CANDIDATE_SHA" > /tmp/composed-files.txt

        python3 - <<''PY_HASH''

        import hashlib,json

        from pathlib import Path

        paths=[p for p in Path(''/tmp/composed-files.txt'').read_text().splitlines() if not p.startswith(''docs/'')]

        assert len(paths)==6

        hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}

        Path(''/tmp/composed-hashes.json'').write_text(json.dumps(hashes))

        PY_HASH

        '
    - uses: docker/setup-buildx-action@v4
    - name: Build exact native image once; no registry publication
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        target: node
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: ${{ env.BOTMODE_IMAGE }}
        cache-from: type=gha,scope=botmode-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=botmode-${{ matrix.arch }}
        build-args: 'BUILD_COMMIT=${{ env.BOTMODE_CANDIDATE_SHA }}

          BUILD_BRANCH=${{ github.ref_name }}'
    - name: Verify actual image code, architecture, admission, built key portal and license
      run: 'set -euo pipefail

        docker image inspect "$BOTMODE_IMAGE" --format ''{{range .Config.Env}}{{println .}}{{end}}'' | grep -Fx
        "BUILD_COMMIT=$BOTMODE_CANDIDATE_SHA"

        expected_hashes=$(cat /tmp/composed-hashes.json)

        docker run --rm --network none -i -e EXPECTED_HASHES="$expected_hashes" -e EXPECTED_ARCH="$NODE_ARCH" --entrypoint
        node "$BOTMODE_IMAGE" - <<''NODE_IMAGE''

        const assert=require(''node:assert/strict''),fs=require(''node:fs''),crypto=require(''node:crypto'');

        for(const [p,h] of Object.entries(JSON.parse(process.env.EXPECTED_HASHES))){assert.equal(crypto.createHash(''sha256'').update(fs.readFileSync(''/app/''+p)).digest(''hex''),h)}

        assert.equal(process.arch,process.env.EXPECTED_ARCH);

        const tests=[];global.describe=(_n,f)=>f();global.it=(n,f)=>tests.push([n,f]);

        global.expect=a=>({toEqual:b=>assert.deepEqual(a,b),toThrow:b=>assert.throws(a,typeof b===''string''?e=>e.message.includes(b):undefined),not:{toThrow:()=>assert.doesNotThrow(a)}});

        require(''/app/api/server/controllers/agents/orchestratorMissionBindings.spec.js'');

        for(const [n,f] of tests){f();console.log(''CI_COMPOSED_ADMISSION_TEST=PASS:''+n)}assert.equal(tests.length,5);

        const assets=''/app/client/dist/assets'';const js=fs.readdirSync(assets).filter(p=>p.endsWith(''.js'')).map(p=>fs.readFileSync(assets+''/''+p,''utf8'')).join(''\n'');

        assert.ok(js.includes(''https://platform.openai.com/api-keys'')&&js.includes(''https://openrouter.ai/settings/keys'')&&js.includes(''com_endpoint_config_key_portal_renew''));

        assert.ok(fs.readFileSync(''/app/THIRD_PARTY_NOTICES.md'',''utf8'').includes(''@codesandbox/nodebox@0.1.8''));

        const license=[''/app/THIRD_PARTY_LICENSES/Nodebox-SUL-1.0.txt'',''/app/node_modules/@codesandbox/nodebox/LICENSE'',''/app/client/node_modules/@codesandbox/nodebox/LICENSE''].find(p=>fs.existsSync(p));assert.ok(license);

        assert.equal(crypto.createHash(''sha256'').update(fs.readFileSync(license)).digest(''hex''),''5aca9a36f98d883157f1d1a567347c3d776b7ae60bf93fbb7bfa190f1e3ccf46'');

        console.log(''CI_COMPOSED_SOURCE_HASHES_ARCH_ADMISSION_BUILT_PORTAL_LICENSE=PASS'');

        NODE_IMAGE

        '
    - name: Exercise changed admission in native runtime, real UI and same-stream Mongo P6
      if: matrix.arch == 'amd64'
      run: "set -euo pipefail\npython3 -m pip install --quiet --break-system-packages PyYAML==6.0.3\npython3 - <<'PY_RUNTIME'\n\
        import os,subprocess,yaml\nfrom pathlib import Path\nworkflow=yaml.safe_load(Path('.github/workflows/botmode-v1-exact-candidate-oci-probe.yml').read_text())\n\
        steps=workflow['jobs']['current-candidate-runtime']['steps']\nready=\"\"\"mission_ready=0\nfor attempt in\
        \ $(seq 1 60); do\n if curl -fsS --max-time 4 http://127.0.0.1:3090/readyz >/dev/null 2>&1; then mission_ready=1;\
        \ break; fi\n sleep 2\ndone\ntest \"$mission_ready\" = 1\necho 'CI_COMPOSED_MISSION_READY=PASS'\n\"\"\"\n\
        for name in ['Boot current candidate with disposable MongoDB','Browser acceptance \u2014 actual candidate\
        \ UI and agent selector']:\n matches=[s for s in steps if s.get('name')==name];assert len(matches)==1\n\
        \ step=matches[0];script=step['run'];assert chr(36)+'{{' not in script\n env={**os.environ,**step.get('env',{})};assert\
        \ env.get('OPENROUTER_API_KEY','ci-local-fixture-no-real-key')=='ci-local-fixture-no-real-key'\n if name.startswith('Boot\
        \ '):\n  anchor=\"if endpoint.get('name') == 'OpenRouter':\";assert script.count(anchor)==1;script=script.replace(anchor,'if\
        \ True:')\n  anchor=\"endpoint['models'] = {'fetch': False, 'default': ['openrouter/free']}\";assert script.count(anchor)==1\n\
        \  script=script.replace(anchor,anchor+\"\\n        endpoint.setdefault('customParams',{})['defaultParamsEndpoint']='openAI'\"\
        )\n  anchor='test -s /tmp/botmode-ci-child-id';assert script.count(anchor)==1;script=script.replace(anchor,anchor+'\\\
        n'+ready)\n else:script=ready+script\n print('CI_COMPOSED_HARNESS_STEP='+name,flush=True)\n subprocess.run(['bash','-e','-o','pipefail','-c',script],env=env,check=True)\n\
        print('CI_COMPOSED_NATIVE_SPECIALIST_FIVE_ORACLES_BROWSER_P6=PASS',flush=True)\nPY_RUNTIME\n"
    - name: Release only this disposable build cache before archiving loaded image
      run: 'docker buildx prune --all --force

        df -h /

        '
    - name: Retain the exact image for later authorized qualification or publication
      run: 'set -euo pipefail

        docker save "$BOTMODE_IMAGE" | gzip -1 > /tmp/final-image.tar.gz

        (cd /tmp && sha256sum final-image.tar.gz > final-image.sha256)

        docker image inspect "$BOTMODE_IMAGE" --format ''{{.Id}}'' > /tmp/final-image-id.txt

        printf ''%s\n'' "$BOTMODE_CANDIDATE_SHA" > /tmp/final-source.txt

        '
    - uses: actions/upload-artifact@v4
      with:
        name: botmode-final-d59dedf071d2-${{ matrix.arch }}-${{ github.run_id }}
        path: '/tmp/final-image.tar.gz

          /tmp/final-image.sha256

          /tmp/final-image-id.txt

          /tmp/final-source.txt'
        retention-days: 1
        compression-level: 0
    - name: Destroy disposable runner stack
      if: always()
      run: 'sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes
        --remove-orphans || true

        if test -f /tmp/botmode-ci-fixture.pid; then kill "$(cat /tmp/botmode-ci-fixture.pid)" 2>/dev/null || true;
        fi

        '
