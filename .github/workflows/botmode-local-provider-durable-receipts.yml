      if: always()
      run: 'sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes --remove-orphans
        || true

        if test -f /tmp/ci-primary-429.pid; then kill "$(cat /tmp/ci-primary-429.pid)" 2>/dev/null || true; fi

        docker image rm -f "$BOTMODE_IMAGE" >/dev/null 2>&1 || true


        sudo rm -rf "$RUNNER_TEMP/botmode-wire"

        rm -f /tmp/botmode-receipts-b2213e9717b8-image.tar.gz /tmp/botmode-wire-sanitized.jsonl

        '
