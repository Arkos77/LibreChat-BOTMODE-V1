{
  "version": "1.3.15",
  "endpoints": {
    "agents": {
      "capabilities": [
        "deferred_tools",
        "execute_code",
        "file_search",
        "web_search",
        "artifacts",
        "subagents",
        "actions",
        "context",
        "skills",
        "ask_user_question",
        "tools",
        "chain",
        "ocr",
        "run_in_background"
      ],
      "hostModelRouting": [
        {
          "agentName": "BOT MODE Worker",
          "bindings": [
            { "id": "99-or-free", "provider": "OpenRouter", "model": "openrouter/free", "signals": { "pricingTier": "free" } },
            { "id": "01-lightning", "provider": "OpenRouter", "model": "nvidia/nemotron-3.5-lightning:free", "signals": { "pricingTier": "free" } },
            { "id": "02-gemini", "provider": "Gemini", "model": "models/gemini-3.5-flash" },
            { "id": "03-super", "provider": "OpenRouter", "model": "nvidia/nemotron-3-super-120b-a12b:free", "signals": { "pricingTier": "free" } }
          ],
          "preferredBindingId": "01-lightning",
          "routingMode": "adaptive",
          "requestTimeoutMs": 15000,
          "routingConstraints": { "spendingPolicy": "free_first", "preferCached": true },
          "allowFailover": true
        },
        {
          "agentName": "RECHERCHE",
          "bindings": [
            { "id": "99-or-free", "provider": "OpenRouter", "model": "openrouter/free", "signals": { "pricingTier": "free" } },
            { "id": "01-lightning", "provider": "OpenRouter", "model": "nvidia/nemotron-3.5-lightning:free", "signals": { "pricingTier": "free" } },
            { "id": "02-gemini", "provider": "Gemini", "model": "models/gemini-3.5-flash" },
            { "id": "03-super", "provider": "OpenRouter", "model": "nvidia/nemotron-3-super-120b-a12b:free", "signals": { "pricingTier": "free" } }
          ],
          "preferredBindingId": "01-lightning",
          "routingMode": "adaptive",
          "requestTimeoutMs": 15000,
          "routingConstraints": { "spendingPolicy": "free_first", "preferCached": true },
          "allowFailover": true
        },
        {
          "agentName": "ANALYSE",
          "bindings": [
            { "id": "or-free", "provider": "OpenRouter", "model": "openrouter/free" },
            { "id": "or-ultra", "provider": "OpenRouter", "model": "nvidia/nemotron-3-ultra-550b-a55b:free" },
            { "id": "or-super", "provider": "OpenRouter", "model": "nvidia/nemotron-3-super-120b-a12b:free" },
            { "id": "gemini-flash", "provider": "Gemini", "model": "models/gemini-3.5-flash" }
          ],
          "preferredBindingId": "or-ultra",
          "allowFailover": true
        },
        {
          "agentName": "CODE",
          "bindings": [
            { "id": "or-free", "provider": "OpenRouter", "model": "openrouter/free" },
            { "id": "or-laguna", "provider": "OpenRouter", "model": "poolside/laguna-s-2.1:free" },
            { "id": "or-north-code", "provider": "OpenRouter", "model": "cohere/north-mini-code:free" },
            { "id": "gemini-flash", "provider": "Gemini", "model": "models/gemini-3.5-flash" }
          ],
          "preferredBindingId": "or-laguna",
          "allowFailover": true
        },
        {
          "agentName": "DOCUMENTS",
          "bindings": [
            { "id": "or-free", "provider": "OpenRouter", "model": "openrouter/free" },
            { "id": "or-super", "provider": "OpenRouter", "model": "nvidia/nemotron-3-super-120b-a12b:free" },
            { "id": "or-ultra", "provider": "OpenRouter", "model": "nvidia/nemotron-3-ultra-550b-a55b:free" },
            { "id": "gemini-flash", "provider": "Gemini", "model": "models/gemini-3.5-flash" }
          ],
          "preferredBindingId": "or-super",
          "allowFailover": true
        },
        {
          "agentName": "RÉDACTION",
          "bindings": [
            { "id": "or-free", "provider": "OpenRouter", "model": "openrouter/free" },
            { "id": "or-lightning", "provider": "OpenRouter", "model": "nvidia/nemotron-3.5-lightning:free" },
            { "id": "or-super", "provider": "OpenRouter", "model": "nvidia/nemotron-3-super-120b-a12b:free" },
            { "id": "gemini-flash", "provider": "Gemini", "model": "models/gemini-3.5-flash" }
          ],
          "preferredBindingId": "or-lightning",
          "allowFailover": true
        }
      ]
    },
    "custom": [
      {
        "name": "OpenAI",
        "apiKey": "user_provided",
        "baseURL": "https://api.openai.com/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "OpenAI"
      },
      {
        "name": "HuggingFace",
        "apiKey": "user_provided",
        "baseURL": "https://router.huggingface.co/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Hugging Face"
      },
      {
        "name": "DeepSeek",
        "apiKey": "user_provided",
        "baseURL": "https://api.deepseek.com",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "DeepSeek"
      },
      {
        "name": "Gemini",
        "apiKey": "${GEMINI_API_KEY}",
        "baseURL": "https://generativelanguage.googleapis.com/v1beta/openai/",
        "models": {
          "fetch": true,
          "default": [
            "models/gemini-3.5-flash"
          ]
        },
        "titleConvo": true,
        "modelDisplayLabel": "Gemini"
      },
      {
        "name": "Mistral",
        "apiKey": "user_provided",
        "baseURL": "https://api.mistral.ai/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Mistral"
      },
      {
        "name": "Qwen",
        "apiKey": "user_provided",
        "baseURL": "https://dashscope-intl.aliyuncs.com/compatible-mode/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Qwen"
      },
      {
        "name": "GLM",
        "apiKey": "user_provided",
        "baseURL": "https://api.z.ai/api/paas/v4",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "GLM"
      },
      {
        "name": "MiniMax",
        "apiKey": "user_provided",
        "baseURL": "https://api.minimax.io/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "MiniMax"
      },
      {
        "name": "xAI",
        "apiKey": "user_provided",
        "baseURL": "https://api.x.ai/v1",
        "models": {
          "fetch": true,
          "default": [
            "grok-4.7"
          ]
        },
        "titleConvo": true,
        "modelDisplayLabel": "Grok / xAI"
      },
      {
        "name": "Drael",
        "apiKey": "user_provided",
        "baseURL": "https://drael.sh/v1",
        "models": {
          "fetch": true,
          "default": [
            "drael-v1"
          ]
        },
        "titleConvo": true,
        "modelDisplayLabel": "Drael"
      },
      {
        "name": "Ollama",
        "apiKey": "user_provided",
        "baseURL": "http://localhost:11434/v1",
        "models": {
          "fetch": true,
          "default": []
        },
        "titleConvo": true,
        "modelDisplayLabel": "Ollama"
      },
      {
        "name": "OpenRouter",
        "apiKey": "${OPENROUTER_KEY}",
        "baseURL": "https://openrouter.ai/api/v1",
        "models": {
          "default": [
            "openrouter/free",
            "nvidia/nemotron-3-ultra-550b-a55b:free",
            "nvidia/nemotron-3-super-120b-a12b:free",
            "nvidia/nemotron-3.5-lightning:free",
            "poolside/laguna-s-2.1:free",
            "cohere/north-mini-code:free",
            "cognitivecomputations/dolphin-mistral-24b-venice-edition",
            "thedrummer/cydonia-24b-v4.1"
          ],
          "fetch": true
        },
        "titleConvo": false,
        "dropParams": [
          "stop"
        ],
        "modelDisplayLabel": "OpenRouter"
      }
    ]
  },
  "webSearch": {
    "searchProvider": "serper",
    "scraperProvider": "firecrawl",
    "serperApiKey": "${SERPER_API_KEY}",
    "firecrawlApiKey": "${FIRECRAWL_API_KEY}",
    "tavilyApiKey": "${TAVILY_API_KEY}"
  },
  "speech": {
    "tts": {
      "allowedAddresses": [],
      "elevenlabs": {
        "apiKey": "${ELEVENLABS_API_KEY}",
        "model": "eleven_multilingual_v2",
        "voices": [
          "CwhRBWXzGAHq8TQ4Fs17",
          "EXAVITQu4vr4xnSDxMaL",
          "FGY2WhTYpPnrIDTdsKH5",
          "JBFqnCBsd6RMkjVDRZzb"
        ]
      }
    },
    "speechTab": {
      "conversationMode": false,
      "advancedMode": false,
      "speechToText": true,
      "textToSpeech": {
        "engineTTS": "browser",
        "voice": "CwhRBWXzGAHq8TQ4Fs17",
        "automaticPlayback": false,
        "playbackRate": 1.0,
        "cacheTTS": true
      }
    }
  },
  "mcpServers": {
    "mcp-docs": {
      "type": "streamable-http",
      "url": "https://modelcontextprotocol.io/mcp",
      "title": "MCP Documentation",
      "description": "Official Model Context Protocol documentation server.",
      "timeout": 30000
    },
    "fetch": {
      "type": "stdio",
      "command": "npx",
      "args": [
        "mcp-fetch-server@1.1.2"
      ],
      "title": "Web Fetch",
      "description": "Fetch and convert public web pages to Markdown for research.",
      "timeout": 30000
    },
    "github": {
      "type": "streamable-http",
      "url": "https://api.githubcopilot.com/mcp/",
      "apiKey": {
        "key": "${GITHUB_TOKEN}",
        "source": "admin",
        "authorization_type": "bearer"
      },
      "headers": {
        "X-MCP-Toolsets": "repos,issues,pull_requests",
        "X-MCP-Readonly": "true"
      },
      "title": "GitHub",
      "description": "Official GitHub MCP server restricted to read-only repository, issue, and pull request tools.",
      "timeout": 30000
    },
    "higgsfield": {
      "type": "streamable-http",
      "url": "https://mcp.higgsfield.ai/mcp",
      "startup": false,
      "requiresOAuth": true,
      "serverInstructions": true,
      "title": "Higgsfield",
      "description": "Official Higgsfield MCP for image, video, character and audio generation. Automated generations consume Higgsfield credits.",
      "timeout": 30000
    },
    "notion": {
      "type": "streamable-http",
      "url": "https://mcp.notion.com/mcp",
      "startup": false,
      "requiresOAuth": true,
      "serverInstructions": true,
      "title": "Notion",
      "description": "Official Notion MCP for documentation import/export. BOT MODE remains the source of truth; writes require explicit user intent.",
      "timeout": 30000
    }
  }
}
