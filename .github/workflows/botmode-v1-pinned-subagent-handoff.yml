name: BOTMODE V1 Exact HEAD Subagent Handoff E2E

on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-pinned-subagent-handoff.yml'

permissions:
  contents: read

jobs:
  pinned-subagent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      E2E_CHROMIUM_CHANNEL: chrome
      E2E_STREAM_STORE: memory
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact PR HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
      - run: npm ci
      - name: Build app and internal packages
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api
          npm run build:client-package
          npm run build:client
      - name: Exercise actual mock-model nested and parallel handoffs
        run: |
          google-chrome --version
          npx playwright test --config=e2e/playwright.config.mock.ts \
            e2e/specs/mock/agent-handoffs.spec.ts \
            e2e/specs/mock/subagent-results.spec.ts
          echo 'BOTMODE_PINNED_HANDOFF_E2E=PASS'
      - name: Evidence boundary
        if: always()
        run: |
          echo 'Exact PR HEAD source with UI-level nested/parallel mock-model handoffs; no proof of GHCR published runtime or real-provider Oracle mission.' >> "$GITHUB_STEP_SUMMARY"
