        \        send({ role: 'assistant' });\n        if (!hasToolResult) {\n   \
        \         send({\n                tool_calls: [\n                    {\n \
        \                       index: 0,\n                        id: 'observed-search',\n\
        \                        type: 'function',\n                        function:\
        \ { name: 'web_search', arguments: '{\"query\":\"controlled source\"}' },\n\
        \                    },\n                ],\n            });\n           \
        \ send({}, 'tool_calls');\n        }\n        else {\n            send({ content:\
        \ candidate });\n            send({}, 'stop');\n        }\n        res.end('data:\
