name: BOTMODE Explicit Tool Choice Qualification
'on':
  push:
    branches:
    - ops/qualify-tool-choice-638252d1b123-001
permissions:
  contents: read
concurrency:
  group: ops/qualify-tool-choice-638252d1b123-001
  cancel-in-progress: false
env:
  BOTMODE_CANDIDATE_SHA: 638252d1b123ca40e304b96277b68fa2b9b895da
  BOTMODE_IMAGE: botmode-source-built:638252d1b123ca40e304b96277b68fa2b9b895da
  BOTMODE_PUBLISHED_IMAGE: botmode-source-built:638252d1b123ca40e304b96277b68fa2b9b895da
  BOTMODE_MONGO_PASSWORD: ci-isolated-only
  POSTGRES_PASSWORD: ci-isolated-only
  BOTMODE_HOST_PORT: '3090'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_RETRIES: '5'
  BASE_SOURCE: ec0da8d0277ffa9895086ae65e1bf20378ad2f39
  BASE_IMAGE: botmode-source-built:ec0da8d0277ffa9895086ae65e1bf20378ad2f39
jobs:
  qualification:
    if: github.repository == 'Arkos77/LibreChat-BOTMODE-V1' && github.run_attempt
      == 1 && github.event.before == '638252d1b123ca40e304b96277b68fa2b9b895da'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          nodeArch: x64
          runner: ubuntu-latest
          platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: botmode-oci-child-${{ github.run_id }}-${{ github.run_attempt
        }}
      NODE_ARCH: ${{ matrix.nodeArch }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: 638252d1b123ca40e304b96277b68fa2b9b895da
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact frozen composition and record source hashes
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"

        test -z "$(git status --porcelain)"

        git diff --name-only "$BASE_SOURCE" "$BOTMODE_CANDIDATE_SHA" > /tmp/composed-files.txt

        python3 - <<''PY_HASH''

        import hashlib,json

        from pathlib import Path

        paths=Path(''/tmp/composed-files.txt'').read_text().splitlines()

        expected={''packages/api/src/agents/orchestrator/native.ts'',''packages/api/src/agents/orchestrator/native.spec.ts'',''packages/api/src/agents/orchestrator/nativeToolChoiceTransport.spec.ts''}

        assert set(paths)==expected and len(paths)==3

        Path(''/tmp/composed-hashes.json'').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
        for p in paths}))

        print(''CI_BASE_TO_SOURCE_EXACT_THREE_FILE_EQUIVALENCE=PASS'')

        PY_HASH

        '
    - uses: docker/setup-buildx-action@v4
    - uses: actions/download-artifact@v4
      with:
        name: botmode-final-ec0da8d0277f-amd64-40042483574
        path: /tmp
        github-token: ${{ github.token }}
        repository: Arkos77/LibreChat-BOTMODE-V1
        run-id: 40042483574
    - name: Load and verify exact base canonical image
      run: "set -euo pipefail\n(cd /tmp && sha256sum -c final-image.sha256)\ntest\
        \ \"$(cat /tmp/final-source.txt)\" = \"$BASE_SOURCE\"\ndocker load < /tmp/final-image.tar.gz\n\
        python3 - <<'PY_ARCHIVE_IMAGE'\nimport hashlib,json,os,subprocess,tarfile\n\
        with tarfile.open('/tmp/final-image.tar.gz','r:gz') as archive:\n manifest=json.load(archive.extractfile('manifest.json'))\n\
        \ entries=[x for x in manifest if os.environ['BASE_IMAGE'] in (x.get('RepoTags')\
        \ or [])]\n assert len(entries)==1\n raw=archive.extractfile(entries[0]['Config']).read()\n\
        \ assert 'sha256:'+hashlib.sha256(raw).hexdigest()=='sha256:6d2f24ed736acb547c0a408ad3ac9ee96af9a6956271e7083869f93894a2d8de'\n\
        \ config=json.loads(raw)\nlocal=json.loads(subprocess.check_output(['docker','image','inspect',os.environ['BASE_IMAGE']],text=True))[0]\n\
        assert config['architecture']==local['Architecture']=='amd64'\nassert local['RootFS']['Layers']==config['rootfs']['diff_ids']\n\
        for key in ['Env','Entrypoint','Cmd','WorkingDir','User']:assert local['Config'].get(key)==config['config'].get(key)\n\
        assert 'BUILD_COMMIT='+os.environ['BASE_SOURCE'] in local['Config']['Env']\n\
        print('CI_RETAINED_CANONICAL_CONFIG_ROOTFS_SOURCE_IDENTITY=PASS')\nPY_ARCHIVE_IMAGE\n"
    - name: Recompile only API package using unchanged production dependencies; compose
        exact image
      id: build
      run: "set -euo pipefail\n# Extract unchanged production dependencies and compiled\
        \ peer workspaces.\nbase_container=$(docker create \"$BASE_IMAGE\")\ntrap\
        \ 'docker rm -f \"$base_container\" >/dev/null 2>&1 || true' EXIT\ndocker\
        \ cp \"$base_container:/app/node_modules\" ./node_modules\ndocker cp \"$base_container:/app/packages\"\
        \ \"$RUNNER_TEMP/base-packages\"\nfor package in \"$RUNNER_TEMP\"/base-packages/*;\
        \ do\n  name=$(basename \"$package\")\n  if [ \"$name\" != api ] && [ -d \"\
        $package/dist\" ]; then\n    mkdir -p \"packages/$name\"\n    cp -a \"$package/dist\"\
        \ \"packages/$name/dist\"\n  fi\ndone\ndocker rm \"$base_container\" >/dev/null\n\
        trap - EXIT\n# Build tooling stays outside the application and never enters\
        \ the image.\nmkdir -p \"$RUNNER_TEMP/botmode-api-toolchain\" packages/api/node_modules\n\
        npm --prefix \"$RUNNER_TEMP/botmode-api-toolchain\" install --no-save --package-lock=false\
        \ --ignore-scripts --no-audit --no-fund tsdown@0.22.2\nln -s \"$RUNNER_TEMP/botmode-api-toolchain/node_modules/tsdown\"\
        \ packages/api/node_modules/tsdown\n(cd packages/api && node \"$RUNNER_TEMP/botmode-api-toolchain/node_modules/tsdown/dist/run.mjs\"\
        )\ngit diff --exit-code -- package-lock.json package.json packages/api/package.json\n\
        python3 - <<'PY_DOCKERFILE'\nimport os,json,hashlib\nfrom pathlib import Path\n\
        paths=Path('/tmp/composed-files.txt').read_text().splitlines()\nlines=['FROM\
        \ '+os.environ['BASE_IMAGE']]\nfor path in paths:lines.append('COPY --chown=node:node\
        \ '+json.dumps([path,'/app/'+path]))\nlines+=['COPY --chown=node:node packages/api/dist/\
        \ /app/packages/api/dist/','ENV BUILD_COMMIT='+os.environ['BOTMODE_CANDIDATE_SHA'],'ENV\
        \ BUILD_BRANCH='+os.environ['GITHUB_REF_NAME'],'LABEL org.opencontainers.image.revision=\"\
        '+os.environ['BOTMODE_CANDIDATE_SHA']+'\"']\nPath('/tmp/botmode-source-overlay.Dockerfile').write_text('\\\
        n'.join(lines)+'\\n')\nfiles={str(f.relative_to('packages/api/dist')):hashlib.sha256(f.read_bytes()).hexdigest()\
        \ for f in Path('packages/api/dist').rglob('*') if f.is_file()}\nassert 'index.cjs'\
        \ in files and 'index.d.cts' in files\nPath('/tmp/api-compiled-hashes.json').write_text(json.dumps(files))\n\
        print('CI_CANONICAL_API_PACKAGE_RECOMPILED_ONLY=PASS; runtime dependencies\
        \ unchanged')\nPY_DOCKERFILE\ndocker image inspect \"$BASE_IMAGE\" > /tmp/base-image-inspect.json\n\
        docker build --builder default --pull=false --network=none -f /tmp/botmode-source-overlay.Dockerfile\
        \ -t \"$BOTMODE_IMAGE\" .\npython3 - <<'PY_INHERITANCE'\nimport json,os,subprocess\n\
        from pathlib import Path\nbase=json.loads(Path('/tmp/base-image-inspect.json').read_text())[0]\n\
        current=json.loads(subprocess.check_output(['docker','image','inspect',os.environ['BOTMODE_IMAGE']],text=True))[0]\n\
        assert current['Architecture']==base['Architecture']=='amd64'\nold=base['RootFS']['Layers'];new=current['RootFS']['Layers']\n\
        assert new[:len(old)]==old and 1<=len(new)-len(old)<=5\nfor key in ['Entrypoint','Cmd','WorkingDir','User']:assert\
        \ current['Config'].get(key)==base['Config'].get(key)\ndef env(image):return\
        \ {k:v for k,v in (s.split('=',1) for s in image['Config']['Env']) if k not\
        \ in ['BUILD_COMMIT','BUILD_BRANCH']}\nassert env(current)==env(base)\nassert\
        \ 'BUILD_COMMIT='+os.environ['BOTMODE_CANDIDATE_SHA'] in current['Config']['Env']\n\
        print('CI_EXACT_BASE_BINARY_ROOTFS_INHERITANCE_AND_NEW_SOURCE_METADATA=PASS')\n\
        PY_INHERITANCE\ncompiled_hashes=$(cat /tmp/api-compiled-hashes.json)\ndocker\
        \ run --rm --network none -i -e API_HASHES=\"$compiled_hashes\" --entrypoint\
        \ node \"$BOTMODE_IMAGE\" - <<'NODE_API_HASHES'\nconst fs=require('fs'),assert=require('assert/strict'),crypto=require('crypto');\n\
        for(const [p,h] of Object.entries(JSON.parse(process.env.API_HASHES)))assert.equal(crypto.createHash('sha256').update(fs.readFileSync('/app/packages/api/dist/'+p)).digest('hex'),h);\n\
        console.log('CI_ACTUAL_IMAGE_COMPILED_API_HASHES=PASS');\nNODE_API_HASHES\n"
    - name: Verify actual image code, architecture, admission, built key portal and
        license
      run: "set -euo pipefail\ndocker image inspect \"$BOTMODE_IMAGE\" --format '{{range\
