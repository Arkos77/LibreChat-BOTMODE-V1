name: BOTMODE PR77 Source Built Compatibility Qualification
on:
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-pr77-source-built.yml'
      - 'scripts/botmode/ci-source-built-oracle.py'
      - 'api/server/services/Endpoints/agents/hostModelRouting.compat.spec.js'
  workflow_dispatch:
    inputs:
      native_research_only:
        description: 'Run only the compiled native research candidate gate (one image, no publication)'
        type: boolean
        default: false
      host_research:
        description: 'Qualify actual native web tool, HTTP/SSE, Oracle and Mongo on an isolated internal network'
        type: boolean
        default: false
      reuse_host_candidate:
        description: 'Reuse verified a8b8073 image from run40228333797; refuse product-source drift and never rebuild'
        type: boolean
        default: false
      real_free_provider:
        description: 'Explicitly authorize up to four fixed nvidia/nemotron-3.5-super-vl:free requests, reasoning off, through bounded relay (controlled sources)'
        type: boolean
        default: false
      native_fallback:
        description: 'Retained-image native fallback: controlled primary429; real_free_provider=false means internal synthetic replies with no key/egress; true caps upstream at4'
        type: boolean
        default: false
permissions:
  contents: read
env:
  BOTMODE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  invalid-fallback-inputs:
    if: ${{ inputs.native_fallback && (!inputs.host_research || !inputs.reuse_host_candidate || inputs.native_research_only) }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Native fallback requires retained host research and native_research_only=false; real provider is a separate opt-in.' >&2
          exit 1
  binding-regression:
    if: ${{ !inputs.native_fallback && !inputs.native_research_only && !inputs.host_research && !inputs.real_free_provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BOTMODE_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:data-provider && npm run build:data-schemas && npm run build:api
      - name: Real native initializer and SDK against local HTTP 429 fixture
        working-directory: api
        run: npx jest server/services/Endpoints/agents/hostModelRouting.compat.spec.js server/services/Endpoints/agents/hostModelRouting.spec.js --runInBand --coverage=false
      - name: Free-only policy and endpoint regression
        working-directory: packages/api
        run: npx jest src/endpoints/openai/config.spec.ts src/agents/orchestrator/hostModelDecision.spec.ts --runInBand --coverage=false
  source-built-runtime:
    if: ${{ !inputs.native_fallback && !inputs.native_research_only && !inputs.host_research && !inputs.real_free_provider }}
    needs: binding-regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: botmode-oci-child-${{ github.run_id }}-${{ github.run_attempt }}
      BOTMODE_PUBLISHED_IMAGE: botmode-source-built:${{ github.event.pull_request.head.sha || github.sha }}
      BOTMODE_IMAGE: botmode-source-built:${{ github.event.pull_request.head.sha || github.sha }}
      BOTMODE_HOST_PORT: '3090'
      BOTMODE_MONGO_PASSWORD: ci-isolated-only
      POSTGRES_PASSWORD: ci-isolated-only
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BOTMODE_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify source before building
        run: |
          test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@v4
      - name: Build exact source locally without registry publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.BOTMODE_IMAGE }}
          cache-from: type=gha,scope=botmode-amd64
          cache-to: type=gha,mode=max,scope=botmode-amd64
          build-args: |
            BUILD_COMMIT=${{ env.BOTMODE_CANDIDATE_SHA }}
            BUILD_BRANCH=${{ github.head_ref || github.ref_name }}
      - name: Record local image identity and verify embedded source
        run: |
          set -euo pipefail
          docker image inspect "$BOTMODE_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "BUILD_COMMIT=$BOTMODE_CANDIDATE_SHA"
          echo "CI_SOURCE_BUILT_SHA=$BOTMODE_CANDIDATE_SHA"
          docker image inspect "$BOTMODE_IMAGE" --format 'CI_SOURCE_BUILT_IMAGE_ID={{.Id}}'
          echo 'CI_SOURCE_BUILT_REGISTRY_PUBLICATION=NONE'
      - name: Verify native compatible initializer inside the exact image
        run: |
          docker run --rm -i --entrypoint node "$BOTMODE_IMAGE" - <<'NODE'
          const assert = require('node:assert/strict');
          const { initializeAgent } = require('@librechat/api');
          (async () => {
            for (const compatible of [false, true]) {
              const endpoint = { name: 'OpenRouterFreeCompatCI', apiKey: 'fixture-no-network',
                baseURL: 'https://openrouter.ai/api/v1',
                models: { fetch: false, default: ['openrouter/free'] },
                ...(compatible ? { customParams: { defaultParamsEndpoint: 'openAI' } } : {}) };
              const result = await initializeAgent({
                runtime: { user: { id: 'fixture-user' }, requestBody: {}, turnStartedAt: 1,
                  appConfig: { endpoints: { custom: [endpoint] } } },
                agent: { id: 'fixture-agent', provider: endpoint.name, model: 'openrouter/free',
                  tools: [], model_parameters: { model: 'openrouter/free' } },
                allowedProviders: new Set([endpoint.name]),
                endpointOption: { endpoint: 'agents' },
                loadTools: async () => ({ tools: [], toolDefinitions: [] }),
              }, { getFiles: async () => [], getConvoFiles: async () => [], updateFilesUsage: async () => [] });
              assert.equal(result.provider, compatible ? 'openAI' : 'openrouter');
              assert.equal(result.model_parameters.model, 'openrouter/free');
              assert.equal(result.model_parameters.apiKey, 'fixture-no-network');
              assert.equal(result.model_parameters.configuration.baseURL, endpoint.baseURL);
            }
            console.log('CI_SOURCE_BUILT_NATIVE_COMPAT_INITIALIZER=PASS');
          })().catch(() => { console.error('CI_SOURCE_BUILT_NATIVE_COMPAT_INITIALIZER=FAIL'); process.exitCode = 1; });
          NODE
      - name: Reuse same-source five-task, Oracle, Mongo P6 and browser assertions
        run: |
          python3 -m pip install --quiet --break-system-packages PyYAML==6.0.3
          python3 scripts/botmode/ci-source-built-oracle.py
      - name: Destroy only this runner stack
        if: always()
        run: sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes --remove-orphans || true

  compiled-research:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_fallback && !inputs.reuse_host_candidate && (inputs.native_research_only || inputs.host_research) && (!inputs.real_free_provider || inputs.host_research) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CANDIDATE_IMAGE: botmode-native-research:${{ github.sha }}
      HOST_RESEARCH_PROJECT: botmode-research-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - name: Cheap source gates before Docker
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/botmode-python-cache
          CI_REAL_PROVIDER_REQUESTED: ${{ inputs.real_free_provider && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/botmode/tests -p test_fixed_free_preflight.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_source_fixture.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_host_research_guard.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_publication_evidence.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_fallback_sdk_artifact.py
          python3 -m py_compile scripts/botmode/ci-host-research.py
          npm ci --no-audit --no-fund
          npm run build:data-provider
          python3 scripts/botmode/ci-host-research.py --check-config
          if [ "$CI_REAL_PROVIDER_REQUESTED" = true ]; then
            python3 scripts/botmode/ci-host-research.py --check-real-config
            python3 scripts/botmode/ci-host-research.py --check-real-catalog
          fi
          npm run build:data-schemas
          npm run build:api
          NODE_OPTIONS=--max-old-space-size=6144 npm exec --workspace=packages/api tsc -- --noEmit
          npm exec --workspace=packages/api jest -- --runInBand --coverage=false --runTestsByPath src/tools/toolkits/web.spec.ts src/agents/oracle/research2.spec.ts src/agents/orchestrator/publication.spec.ts src/agents/orchestrator/publicationTransport.spec.ts src/agents/oracle/deterministic.spec.ts src/agents/oracle/runtime.spec.ts src/agents/orchestrator/research.spec.ts src/agents/orchestrator/researchSources.spec.ts src/agents/orchestrator/nativeToolChoiceTransport.spec.ts src/agents/orchestrator/nativeFree429Acceptance.spec.ts src/agents/orchestrator/compiledFallbackContext.spec.ts src/agents/orchestrator/admission.spec.ts src/agents/orchestrator/schema.spec.ts
          npm exec --workspace=api jest -- --runInBand --coverage=false --runTestsByPath server/services/Endpoints/agents/nativeMissionPresentation.spec.js server/services/Endpoints/agents/hostModelUsage.spec.js server/services/Endpoints/agents/nativeMissionRecoveredOracleSources.spec.js server/services/Endpoints/agents/hostModelRouting.compat.spec.js server/controllers/agents/callbacks.improvementEvidence.spec.js
          node scripts/botmode/native-research-image-regression.cjs
          node scripts/botmode/native-fallback-context-regression.cjs node_modules/@librechat/agents
      - uses: docker/setup-buildx-action@v4
      - name: Build one exact AMD64 image without publication
        id: candidate_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=gha,scope=botmode-amd64
          cache-to: type=gha,mode=max,scope=botmode-amd64
          build-args: |
            BUILD_COMMIT=${{ env.CANDIDATE_SHA }}
            BUILD_BRANCH=${{ github.ref_name }}
      - name: Check and exercise the exact compiled image without external network
        id: compiled_image
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          docker image inspect "$CANDIDATE_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "BUILD_COMMIT=$CANDIDATE_SHA"
          docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}' > candidate-evidence/image-id.txt
          printf '%s\n' "$CANDIDATE_SHA" > candidate-evidence/source-sha.txt
          docker run --rm --network none --entrypoint node "$CANDIDATE_IMAGE" scripts/botmode/native-research-image-regression.cjs | tee candidate-evidence/research.log
          docker run --rm --network none --entrypoint node "$CANDIDATE_IMAGE" scripts/botmode/native-fallback-context-regression.cjs /app/node_modules/@librechat/agents | tee candidate-evidence/fallback-context.log
      - name: Actual host web research on an isolated internal network
        id: host_research
        if: ${{ inputs.host_research }}
        env:
          CI_REAL_FREE_PROVIDER: ${{ inputs.real_free_provider && 'true' || 'false' }}
          CI_REAL_OPENROUTER_KEY: ${{ inputs.real_free_provider && secrets.OPENROUTER_API_KEY || '' }}
        run: python3 scripts/botmode/ci-host-research.py
      - name: Retain built image and explicit qualification outcomes
        id: archive
        if: ${{ always() && steps.candidate_build.outcome == 'success' }}
        env:
          COMPILED_OUTCOME: ${{ steps.compiled_image.outcome }}
          HOST_OUTCOME: ${{ steps.host_research.outcome }}
          REAL_PROVIDER_REQUESTED: ${{ inputs.real_free_provider && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}' > candidate-evidence/image-id.txt
          printf '%s\n' "$CANDIDATE_SHA" > candidate-evidence/source-sha.txt
          python3 - <<'PY_STATUS'
          import json,os
          from pathlib import Path
          Path('candidate-evidence/qualification-status.json').write_text(json.dumps({
            'source_sha':os.environ['CANDIDATE_SHA'],
            'compiled':os.environ['COMPILED_OUTCOME'],
            'host':os.environ['HOST_OUTCOME'],
            'real_free_provider':os.environ['REAL_PROVIDER_REQUESTED']=='true'}))
          PY_STATUS
          docker save "$CANDIDATE_IMAGE" | gzip -1 > candidate-evidence/image.tar.gz
          (cd candidate-evidence && sha256sum image.tar.gz > image.tar.gz.sha256)
      - name: Preserve lightweight evidence independently of the image archive
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.candidate_build.outcome == 'success' }}
        with:
          name: botmode-native-research-evidence-${{ github.sha }}
          path: |
            candidate-evidence/
            !candidate-evidence/image.tar.gz
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.archive.outcome == 'success' }}
        with:
          name: botmode-native-research-${{ github.sha }}
          path: candidate-evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Record qualification boundary
        if: always()
        run: |
          echo 'Qualification outcomes are recorded separately from the image. Synthetic loopback gates precede any explicitly authorized fixed free-model host test. Web sources remain controlled. No browser, crash restart, installation or stable proof.' >> "$GITHUB_STEP_SUMMARY"

  retained-host-research:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.host_research && inputs.reuse_host_candidate && (!inputs.native_fallback || !inputs.native_research_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      HARNESS_SHA: ${{ github.sha }}
      CANDIDATE_SHA: a8b8073211367c06b33c491dc9973340692a416b
      CANDIDATE_IMAGE: botmode-native-research:a8b8073211367c06b33c491dc9973340692a416b
      CI_NATIVE_FALLBACK: ${{ inputs.native_fallback && 'true' || 'false' }}
      HOST_RESEARCH_PROJECT: botmode-research-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Validate harness and unchanged product before loading image
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/botmode-python-cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test -z "$(git status --porcelain)"
          python3 - <<'PY_DIFF'
          import importlib.util,os,subprocess
          spec=importlib.util.spec_from_file_location('host','scripts/botmode/ci-host-research.py')
          host=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(host)
          host.validate_reused_files(subprocess.check_output(['git','diff','--name-only',os.environ['CANDIDATE_SHA'],os.environ['HARNESS_SHA']],text=True).splitlines())
          PY_DIFF
          python3 -m unittest discover -s scripts/botmode/tests -p test_fixed_free_preflight.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_source_fixture.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_host_research_guard.py
          python3 -m unittest discover -s scripts/botmode/tests -p test_publication_evidence.py
          npm ci --no-audit --no-fund
          npm run build:data-provider
          python3 scripts/botmode/ci-host-research.py --check-config
          python3 scripts/botmode/ci-host-research.py --check-real-config
          python3 scripts/botmode/ci-host-research.py --check-fallback-config
      - name: Check fixed free model catalog before image download (no key or inference)
        if: ${{ inputs.real_free_provider }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/botmode/ci-host-research.py --check-real-catalog
      - uses: actions/download-artifact@v4
        with:
          name: botmode-native-research-a8b8073211367c06b33c491dc9973340692a416b
          run-id: 40228333797
          github-token: ${{ github.token }}
          path: retained-image
      - name: Verify retained archive, image identity and embedded source
        id: retained
        run: |
          set -euo pipefail
          test "$(cat retained-image/source-sha.txt)" = "$CANDIDATE_SHA"
          test "$(cat retained-image/image-id.txt)" = 'sha256:be343811b24d065448620b40a05302e6530a615ac12887544b600a44e3ec4e54'
          printf '%s  %s\n' '02bb76954f8093e2493085f2773aae43cce68457186d6abd23941891b7d98843' retained-image/image.tar.gz | sha256sum -c -
          docker load -i retained-image/image.tar.gz
          test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}')" = 'sha256:be343811b24d065448620b40a05302e6530a615ac12887544b600a44e3ec4e54'
          docker image inspect "$CANDIDATE_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "BUILD_COMMIT=$CANDIDATE_SHA"
      - name: Verify web auth and provider caps inside the retained image without network
        run: |
          set -euo pipefail
          python3 - <<'PY_CONFIG' > "$RUNNER_TEMP/botmode-fixture-config.json"
          import importlib.util,json,os
          spec=importlib.util.spec_from_file_location('host','scripts/botmode/ci-host-research.py')
          host=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(host)
          print(json.dumps(host.build_config(json.load(open('librechat.yaml')), real=True,
              fallback=os.environ['CI_NATIVE_FALLBACK']=='true')))
          PY_CONFIG
          if [ "$CI_NATIVE_FALLBACK" = true ]; then
            timeout 45s docker run --rm -i --network none --entrypoint node "$CANDIDATE_IMAGE" \
              -e "$(cat scripts/botmode/validate-host-research-config.cjs)" -- --runtime-binding \
              < "$RUNNER_TEMP/botmode-fixture-config.json"
          fi
          timeout 45s docker run --rm -i --network none --entrypoint node \
            --env BOTMODE_CI_WEB_URL=http://fixture:8088 --env BOTMODE_CI_WEB_KEY=ci-fixture \
            "$CANDIDATE_IMAGE" -e '
          const fs=require("node:fs"),assert=require("node:assert/strict");
          const {loadWebSearchAuth,getOpenAILLMConfig}=require("@librechat/api");
          (async()=>{
            const config=JSON.parse(fs.readFileSync(0,"utf8"));
            const result=await loadWebSearchAuth({userId:"ci",webSearchConfig:config.webSearch,throwError:false,
              loadAuthValues:async({authFields})=>Object.fromEntries(authFields.map(k=>[k,process.env[k]]))});
            assert.equal(result.authenticated,true);
            assert.equal(result.authResult.searxngInstanceUrl,"http://fixture:8088");
            assert.equal(result.authResult.firecrawlApiUrl,"http://fixture:8088");
            assert.equal(result.authResult.searchProvider,"searxng");
            assert.equal(result.authResult.scraperProvider,"firecrawl");
            assert.equal(result.authResult.rerankerType,"none");
            const endpoint=config.endpoints.custom.find(e=>e.models.default.includes("nvidia/nemotron-3.5-super-vl:free"));
            const fixedModel="nvidia/nemotron-3.5-super-vl:free";
            const {llmConfig}=getOpenAILLMConfig({apiKey:"fixture-key",baseURL:"http://127.0.0.1/v1",
              streaming:true,useOpenRouter:true,modelOptions:{model:fixedModel},addParams:endpoint.addParams});
            assert.equal(llmConfig.model,"nvidia/nemotron-3.5-super-vl:free");
            assert.deepEqual(llmConfig.reasoning,{enabled:false});
            assert.equal(llmConfig.maxRetries,0);
            assert.equal(llmConfig.maxTokens,2048);
            assert.equal(llmConfig.timeout,90000);
            console.log("RETAINED_IMAGE_WEB_AUTH=PASS");
            console.log("RETAINED_IMAGE_FREE_PROVIDER_CAPS=PASS");
            const {createServer}=require("node:http");
            const {initializeModel,Providers}=require("@librechat/agents");
            let wireCalls=0;
            const server=createServer(async(req,res)=>{
              try {
                let raw="";for await(const chunk of req) raw+=chunk;
                const sent=JSON.parse(raw);
                assert.equal(sent.model,fixedModel);
                assert.deepEqual(sent.reasoning,{enabled:false});
                assert.equal(sent.max_tokens,2048);
                assert.equal(sent.models,undefined);
                wireCalls++;
                const choice={index:0,message:{role:"assistant",content:"controlled fixture"},finish_reason:"stop"};
                const reply={id:"local-profile",object:"chat.completion",created:1700000000,model:sent.model,choices:[choice]};
                if(sent.stream){
                  res.writeHead(200,{"Content-Type":"text/event-stream"});
                  reply.choices=[{index:0,delta:choice.message,finish_reason:"stop"}];
                  res.end("data: "+JSON.stringify(reply)+"\n\ndata: [DONE]\n\n");
                } else {res.writeHead(200,{"Content-Type":"application/json"});res.end(JSON.stringify(reply));}
              }catch(e){res.writeHead(400);res.end("profile mismatch");}
            });
            await new Promise(resolve=>server.listen(0,"127.0.0.1",resolve));
            try {
              for(const streaming of [false,true]){
                const model=initializeModel({provider:Providers.OPENROUTER,clientOptions:{...llmConfig,streaming,
                  configuration:{baseURL:"http://127.0.0.1:"+server.address().port+"/v1"}}});
                const messages=[{role:"user",content:"Controlled local wire test"}];
                if(streaming){
                  let content="";for await(const chunk of await model.stream(messages))content+=chunk.content;
                  assert.equal(content,"controlled fixture");
                }else{
                  assert.equal((await model.invoke(messages)).content,"controlled fixture");
                }
              }
              assert.equal(wireCalls,2);
            }finally{server.closeAllConnections();await new Promise(resolve=>server.close(resolve));}
            console.log("RETAINED_IMAGE_FIXED_PROFILE_WIRE=PASS");
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          ' < "$RUNNER_TEMP/botmode-fixture-config.json"
      - name: Qualify native host path using the retained image
        id: host
        env:
          CI_REAL_FREE_PROVIDER: ${{ inputs.real_free_provider && 'true' || 'false' }}
          CI_REAL_OPENROUTER_KEY: ${{ inputs.real_free_provider && secrets.OPENROUTER_API_KEY || '' }}
        run: python3 scripts/botmode/ci-host-research.py
      - name: Record separate source and harness identities
        if: always()
        env:
          RETAINED_OUTCOME: ${{ steps.retained.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          REAL_PROVIDER_REQUESTED: ${{ inputs.real_free_provider && 'true' || 'false' }}
        run: |
          mkdir -p candidate-evidence
          python3 - <<'PY_STATUS'
          import json,os
          from pathlib import Path
          Path('candidate-evidence/qualification-status.json').write_text(json.dumps({
            'source_sha':os.environ['CANDIDATE_SHA'],'harness_sha':os.environ['HARNESS_SHA'],
            'retained_image':os.environ['RETAINED_OUTCOME'],'host':os.environ['HOST_OUTCOME'],
            'compiled_proof_run':40228333797,'image_artifact':12612047426,'new_build':False,
            'native_fallback':os.environ['CI_NATIVE_FALLBACK']=='true',
            'primary_429':'synthetic controlled' if os.environ['CI_NATIVE_FALLBACK']=='true' else None,
            'real_free_provider':os.environ['REAL_PROVIDER_REQUESTED']=='true'}))
          PY_STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botmode-retained-host-${{ github.sha }}
          path: candidate-evidence/
          retention-days: 3
          if-no-files-found: error
