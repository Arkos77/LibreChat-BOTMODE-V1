name: BOTMODE PR77 One Authorized Free Real Mission
"on":
  push:
    branches:
      - ops/live-free-ceb60eca989b-001
permissions:
  contents: read
  packages: read
env:
  BOTMODE_CANDIDATE_SHA: ceb60eca989b8850ac10fab84f1eaac1eedd79ec
  BOTMODE_PUBLISHED_IMAGE: ghcr.io/arkos77/librechat-botmode-v1@sha256:32b29308e883e83aee5bdb3b702492c2abff46a0843bdc30936d0e981766555d
  BOTMODE_IMAGE: ghcr.io/arkos77/librechat-botmode-v1@sha256:32b29308e883e83aee5bdb3b702492c2abff46a0843bdc30936d0e981766555d
  BOTMODE_MONGO_PASSWORD: ci-isolated-only
  POSTGRES_PASSWORD: ci-isolated-only
jobs:
  one-authorized-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: botmode-oci-child-${{ github.run_id }}-${{ github.run_attempt }}
      BOTMODE_HOST_PORT: "3090"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BOTMODE_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact source and anonymous digest pull
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$BOTMODE_PUBLISHED_IMAGE"
          docker image inspect "$BOTMODE_PUBLISHED_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx "BUILD_COMMIT=$BOTMODE_CANDIDATE_SHA"
          echo "CI_EXACT_APPROVED_OCI=$BOTMODE_PUBLISHED_IMAGE"
      - name: Native compatible initializer in published image
        run: |
          docker run --rm -i --entrypoint node "$BOTMODE_IMAGE" - <<'NODE'
          const assert = require('node:assert/strict');
          const { initializeAgent } = require('@librechat/api');
          (async () => {
            for (const compatible of [false, true]) {
              const endpoint = { name: 'OpenRouterFreeCompatCI', apiKey: 'fixture-no-network',
                baseURL: 'https://openrouter.ai/api/v1',
                models: { fetch: false, default: ['openrouter/free'] },
                ...(compatible ? { customParams: { defaultParamsEndpoint: 'openAI' } } : {}) };
              const result = await initializeAgent({
                runtime: { user: { id: 'fixture-user' }, requestBody: {}, turnStartedAt: 1,
                  appConfig: { endpoints: { custom: [endpoint] } } },
                agent: { id: 'fixture-agent', provider: endpoint.name, model: 'openrouter/free',
                  tools: [], model_parameters: { model: 'openrouter/free' } },
                allowedProviders: new Set([endpoint.name]),
                endpointOption: { endpoint: 'agents' },
                loadTools: async () => ({ tools: [], toolDefinitions: [] }),
              }, { getFiles: async () => [], getConvoFiles: async () => [], updateFilesUsage: async () => [] });
              assert.equal(result.provider, compatible ? 'openAI' : 'openrouter');
              assert.equal(result.model_parameters.model, 'openrouter/free');
              assert.equal(result.model_parameters.apiKey, 'fixture-no-network');
              assert.equal(result.model_parameters.configuration.baseURL, endpoint.baseURL);
            }
            console.log('CI_EXACT_OCI_NATIVE_COMPAT_INITIALIZER=PASS');
          })().catch(() => { console.error('CI_EXACT_OCI_NATIVE_COMPAT_INITIALIZER=FAIL'); process.exitCode = 1; });
          NODE
      - name: Prepare isolated native runtime and synthetic fixture identities
        run: |
          python3 -m pip install --quiet --break-system-packages PyYAML==6.0.3
          python3 - <<'PY_HARNESS'
          import os,subprocess,yaml
          from pathlib import Path
          w=yaml.safe_load(Path('.github/workflows/botmode-v1-exact-candidate-oci-probe.yml').read_text())
          steps=w['jobs']['current-candidate-runtime']['steps']
          for name in ['Boot current candidate with disposable MongoDB']:
              matches=[s for s in steps if s.get('name')==name]
              assert len(matches)==1,'EXACT_SOURCE_HARNESS_MISMATCH'
              step=matches[0]
              assert chr(36) + '{{' not in step['run'],'UNRESOLVED_EXPRESSION'
              subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],env={**os.environ,**step.get('env',{})},check=True)
          print('CI_REAL_NATIVE_FIXTURE_SETUP=PASS',flush=True)
          PY_HARNESS
      - name: Attest public zero pricing for both authorized models
        run: |
          python3 - <<'PY_PRICE'
          import json
          from decimal import Decimal
          from urllib.request import Request,urlopen
          with urlopen(Request('https://openrouter.ai/api/v1/models',headers={'Accept':'application/json','User-Agent':'BOTMODE-Free-Only-Approved-Test'}),timeout=25) as r:
              catalog=json.load(r)
          for name in ('google/gemma-4-31b-it:free','openrouter/free'):
              matches=[m for m in catalog.get('data',[]) if m.get('id')==name]
              assert len(matches)==1,'BLOCKED_PROVIDER_AUTHORIZED_FREE_MODEL_MISSING'
              pricing=matches[0].get('pricing',{})
              assert all(Decimal(str(pricing.get(k,'1')))==0 for k in ('prompt','completion')),'BLOCKED_PROVIDER_ZERO_PRICE_NOT_ATTESTED'
              assert all(Decimal(str(pricing[k]))==0 for k in ('request','internal_reasoning') if k in pricing and pricing[k] is not None),'BLOCKED_PROVIDER_ADDITIONAL_PRICE_NOT_ZERO'
          print('CI_REAL_TWO_AUTHORIZED_ZERO_PRICE_ROUTES=PASS',flush=True)
          PY_PRICE
      - name: One real free-only five-task mission after synthetic gates
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI_EXTERNAL_FREE_PROVIDER: "true"
          CI_LIVE_FREE_FIVE_TASKS: "true"
          CI_LIVE_FREE_DISABLE_FALLBACK_DIAG: "false"
          CI_LIVE_FREE_COMPAT_FALLBACK_DIAG: "true"
        run: |
          set -euo pipefail
          if test "${#OPENROUTER_API_KEY}" -le 16; then
            echo 'CI_REAL_RESULT=BLOCKED_PROVIDER_NO_KEY'
            exit 3
          fi
          echo "::add-mask::$OPENROUTER_API_KEY"
          python3 - <<'PY_PIN'
          import os
          from pathlib import Path
          p=Path('scripts/botmode/ci-live-free-child-preflight.sh')
          s=p.read_text()
          old="test \"${BOTMODE_PUBLISHED_IMAGE:-}\" = 'ghcr.io/arkos77/librechat-botmode-v1@sha256:ee4af50a8baa8795509fb3c0abba362a104fbae7b0de5eac8a9f1afb8e4a60d0'"
          assert s.count(old)==1,'EXACT_OCI_PREFLIGHT_GUARD_ANCHOR'
          ref=os.environ['BOTMODE_PUBLISHED_IMAGE']
          assert ref=='ghcr.io/arkos77/librechat-botmode-v1@sha256:32b29308e883e83aee5bdb3b702492c2abff46a0843bdc30936d0e981766555d','EXACT_32b29308e883e83aee5bdb3b702492c2abff46a0843bdc30936d0e981766555d_REQUIRED'
          s=s.replace(old,'test "${BOTMODE_PUBLISHED_IMAGE:-}" = "'+ref+'"')
          p.write_text(s)
          gate=Path('scripts/botmode/ci-live-free-child-oracle-gate.py')
          g=gate.read_text()
          anchor='    stream_id = envelope["streamId"]'
          assert g.count(anchor)==1,'LIVE_CONTEXT_ANCHOR'
          extra='\n    Path("/tmp/botmode-live-proof-context.json").write_text(json.dumps({"streamId":stream_id,"conversationId":conversation_id,"missionId":mission_id}))\n    Path("/tmp/botmode-live-proof-context.json").chmod(0o600)'
          gate.write_text(g.replace(anchor,anchor+extra))
          PY_PIN
          set +e
          bash scripts/botmode/ci-live-free-child-preflight.sh 2>&1 | tee /tmp/botmode-real-result.log
          code=${PIPESTATUS[0]}
          set -e
          if test "$code" != 0; then
            if grep -Eq 'CI_LIVE_FREE_FINAL_ERROR_CLASS=(RATE_LIMIT|PROVIDER_UNAVAILABLE)' /tmp/botmode-real-result.log; then
              echo 'CI_REAL_RESULT=BLOCKED_PROVIDER'
            else
              echo 'CI_REAL_RESULT=FAIL_REQUIRES_CLASSIFICATION'
            fi
            exit "$code"
          fi
          echo 'CI_REAL_RESULT=PASS_EXISTING_FREE_FIVE_TASK_HARNESS'
      - name: Read back same mission canonical Mongo publication and receipts
        run: |
          python3 - <<'PY_P6'
          import json,subprocess,time
          from pathlib import Path
          ctx=json.loads(Path('/tmp/botmode-live-proof-context.json').read_text())
          compose=['docker','compose','-f','docker-compose.botmode.yml','-f','docker-compose.botmode-lite.yml']
          key='::stream:{'+ctx['streamId']+'}:job'
          fields=[]
          for _ in range(30):
              r=subprocess.run(compose+['exec','-T','redis','redis-cli','--raw','HMGET',key,'status','responseMessageId','terminalPersistencePending'],capture_output=True,text=True,timeout=15)
              fields=r.stdout.splitlines() if r.returncode==0 else []
              if len(fields)>=3 and fields[0]=='complete' and fields[1] and fields[2] in ('0','false','False'):break
              time.sleep(1)
          assert len(fields)>=3 and fields[0]=='complete' and fields[1] and fields[2] in ('0','false','False'),'REAL_P6_TERMINAL_NOT_COMMITTED'
          js=r"""
          const mongoose=require('mongoose');
          (async()=>{
            await mongoose.connect(process.env.MONGO_URI);
            const db=mongoose.connection.db;
            const cid=process.env.CI_REAL_CID, mid=process.env.CI_REAL_MID;
            const conversation=await db.collection('conversations').findOne({conversationId:cid},{projection:{conversationId:1}});
            const messages=await db.collection('messages').find({conversationId:cid,isCreatedByUser:false,unfinished:false},{projection:{messageId:1,parentMessageId:1,content:1,metadata:1}}).toArray();
            const message=messages.find(m=>m.messageId===mid);
            const valid=Boolean(conversation && messages.length===1 && message && message.parentMessageId && Array.isArray(message.content) && message.content.some(p=>p.type==='text' && typeof p.text==='string' && p.text.trim()));
            const receipt=message?.metadata?.hostModelUsage;
            console.log('CI_REAL_P6_CANONICAL_ASSISTANT_COUNT='+messages.length);
            console.log('CI_REAL_P6_SAME_MISSION_MONGO_COMMITTED='+String(valid).toUpperCase());
            console.log('CI_REAL_HOST_USAGE_RECEIPT='+String(Boolean(receipt)).toUpperCase());
            console.log('CI_REAL_FALLBACK_RECEIPT='+String(receipt?.fallbackUsed===true).toUpperCase());
            if(receipt){
              console.log('CI_REAL_RECEIPT_FREE_ONLY='+String(receipt.spendingPolicy==='free_only').toUpperCase());
              console.log('CI_REAL_RECEIPT_MODEL_CALL_COUNT='+(Array.isArray(receipt.modelCalls)?receipt.modelCalls.length:0));
            }
            await mongoose.disconnect();
            if(!valid)process.exitCode=3;
          })().catch(()=>{console.log('CI_REAL_P6_READBACK=FAIL');process.exitCode=2});
          """
          r=subprocess.run(compose+['exec','-T','-e','CI_REAL_CID='+ctx['conversationId'],'-e','CI_REAL_MID='+fields[1],'api','node','-e',js],capture_output=True,text=True,timeout=60)
          for line in r.stdout.splitlines():
              if line.startswith('CI_REAL_'):print(line,flush=True)
          assert r.returncode==0,'REAL_SAME_MISSION_P6_MONGO_NOT_PROVEN'
          print('CI_REAL_FIVE_TASKS_ORACLE_P6_DURABLE=PASS',flush=True)
          PY_P6
      - name: Classify child execution exception from API logs
        if: failure()
        env:
          BOTMODE_MONGO_PASSWORD: ci-isolated-only
          POSTGRES_PASSWORD: ci-isolated-only
          BOTMODE_IMAGE: ${{ env.BOTMODE_PUBLISHED_IMAGE }}
        shell: bash
        run: |
          docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml logs --no-color api > /tmp/botmode-api-failure.log 2>/dev/null || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('/tmp/botmode-api-failure.log').read_text(errors='replace').splitlines()
          # Diagnose SDK provider-registry failure on the real API process.
          # Never emit arbitrary log text or stack arguments.
          unsupported=[i for i,line in enumerate(lines) if 'Unsupported LLM provider: openrouter' in line]
          print('CI_SDK_OPENROUTER_UNSUPPORTED_LOG_COUNT='+str(len(unsupported)),flush=True)
          safe_frames=('providerRegistry','llm/init','llm/invoke','Graph','initialize','hostModelRouting','getChatModelClass','initializeModel','tryFallbackProviders','node_modules')
          for idx in unsupported[-2:]:
              window=lines[max(0,idx-3):idx+25]
              approved=[]
              for line in window:
                  if not any(p in line for p in safe_frames):
                      continue
                  for label in safe_frames:
                      if label in line and label not in approved:
                          approved.append(label)
              print('CI_SDK_OPENROUTER_CALL_PATH='+','.join(approved[:12]),flush=True)
          hits=[i for i,line in enumerate(lines) if '[subagentThreads] Child-thread execution failed' in line]
          print('CI_CHILD_EXCEPTION_LOG_ENTRIES='+str(len(hits)))
          # The process logger can serialize structured fields across lines.
          # Inspect only narrowly scoped exception class and stack frame tokens;
          # never print full log records, raw arguments, or credentials.
          for i in hits[-2:]:
              window=' '.join(lines[max(0,i-2):i+24])
              for marker in ('errorName','stack','detail'):
                  print('CI_CHILD_LOG_FIELD_'+marker.upper()+'='+str(marker in window))
              for kind in ('TypeError','ReferenceError','Error','SyntaxError','RangeError'):
                  if re.search(r'(?<![A-Za-z])'+kind+r'(?![A-Za-z])',window):
                      print('CI_CHILD_LOG_ERROR_KIND='+kind)
                      break
              for match in re.finditer(r'at\s+([A-Za-z0-9_$.<>]+)\s*\(',window):
                  print('CI_CHILD_LOG_FRAME_FUNCTION='+match.group(1)[:100])
                  break
          for i in hits[-3:]:
              block='\n'.join(lines[i:i+14])
              names=re.findall(r'errorName[^A-Za-z]+([A-Za-z][A-Za-z0-9]*)',block)
              print('CI_CHILD_EXCEPTION_NAME='+(','.join(names[:2]) or 'unknown'))
              # Winston may serialize the exception as a one-line JSON string;
              # report only field names and bounded, non-sensitive stack locations.
              try:
                  payload=lines[i].split(' | ',1)[-1]
                  obj=__import__('json').loads(payload)
                  if isinstance(obj,dict):
                      print('CI_CHILD_EXCEPTION_FIELDS='+','.join(sorted(obj.keys()))[:150])
                      value=obj.get('errorName') or obj.get('name')
                      if isinstance(value,str) and re.fullmatch(r'[A-Za-z][A-Za-z0-9]{0,63}',value):
                          print('CI_CHILD_EXCEPTION_JSON_NAME='+value)
              except (ValueError,TypeError):
                  pass
              for candidate in ('TypeError','ReferenceError','ValidationError','AbortError','MongoServerError','SubagentThreadPublicError'):
                  if candidate in block:
                      print('CI_CHILD_EXCEPTION_CLASS='+candidate)
              print('CI_CHILD_EXCEPTION_HAS_STACK='+str('stack:' in block))
          PY
      - name: Destroy runner-only stack
        if: always()
        run:
          sudo docker compose -f docker-compose.botmode.yml -f docker-compose.botmode-lite.yml down --volumes --remove-orphans
          || true
    if:
      github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'ceb60eca989b8850ac10fab84f1eaac1eedd79ec'
      && github.repository == 'Arkos77/LibreChat-BOTMODE-V1'
concurrency:
  group: botmode-live-free-ceb60eca989b-001
  cancel-in-progress: false
