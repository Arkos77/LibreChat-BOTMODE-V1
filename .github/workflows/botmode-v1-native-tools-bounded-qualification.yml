name: BOTMODE Exact Retained Native Tools and Auth Qualification
'on':
  push:
    branches:
    - ops/qualify-native-source-a95978795082-reuse-003
permissions:
  contents: read
concurrency:
  group: ops/qualify-native-source-a95978795082-reuse-003
  cancel-in-progress: false
env:
  BOTMODE_CANDIDATE_SHA: a95978795082c72c9e33637e54775402c902bab4
  BOTMODE_IMAGE: botmode-source-built:a95978795082c72c9e33637e54775402c902bab4
  BOTMODE_PUBLISHED_IMAGE: botmode-source-built:a95978795082c72c9e33637e54775402c902bab4
  BOTMODE_MONGO_PASSWORD: ci-isolated-only
  POSTGRES_PASSWORD: ci-isolated-only
  BOTMODE_HOST_PORT: '3090'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_RETRIES: '5'
jobs:
  qualification:
    if: github.repository == 'Arkos77/LibreChat-BOTMODE-V1' && github.run_attempt
      == 1 && github.event.before == 'a95978795082c72c9e33637e54775402c902bab4'
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          nodeArch: x64
          runner: ubuntu-latest
          platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: botmode-oci-child-${{ github.run_id }}-${{ github.run_attempt
        }}
      NODE_ARCH: ${{ matrix.nodeArch }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: a95978795082c72c9e33637e54775402c902bab4
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact frozen composition and record source hashes
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$BOTMODE_CANDIDATE_SHA"

        test -z "$(git status --porcelain)"

        git diff-tree --no-commit-id --name-only -r "$BOTMODE_CANDIDATE_SHA" > /tmp/composed-files.txt

        python3 - <<''PY_HASH''

        import hashlib,json

        from pathlib import Path

        paths=[p for p in Path(''/tmp/composed-files.txt'').read_text().splitlines()
        if not p.startswith(''docs/'')]

        assert len(paths)==3

        hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}

        Path(''/tmp/composed-hashes.json'').write_text(json.dumps(hashes))

        PY_HASH

        '
    - uses: docker/setup-buildx-action@v4
    - uses: actions/download-artifact@v4
      with:
        name: botmode-final-a95978795082-amd64-40038791464
        path: /tmp
        github-token: ${{ github.token }}
        repository: Arkos77/LibreChat-BOTMODE-V1
        run-id: 40038791464
    - name: Load exact canonical image; no rebuild
      run: "set -euo pipefail\n(cd /tmp && sha256sum -c final-image.sha256)\ntest\
        \ \"$(cat /tmp/final-source.txt)\" = \"$BOTMODE_CANDIDATE_SHA\"\ndocker load\
        \ < /tmp/final-image.tar.gz\npython3 - <<'PY_ARCHIVE_IMAGE'\nimport hashlib,json,os,subprocess,tarfile\n\
        with tarfile.open('/tmp/final-image.tar.gz','r:gz') as archive:\n manifest=json.load(archive.extractfile('manifest.json'))\n\
        \ entries=[x for x in manifest if os.environ['BOTMODE_IMAGE'] in (x.get('RepoTags')\
        \ or [])]\n assert len(entries)==1\n raw=archive.extractfile(entries[0]['Config']).read()\n\
        \ assert 'sha256:'+hashlib.sha256(raw).hexdigest()=='sha256:6a3459f0d2f5c921400607d92e6ffce1fbbb8afedf690667d64da2bcac730e93'\n\
        \ config=json.loads(raw)\nlocal=json.loads(subprocess.check_output(['docker','image','inspect',os.environ['BOTMODE_IMAGE']],text=True))[0]\n\
        assert config['architecture']==local['Architecture']=='amd64'\nassert local['RootFS']['Layers']==config['rootfs']['diff_ids']\n\
        for key in ['Env','Entrypoint','Cmd','WorkingDir','User']:assert local['Config'].get(key)==config['config'].get(key)\n\
        assert 'BUILD_COMMIT='+os.environ['BOTMODE_CANDIDATE_SHA'] in local['Config']['Env']\n\
        print('CI_RETAINED_CANONICAL_CONFIG_ROOTFS_SOURCE_IDENTITY=PASS')\nPY_ARCHIVE_IMAGE\n"
    - name: Verify actual image code, architecture, admission, built key portal and
        license
      run: "set -euo pipefail\ndocker image inspect \"$BOTMODE_IMAGE\" --format '{{range\
        \ .Config.Env}}{{println .}}{{end}}' | grep -Fx \"BUILD_COMMIT=$BOTMODE_CANDIDATE_SHA\"\
        \nexpected_hashes=$(cat /tmp/composed-hashes.json)\ndocker run --rm --network\
        \ none -i -e EXPECTED_HASHES=\"$expected_hashes\" -e EXPECTED_ARCH=\"$NODE_ARCH\"\
        \ --entrypoint node \"$BOTMODE_IMAGE\" - <<'NODE_IMAGE'\nconst assert=require('node:assert/strict'),fs=require('node:fs'),crypto=require('node:crypto');\n\
        for(const [p,h] of Object.entries(JSON.parse(process.env.EXPECTED_HASHES))){assert.equal(crypto.createHash('sha256').update(fs.readFileSync('/app/'+p)).digest('hex'),h)}\n\
        assert.equal(process.arch,process.env.EXPECTED_ARCH);\nconst tests=[];global.describe=(_n,f)=>f();global.it=(n,f)=>tests.push([n,f]);\n\
        global.expect=a=>({toEqual:b=>assert.deepEqual(a,b),toThrow:b=>assert.throws(a,typeof\
        \ b==='string'?e=>e.message.includes(b):undefined),not:{toThrow:()=>assert.doesNotThrow(a)}});\n\
        require('/app/api/server/controllers/agents/orchestratorMissionBindings.spec.js');\n\
        for(const [n,f] of tests){f();console.log('CI_COMPOSED_ADMISSION_TEST=PASS:'+n)}assert.equal(tests.length,5);\n\
        const assets='/app/client/dist/assets';const js=fs.readdirSync(assets).filter(p=>p.endsWith('.js')).map(p=>fs.readFileSync(assets+'/'+p,'utf8')).join('\\\
        n');\nassert.ok(js.includes('https://platform.openai.com/api-keys')&&js.includes('https://openrouter.ai/settings/keys')&&js.includes('com_endpoint_config_key_portal_renew'));\n\
        assert.ok(fs.readFileSync('/app/THIRD_PARTY_NOTICES.md','utf8').includes('@codesandbox/nodebox@0.1.8'));\n\
        const license=['/app/THIRD_PARTY_LICENSES/Nodebox-SUL-1.0.txt','/app/node_modules/@codesandbox/nodebox/LICENSE','/app/client/node_modules/@codesandbox/nodebox/LICENSE'].find(p=>fs.existsSync(p));assert.ok(license);\n\
        assert.equal(crypto.createHash('sha256').update(fs.readFileSync(license)).digest('hex'),'5aca9a36f98d883157f1d1a567347c3d776b7ae60bf93fbb7bfa190f1e3ccf46');\n\
        \nconst {botModeSettingsSchema,resolveBotModeSearchParams}=require('/app/packages/data-provider/dist/index.js');\n\
        const {prepareBotModeSettings}=require('/app/api/server/controllers/agents/botModeSettings.js');\n\
        const settings=botModeSettingsSchema.parse({version:1,mode:'analyze',selectionMode:'auto',workerAgentId:'worker',agents:[{id:'research',name:'RECHERCHE'}]});\n\
        const conversation={conversationId:'saved',endpoint:'agents',agent_id:'worker',botMode:settings};\n\
        for(const query of ['', 'botmode=1'])assert.equal(resolveBotModeSearchParams(new\
        \ URLSearchParams(query),conversation).get('botmode_mode'),'analyze');\nassert.equal(resolveBotModeSearchParams(new\
        \ URLSearchParams('botmode=1&botmode_mode=fast'),conversation).get('botmode_mode'),'fast');\n\
        assert.equal(resolveBotModeSearchParams(new URLSearchParams(),{...conversation,conversationId:'new'}).has('botmode'),false);\n\
        assert.throws(()=>prepareBotModeSettings({saved:settings,agentId:'worker'}),/BOTMODE_CONTEXT_REQUIRED/);\n\
        assert.ok(js.includes('com_ui_botmode_mode_analyze'));\nconsole.log('CI_COMPILED_DURABLE_SETTINGS_AND_DOWNGRADE_GUARD=PASS');\n\
        \nconsole.log('CI_COMPOSED_SOURCE_HASHES_ARCH_ADMISSION_BUILT_PORTAL_LICENSE=PASS');\n\
        NODE_IMAGE\n\ndocker run --rm --network none -i --entrypoint node \"$BOTMODE_IMAGE\"\
        \ - <<'NODE_SOURCES'\nconst assert=require('node:assert/strict');\nconst api=require('/app/packages/api/dist/index.cjs');\n\
        (async()=>{\nconst mission=api.prepareBotModeMission({missionId:'source-image',taskId:'source-root',objective:'Controlled\
        \ source',constraints:[],requiredCapabilities:['web_search']});\nconst plan=api.deterministicPlanner.planMission(mission,{worker:{id:'worker',agentId:'worker',role:'worker',capabilities:['web_search'],constraints:[]},specialists:[]});\n\
        const task=plan.tasks[0];\nassert.equal(api.resolveNativeMissionToolAgentId(plan,task.nodeId),'worker');assert.equal(api.resolveNativeMissionToolAgentId(plan,'foreign-node'),'foreign-node');\n\
        api.assertResearchToolAvailability(plan,[{id:'worker',tools:[],toolDefinitions:[{name:'web_search'}]}]);\n\
        assert.throws(()=>api.assertResearchToolAvailability(plan,[{id:'worker',tools:[]}]),/BOTMODE_WEB_SEARCH_UNAVAILABLE/);\n\
        const buffer=api.createTransientEvidenceBuffer();const call={toolCallId:'search-call',toolName:'web_search',taskId:task.taskId,producerAgentId:'worker'};\n\
        buffer.append({...call,criterionId:'botmode:completed',value:true});\nbuffer.append({...call,sourceUrls:['https://ci-source.invalid/report']});\n\
        assert.equal(buffer.size,2);\nassert.throws(()=>buffer.append({...call,sourceUrls:['https://forged.invalid']}),/replay\
        \ conflict/);\nlet state;for(const observation of buffer.snapshot())state=api.promoteTransientMissionOracleEvidence(plan,state,observation);\n\
        state=api.normalizeMissionOracleState(JSON.parse(JSON.stringify(state)));\n\
        assert.equal(state.evidence[task.taskId].length,1);assert.equal(state.sources[task.taskId].length,1);\n\
        const input={taskId:task.taskId,nodeId:task.nodeId,agentId:'worker',requirements:task.validation,observedSources:state.sources[task.taskId],evidence:state.evidence[task.taskId]};\n\
        for(const candidate of [{ok:true},{ok:true,result:''},{ok:true,result:'See\
        \ HTTPS://forged.invalid/claim',sources:'https://forged.invalid/claim'}]){\n\
        \ const result=await api.validateMissionTask({...input,candidate:JSON.stringify(candidate)});\n\
        \ assert.throws(()=>api.assertMissionTaskVerified(result),/REJECTED/);\n}\n\
        const candidate=JSON.stringify({ok:true,result:'Controlled source: https://ci-source.invalid/report',sources:'https://ci-source.invalid/report'});\n\
        const result=await api.validateMissionTask({...input,candidate});api.assertMissionTaskVerified(result);\n\
        const absent=await api.validateMissionTask({...input,observedSources:[],candidate});assert.throws(()=>api.assertMissionTaskVerified(absent),/REJECTED/);\n\
        const context=api.createMissionEvidenceContext();context.configure({traceId:'trace',declarations:[],sourceTasks:[{nodeId:task.nodeId,taskId:task.taskId,producerAgentId:'worker'}]});\n\
        assert.equal(context.resolve(task.nodeId).collectSources,true);assert.equal(context.resolve('foreign'),undefined);\n\
        console.log('CI_COMPILED_RESULT_SOURCE_STATE_NEGATIVE_AND_POSITIVE=PASS');\n\
        })().catch(e=>{console.error(e.name+': '+e.message);process.exit(1)});\nNODE_SOURCES\n"
    - name: Verify compiled JSON HTTP transport and aggregated Oracle rejection without
        external inference
      run: "set -euo pipefail\ndocker run --rm --network none -i -e USE_REDIS=false\
        \ --entrypoint node \"$BOTMODE_IMAGE\" - <<'NODE_CONTRACT'\nconst http = require('http');\n\
        const assert = require('node:assert/strict');\nconst root = '/app';\nconst\
        \ { deterministicPlanner, compileNativePlan, validateMissionTask, getMissionOracleFailure\
        \ } = require(root + '/packages/api/dist/index.cjs');\nconst localRequire\
        \ = require('node:module').createRequire(root + '/package.json');\nconst {\
        \ Run, Providers } = localRequire('@librechat/agents');\nconst { HumanMessage\
        \ } = localRequire('@librechat/agents/langchain/messages');\n(async () =>\
        \ {\n  const requests = [];\n  const server = http.createServer(async (req,\
        \ res) => {\n    let raw = '';\n    for await (const b of req) raw += b;\n\
        \    const body = JSON.parse(raw);\n    requests.push(body);\n    const base\
        \ = { id: 'offline-contract', object: 'chat.completion', created: 1, model:\
        \ body.model };\n    if (body.stream) {\n      res.writeHead(200, { 'content-type':\
        \ 'text/event-stream' });\n      for (const choice of [{ delta: { role: 'assistant',\
        \ content: '{\"ok\":true,\"result\":\"offline checked fixture\"}' }, finish_reason:\
        \ null }, { delta: {}, finish_reason: 'stop' }]) {\n        res.write('data:\
        \ ' + JSON.stringify({ ...base, object: 'chat.completion.chunk', choices:\
        \ [{ index: 0, ...choice }] }) + '\\n\\n');\n      }\n      res.end('data:\
        \ [DONE]\\n\\n');\n    } else {\n      res.writeHead(200, { 'content-type':\
        \ 'application/json' });\n      res.end(JSON.stringify({ ...base, choices:\
        \ [{ index: 0, message: { role: 'assistant', content: '{\"ok\":true,\"result\"\
        :\"offline checked fixture\"}' }, finish_reason: 'stop' }], usage: { prompt_tokens:\
        \ 1, completion_tokens: 1, total_tokens: 2 } }));\n    }\n  });\n  await new\
        \ Promise(r => server.listen(0, '127.0.0.1', r));\n  try {\n    const plan\
        \ = deterministicPlanner.planMission({ missionId: 'offline-wire', taskId:\
        \ 'wire-root', objective: 'Produce fixture result', constraints: [], requiredCapabilities:\
        \ ['basic'], validation: { criteria: [{ id: 'complete', field: 'ok', expected:\
        \ true }] } }, { worker: { id: 'worker', agentId: 'worker', role: 'worker',\
        \ capabilities: ['basic'], constraints: [] }, specialists: [] });\n    const\
        \ native = compileNativePlan(plan, new Map([['worker', { agentId: 'worker',\
        \ provider: Providers.OPENAI, clientOptions: { model: 'fixture-model', apiKey:\
        \ 'fixture-only', maxRetries: 0, configuration: { baseURL: 'http://127.0.0.1:'\
        \ + server.address().port + '/v1' } } }]]));\n    const run = await Run.create({\
        \ runId: 'offline-wire', graphConfig: native.graphConfig });\n    await run.processStream({\
        \ messages: [new HumanMessage('Execute fixture only.')] }, { version: 'v2'\
        \ });\n    assert.equal(requests.length, 1);\n    assert.deepEqual(requests[0].response_format,\
        \ { type: 'json_object' });\n    const messages = run.getRunMessages();\n\
        \    const output = messages.findLast(m => typeof m.content === 'string' &&\
        \ m.content.startsWith('{'));\n    const task = plan.tasks[0];\n    const\
        \ result = await validateMissionTask({ taskId: task.taskId, nodeId: task.nodeId,\
        \ agentId: task.agentId, candidate: output.content, requirements: task.validation\
        \ });\n    assert.equal(result.verdicts[0].status, 'VERIFIED');\n    const\
        \ broken = deterministicPlanner.planMission({ missionId: 'offline-rejected',\
        \ taskId: 'rejected-root', objective: 'Check failure propagation', constraints:\
        \ [], requiredCapabilities: ['basic'], validation: { criteria: [{ id: 'ok',\
        \ field: 'ok', expected: true }] }, objectives: [{ key: 'research', objective:\
        \ 'Research', requiredCapabilities: ['basic'], dependsOn: [] }, { key: 'analysis',\
        \ objective: 'Analyze', requiredCapabilities: ['basic'], dependsOn: ['research']\
        \ }, { key: 'writing', objective: 'Write', requiredCapabilities: ['basic'],\
        \ dependsOn: ['research'] }] }, { worker: { id: 'worker', agentId: 'worker',\
        \ role: 'worker', capabilities: ['basic'], constraints: [] }, specialists:\
        \ [] });\n    const state = { evidence: {}, results: {} };\n    const rejected\
        \ = compileNativePlan(broken, new Map([['worker', { agentId: 'worker', provider:\
        \ Providers.OPENAI }]]), undefined, undefined, async result => { state.results[result.taskId]\
        \ = result; });\n    const rejectedRun = await Run.create({ runId: 'offline-rejected',\
        \ graphConfig: rejected.graphConfig });\n    rejectedRun.Graph.overrideTestModel(['##\
        \ private invalid draft']);\n    await assert.rejects(() => rejectedRun.processStream({\
        \ messages: [new HumanMessage('Execute offline fixture.')] }, { version: 'v2'\
        \ }));\n    const failure = getMissionOracleFailure(broken, state);\n    assert.equal(failure.code,\
        \ 'MISSION_ORACLE_FAILURE');\n    assert.ok(failure.message.includes('INVALID_CANDIDATE'));\n\
        \    assert.ok(!failure.message.includes('private invalid draft'));\n    assert.equal(Object.keys(state.results).length,\
        \ 1);\n    assert.equal(requests.length, 1);\n    console.log('REAL_SDK_LOOPBACK_HTTP_RESPONSE_FORMAT_AND_ORACLE=PASS;\
        \ externalInference=0; requests=1');\n    console.log('REAL_SDK_AGGREGATE_ORACLE_FAILURE_CLASSIFIER=PASS');\n\
        \  } finally { await new Promise(r => server.close(r)); }\n})().then(() =>\
        \ process.exit(0), e => { console.error(e.name + ': ' + e.message); process.exit(1);\
        \ });\n\nNODE_CONTRACT\n"
    - name: Prepare pinned browser dependencies before runtime
      run: python3 -m pip install --quiet --break-system-packages PyYAML==6.0.3 playwright==1.56.0
    - name: Exercise changed compiler and analyze plan in native runtime, real UI
        and same-stream P6
      if: matrix.arch == 'amd64'
      run: "set -euo pipefail\npython3 -m pip install --quiet --break-system-packages\
        \ PyYAML==6.0.3\npython3 - <<'PY_RUNTIME'\nimport os,subprocess,yaml\nfrom\
        \ pathlib import Path\nworkflow=yaml.safe_load(Path('.github/workflows/botmode-v1-exact-candidate-oci-probe.yml').read_text())\n\
        steps=workflow['jobs']['current-candidate-runtime']['steps']\nready=\"\"\"\
        mission_ready=0\nfor attempt in $(seq 1 60); do\n if curl -fsS --max-time\
        \ 4 http://127.0.0.1:3090/readyz >/dev/null 2>&1; then mission_ready=1; break;\
        \ fi\n sleep 2\ndone\ntest \"$mission_ready\" = 1\necho 'CI_COMPOSED_MISSION_READY=PASS'\n\
        \"\"\"\nfor name in ['Boot current candidate with disposable MongoDB','Browser\
        \ acceptance \u2014 actual candidate UI and agent selector']:\n matches=[s\
        \ for s in steps if s.get('name')==name];assert len(matches)==1\n step=matches[0];script=step['run'];assert\
        \ chr(36)+'{{' not in script\n env={**os.environ,**step.get('env',{}),'CI_MISSION_SOURCE_MODE':'1'};assert\
        \ env.get('OPENROUTER_API_KEY','ci-local-fixture-no-real-key')=='ci-local-fixture-no-real-key'\n\
        \ if name.startswith('Boot '):\n\n  anchor='conf=json.loads(path.read_text())';assert\
        \ script.count(anchor)==1\n  script=script.replace(anchor,anchor+'\\nconf[\"\
        webSearch\"]='+\"{'searchProvider': 'searxng', 'searxngInstanceUrl': '${CI_SOURCE_SEARCH_URL}',\
        \ 'searxngApiKey': '${CI_SOURCE_SEARCH_KEY}', 'scraperProvider': 'firecrawl',\
        \ 'firecrawlApiKey': '${CI_SOURCE_SCRAPE_KEY}', 'firecrawlApiUrl': '${CI_SOURCE_SCRAPE_URL}',\
        \ 'rerankerType': 'none', 'allowedAddresses': ['host.docker.internal:8088']}\"\
        )\n  anchor='python3 /tmp/botmode-ci-model-fixture.py >';assert script.count(anchor)==1\n\
        \  script=script.replace(anchor,'python3 - <<\\'PY_RESEARCH_FIXTURE\\'\\nfrom\
        \ pathlib import Path\\np=Path(\\'/tmp/botmode-ci-model-fixture.py\\')\\nlines=[]\\\
        nfor line in p.read_text().splitlines(keepends=True):\\n if line.strip().startswith(\\\
        'web_calls=\\'):\\n  lines.append(\"        turn_start=max((i for i,m in enumerate(messages)\
        \ if isinstance(m,dict) and m.get(\\'role\\')==\\'user\\'),default=-1)\\\\\
        n\")\\n  lines.append(\"        turn_messages=messages[turn_start+1:]\\\\\
        n\")\\n  line=line.replace(\\'in messages \\', \\'in turn_messages \\')\\\
        n if line.strip().startswith(\\'web_completed=\\'):\\n  line=line.replace(\\\
        'in messages \\', \\'in turn_messages \\')\\n lines.append(line)\\np.write_text(\\\
        '\\'.join(lines))\\ncompile(p.read_text(),str(p),\\'exec\\')\\nprint(\\'CI_RESEARCH_FIXTURE_FRESH_TURN_WINDOW=PASS\\\
        ')\\nPY_RESEARCH_FIXTURE\\n'+anchor)\n  script=script.replace('python3 /tmp/botmode-ci-model-fixture.py\
        \ >', 'python3 scripts/botmode/test-ci-fixture-stream.py /tmp/botmode-ci-model-fixture.py\\\
        npython3 /tmp/botmode-ci-model-fixture.py >')\n  env_patch=\"python3 - <<'PY_SEARCH_AUTH_ENV'\\\
        nfrom pathlib import Path\\nimport yaml\\np=Path('docker-compose.botmode.yml');conf=yaml.safe_load(p.read_text());env=conf['services']['api']['environment']\\\
        nassert isinstance(env,list)\\nfor key,value in {'CI_SOURCE_SEARCH_URL':'http://host.docker.internal:8088','CI_SOURCE_SEARCH_KEY':'ci-local-only','CI_SOURCE_SCRAPE_KEY':'ci-local-only','CI_SOURCE_SCRAPE_URL':'http://host.docker.internal:8088'}.items():\\\
        n assert not any(x.startswith(key+'=') for x in env)\\n env.append(key+'='+value)\\\
        np.write_text(yaml.safe_dump(conf,sort_keys=False))\\nprint('CI_SYNTHETIC_SEARCH_ENV_REFERENCES_INSTALLED=PASS')\\\
        nPY_SEARCH_AUTH_ENV\\n\"\n  boot_anchor='docker compose -f docker-compose.botmode.yml\
        \ -f docker-compose.botmode-lite.yml up -d';assert script.count(boot_anchor)==1\n\
        \  script=script.replace(boot_anchor,env_patch+boot_anchor)\n  anchor=\"if\
        \ endpoint.get('name') == 'OpenRouter':\";assert script.count(anchor)==1;script=script.replace(anchor,'if\
        \ True:')\n  anchor=\"endpoint['models'] = {'fetch': False, 'default': ['openrouter/free']}\"\
        ;assert script.count(anchor)==1\n  script=script.replace(anchor,anchor+\"\\\
        n        endpoint.setdefault('customParams',{})['defaultParamsEndpoint']='openAI'\"\
        )\n  anchor='test -s /tmp/botmode-ci-child-id';assert script.count(anchor)==1;script=script.replace(anchor,anchor+'\\\
        n'+ready)\n else:\n  anchor='valid=(len(tasks)==5 and len(expected)==5 and\
        \ None not in expected'\n  assert script.count(anchor)==1,'UI_ANALYZE_TASK_COUNT_GUARD'\n\
        \  script=script.replace(anchor,\"valid=(len(tasks)==3 and len(expected)==3\
        \ and {t.get('key') for t in tasks}=={'research','analysis','synthesis'} and\
        \ None not in expected\")\n  script=script.replace('CI_BROWSER_FIVE_VERDICTS_VALID','CI_BROWSER_ANALYZE_VERDICTS_VALID').replace('CI_BROWSER_FIVE_TASK_VERDICTS_VERIFIED','CI_BROWSER_ANALYZE_TASK_VERDICTS_VERIFIED')\n\
        \  script=ready+script\n if name.startswith('Browser '):\n  anchor='    page.close()';assert\
        \ script.count(anchor)==1\n  script=script.replace(anchor,'    page.wait_for_function(\"\
        new URLSearchParams(window.location.search).get(\\'botmode\\') === \\'1\\\
        ' && new URLSearchParams(window.location.search).get(\\'botmode_mode\\') ===\
        \ \\'analyze\\' && new URLSearchParams(window.location.search).get(\\'botmode_agent_mode\\\
        ') === \\'auto\\'\")\\n    print(\\'CI_BROWSER_MISSION_CONTEXT_RETAINED_AFTER_SETTLEMENT=PASS\\\
        ',flush=True)\\n'+anchor)\n\n if name.startswith('Browser '):\n  marker='\
        \    page.close()';assert script.count(marker)==1\n  script=script.replace(marker,\"\
        \    assert request.get('botMode',{}).get('mode')=='analyze', 'CI_BROWSER_SETTINGS_NOT_SENT'\\\
        n    saved=page.request.get('/api/convos/'+admitted['streamId'],headers={'Authorization':'Bearer\
        \ '+token})\\n    assert saved.status==200, 'CI_BROWSER_SAVED_CONVERSATION_UNAVAILABLE'\\\
        n    saved_settings=saved.json().get('botMode')\\n    assert saved_settings==request['botMode'],\
