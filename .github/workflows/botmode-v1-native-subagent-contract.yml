name: BOTMODE V1 Exact HEAD Native Subagent Contract Gate

on:
  workflow_dispatch:
    inputs:
      c2_only:
        description: Run the C2 SIGKILL integration without repeating earlier PASS tests
        type: boolean
        default: false
      c3_only:
        description: Run the C3 Ideas Projects Chat and specialist UI contracts only
        type: boolean
        default: false
      c3_ui_only:
        description: Requalify C3 React tests only after building the client package
        type: boolean
        default: false
      free_hosted_only:
        description: One provider-hosted zero-price model tool-call smoke, without builds or paid fallback
        type: boolean
        default: false
      specialist_onboarding_only:
        description: Validate six true specialist prompts, tool boundaries, Mongo and HTTP ACL without E2E reruns
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/botmode-v1-native-subagent-contract.yml'

permissions:
  contents: read

jobs:
  specialist-onboarding:
    if: ${{ inputs.specialist_onboarding_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact candidate source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = simplify/botmode-v1-lot-a-20261102
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install clean locked dependencies and build native backend libraries
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api
      - name: Test six role prompts, exact tool ACL, legacy agent detection and Mongo persistence
        working-directory: api
        run: |
          set -euo pipefail
          npx jest --ci --runInBand --coverage=false --runTestsByPath \
            server/routes/agents/botmodeSetupValidation.spec.js \
            server/routes/agents/botmodeSetupRoute.spec.js \
            server/routes/agents/botmodeSetupMongo.spec.js
          echo 'BOTMODE_V1_SPECIALIST_PROMPTS_AND_ZERO_TOOL_WORKER=PASS'
      - name: Verify lockfile and source remain unchanged
        run: |
          test -z "$(git status --porcelain -- package-lock.json api/server/routes/agents/v1.js)"
          echo 'BOTMODE_V1_ROLE_SOURCE_REPRODUCIBLE=PASS'
  free-hosted-compatibility:
    if: ${{ inputs.free_hosted_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact candidate source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = simplify/botmode-v1-lot-a-20261102
      - name: One free hosted model tool-call without paid fallback
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -B scripts/botmode/ci-hosted-free-model-tool-smoke.py
  native-subagent-contract:
    if: ${{ !inputs.free_hosted_only && !inputs.specialist_onboarding_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:4.4.29
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build packages
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:api
      - name: Build existing client package for React Jest imports
        if: ${{ inputs.c3_only || inputs.c3_ui_only }}
        run: npm run build:client-package
      - name: Execute native parent-subagent-parent model contract
        if: ${{ !inputs.c2_only && !inputs.c3_only && !inputs.c3_ui_only }}
        working-directory: packages/api
        run: |
          npx jest --ci --runInBand --coverage=false --runTestsByPath src/agents/__tests__/custom-endpoint-tenant.e2e.test.ts
          echo 'BOTMODE_NATIVE_PARENT_CHILD_PARENT_CONTRACT=PASS'
      - name: Verify simplified V1 direct, research-analysis, Oracle and P6 contracts
        if: ${{ !inputs.c2_only && !inputs.c3_only && !inputs.c3_ui_only }}
        working-directory: packages/api
        run: |
          npx jest --ci --runInBand --coverage=false --runTestsByPath \
            src/agents/orchestrator/native.spec.ts \
            src/agents/orchestrator/research.spec.ts \
            src/agents/orchestrator/publication.spec.ts \
            src/agents/orchestrator/synthesisReadiness.integration.spec.ts \
            src/agents/orchestrator/authorization.spec.ts
          echo 'BOTMODE_C1_OFFLINE_ORCHESTRATION_AND_PUBLICATION=PASS'
      - name: Reject uncertain provider replay after cold restart
        if: ${{ !inputs.c2_only && !inputs.c3_only && !inputs.c3_ui_only }}
        run: |
          node scripts/botmode/native-no-auto-cold-provider-replay-regression.cjs
          node scripts/botmode/native-outcome-unknown-regression.cjs
          node scripts/botmode/native-outcome-unknown-redis-regression.cjs
      - name: Prove durable Mongo boundary cannot authorize replay alone
        if: ${{ !inputs.c2_only && !inputs.c3_only && !inputs.c3_ui_only }}
        working-directory: packages/api
        run: |
          npx jest --ci --runInBand --coverage=false --runTestsByPath \
            src/agents/checkpointer.integration.spec.ts \
            --testNamePattern='B3 safety: a checkpoint head cannot distinguish pending from already-started provider execution'
      - name: C2 real process SIGKILL with isolated Mongo and Redis
        if: ${{ !inputs.c3_only && !inputs.c3_ui_only }}
        env:
          C2_MONGO_URI: mongodb://127.0.0.1:27017/botmode_c2_isolated
          C2_REDIS_URI: redis://127.0.0.1:6379
        run: |
          node scripts/botmode/native-outcome-unknown-sigkill-integration.cjs
      - name: Confirm uncertain outcome warning in LibreChat UI
        if: ${{ !inputs.c2_only && !inputs.c3_only && !inputs.c3_ui_only }}
        working-directory: client
        run: |
          npx jest --ci --runInBand --coverage=false --runTestsByPath \
            src/hooks/Messages/__tests__/unknownOutcomeRetry.spec.tsx \
            src/components/Messages/Content/Error.outcomeUnknown.spec.tsx
      - name: C3 API access, specialist selection and project evidence contracts
        if: ${{ inputs.c3_only }}
        working-directory: api
        run: |
          npx jest --ci --runInBand --coverage=false --runTestsByPath \
            server/routes/projects.botmode.test.js \
            server/services/Projects/__tests__/botModeProjectProjection.spec.js \
            server/routes/agents/botmodeSetupRoute.spec.js \
            server/routes/agents/botmodeSetupValidation.spec.js \
            server/controllers/agents/orchestratorMissionBindings.spec.js
          echo 'BOTMODE_C3_API_AUTH_PROJECTION_SELECTION=PASS'
      - name: C3 Ideas Projects Chat visual contracts
        if: ${{ inputs.c3_only || inputs.c3_ui_only }}
        working-directory: client
        run: |
          npx jest --ci --runInBand --coverage=false --runTestsByPath \
            src/components/Ideas/IdeasView.test.tsx \
            src/components/Projects/BotModeProjectPanel.test.tsx \
            src/components/Chat/BotModeProgress/BotModeProgressPanel.spec.tsx \
            src/components/Chat/Header.botMode.spec.tsx
          echo 'BOTMODE_C3_UI_IDEA_PROJECT_CHAT=PASS'
      - name: Evidence boundary
        if: always()
        run: |
          echo 'Proves native SDK root tool-use -> child call -> parent final and tenant propagation under deterministic fetch mock on exact PR HEAD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does NOT prove deployed GHCR image, durable child task identity, Oracle acceptance, or final publication in the same run.' >> "$GITHUB_STEP_SUMMARY"
